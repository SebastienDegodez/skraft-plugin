name: Site CI

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'eng/**'
      - 'plugins/skraft-framework/**'
      - 'tests/skills/**'
      - 'tests/dashboard/**'
      - 'tests/tooling/documentation/**'
      - 'scripts/scan-drift.mjs'
      - 'scripts/lib/book.mjs'
      - 'scripts/check-citations.mjs'
      - 'tests/site/**'
      - 'eng/docs/**'
      - 'tests/dashboard/doc-versions.unit.test.mjs'

jobs:
  lint-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Citation lint
        run: node scripts/check-citations.mjs --citations docs/website/data/citations.yml --pages "docs/site/**/*.md"

      # The dashboard tooling tests import @microsoft/vally and @github/copilot-sdk,
      # both devDependencies: without them `node --test` cannot even resolve the
      # module graph, and the step fails on an import error rather than on a finding.
      - name: Install Node dependencies
        run: npm install

      - name: Catalogue and drift controls
        run: node eng/catalog/scan.mjs

      # Off until WP2 runs scan-drift on the new tree (docs/website/book.yml against docs/website/docs):
      # with --site-root docs/site it reports every page of the book as missing.
      - name: Drift scan
        if: false
        run: node scripts/scan-drift.mjs --out "$RUNNER_TEMP/skraft-docs-ledger.json"

      - name: Dashboard and drift-order tests
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/lib/gh-annotations-reporter.mjs --test-reporter-destination=stdout \
            tests/dashboard/*.test.mjs tests/tooling/documentation/scan-drift-order.test.mjs

  # Off: the Jekyll stub no longer serves /fr/, /en/ or /fr/explanation/pipeline/. WP7/WP10 restore the
  # site smoke tests on Docusaurus.
  smoke-tests:
    if: false
    runs-on: ubuntu-latest
    needs: lint-citations
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs/site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test
        env:
          CI: true
