name: Site CI

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'eng/**'
      - 'plugins/skraft-framework/**'
      - 'tests/skills/**'
      - 'tests/dashboard/**'
      - 'scripts/scan-drift.mjs'
      - 'scripts/lib/book.mjs'
      - 'scripts/check-citations.mjs'
      - 'tests/site/**'

jobs:
  lint-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Citation lint
        run: node scripts/check-citations.mjs --citations docs/site/_data/citations.yml --pages "docs/site/**/*.md"

      # The dashboard tooling tests import @microsoft/vally and @github/copilot-sdk,
      # both devDependencies: without them `node --test` cannot even resolve the
      # module graph, and the step fails on an import error rather than on a finding.
      - name: Install Node dependencies
        run: npm ci

      - name: Catalogue and drift controls
        run: |
          node eng/catalog/scan.mjs
          node scripts/scan-drift.mjs --out "$RUNNER_TEMP/skraft-docs-ledger.json"
          node --test tests/dashboard/*.test.mjs tests/skraft-framework/scan-drift-order.test.mjs

  smoke-tests:
    runs-on: ubuntu-latest
    needs: lint-citations
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs/site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test
        env:
          CI: true
