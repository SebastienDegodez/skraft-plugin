name: skraft-test-harness

on:
  push:
    paths:
      - 'tools/skraft-test-harness/**'
      - 'tests/skraft-plugin/**'
      - '.github/workflows/skraft-test-harness.yml'
  pull_request:
    paths:
      - 'tools/skraft-test-harness/**'
      - 'tests/skraft-plugin/**'
      - '.github/workflows/skraft-test-harness.yml'
  workflow_dispatch:
    inputs:
      run_live_evals:
        description: 'Run the live workflow evals against the real Copilot CLI (consumes model quota)'
        type: boolean
        default: false

jobs:
  test:
    name: Test (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: ['10.0.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build
        working-directory: tools/skraft-test-harness
        run: dotnet build -v quiet

      - name: Unit Tests
        working-directory: tools/skraft-test-harness
        run: dotnet run --project tests/SkraftTestHarness.UnitTest --no-build

      - name: Integration Tests
        working-directory: tools/skraft-test-harness
        run: dotnet run --project tests/SkraftTestHarness.IntegrationTest --no-build

      # Deterministic phase-checkpoint conformance gate (no agent, no LLM, no
      # quota). Fails the build when a committed checkpoint drifts from the
      # artefact format the next 5D phase expects.
      - name: Verify phase checkpoints
        working-directory: tools/skraft-test-harness
        run: |
          for piste in order-checkout promotion-stacking; do
            dotnet run --project src/SkraftTestHarness.Cli --no-build -- \
              verify-checkpoint \
              --tests-dir "../../tests/skraft-plugin/phase-conformance/${piste}" \
              --fixtures-root ./fixtures
          done

      # Deterministic gate-file validation (no agent, no LLM, no quota): every
      # eval.skraft.yml parses and every assertion (craft_conformance,
      # conditional, artifact_contract, …) constructs. Fails the build on a
      # malformed gate file.
      - name: Validate gate files
        working-directory: tools/skraft-test-harness
        run: |
          while IFS= read -r gate; do
            dir=$(dirname "$gate")
            echo "::group::$dir"
            dotnet run --project src/SkraftTestHarness.Cli --no-build -- \
              run-gate --skill skraft-orchestrator \
              --tests-dir "../../$dir" --validate-only
            echo "::endgroup::"
          done < <(cd ../.. && find tests/skraft-plugin -name eval.skraft.yml | sort)

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.dotnet }}
          path: tools/skraft-test-harness/**/*.xml
          if-no-files-found: ignore

  # Opt-in: drives the REAL copilot CLI against the workflow eval suites.
  # Manual only (workflow_dispatch) so push/PR CI never consumes model quota.
  # Requires a Copilot-enabled token exposed as the COPILOT_GITHUB_TOKEN secret.
  live-evals:
    name: Live workflow evals (real Copilot CLI)
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish the agent verdict to the dashboard data branch.
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_evals }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Build
        working-directory: tools/skraft-test-harness
        run: dotnet build -v quiet

      - name: Run live integration tests
        working-directory: tools/skraft-test-harness
        env:
          SKRAFT_COPILOT_LIVE: '1'
          # The Copilot CLI reads its token from the environment; it accepts
          # COPILOT_GITHUB_TOKEN, GH_TOKEN, or GITHUB_TOKEN.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: dotnet run --project tests/SkraftTestHarness.IntegrationTest --no-build

      - name: Run the 5D pipeline eval suites (functionality + conformance)
        working-directory: .
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          # The pipeline always launches from the orchestrator, one phase at a
          # time, in order, for each story (piste). Each suite verifies what the
          # agent actually produced.
          for piste in order-checkout promotion-stacking; do
            for phase in 01-DISCOVER 02-DISCUSS 03-DESIGN 04-DISTILL 05-DELIVER; do
              dir="tests/skraft-plugin/pipeline/${piste}/${phase}"
              [ -d "$dir" ] || continue
              dotnet run --project tools/skraft-test-harness/src/SkraftTestHarness.Cli -- \
                evaluate --skill skraft-orchestrator \
                --tests-dir "$dir" \
                --plugin-dir plugins --agent skraft:skraft-orchestrator \
                --fixtures-root tools/skraft-test-harness/fixtures \
                --report-dir ./eval-reports
            done
          done

      - name: Run the absolute workflow gates (run-gate)
        working-directory: .
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          # Absolute PASS/FAIL gate per phase: the orchestrator runs the phase
          # for real and we assert its gates (craft conformance, mutation,
          # opt-in Microcks + propagation) hold. Every eval.skraft.yml found.
          while IFS= read -r gate; do
            dir=$(dirname "$gate")
            dotnet run --project tools/skraft-test-harness/src/SkraftTestHarness.Cli -- \
              run-gate --skill skraft-orchestrator \
              --tests-dir "$dir" \
              --plugin-dir plugins --agent skraft:skraft-orchestrator \
              --fixtures-root tools/skraft-test-harness/fixtures \
              --report-dir eval-reports
          done < <(find tests/skraft-plugin -name eval.skraft.yml | sort)

      - name: Build dashboard data
        if: always()
        working-directory: .
        run: |
          # Fold every eval/gate report into a single dashboard-data.json for the
          # harness's own local viewer (tools/skraft-test-harness/dashboard).
          # Generated here, never committed.
          dotnet run --project tools/skraft-test-harness/src/SkraftTestHarness.Cli -- \
            dashboard --reports-dir eval-reports --out dashboard-data.json

      # Vally environments load skills, not custom agents, so the published
      # dashboard gets its AGENT evidence from here. The reports are folded into
      # the same verdict shape the Vally adapter produces for a skill, judged by
      # the same sign test, and published to the same branch.
      - name: Publish the agent verdict to the dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          node eng/harness-adapter/adapt.mjs --reports-dir eval-reports --agent skraft-orchestrator
          results=(eval-results/agents/*/results.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::warning::No agent verdict was produced; nothing to publish."
            exit 0
          fi
          ./eng/dashboard/publish.sh \
            $(printf -- '--results %s ' "${results[@]}") \
            --commit "${{ github.sha }}" \
            --run "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload dashboard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: dashboard-data.json
          if-no-files-found: ignore

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-reports
          path: eval-reports/**/*.json
          if-no-files-found: ignore
