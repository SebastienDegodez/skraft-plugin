name: Skill evaluation

# One workflow, three jobs, deliberately split by cost:
#
#   lint        — on every pull request. Structural checks only, no model is
#                 called, so it never consumes Copilot quota.
#   plan        — lists the subjects to evaluate: what a PR changed, or every
#                 spec on a schedule. Skipped for fork PRs (no secrets there).
#   evaluate-subject — one runner per subject, all in parallel, each running
#                 its baseline and skilled arms side by side.
#   evaluate-pr — gathers the PR's cells, keeps ONE verdict comment on the PR
#                 up to date, and blocks merge only on a credible skill
#                 regression.
#   A companion workflow publishes complete PR verdicts and trajectories from
#   trusted default-branch code, then removes trajectories when the PR closes.
#   publish     — scheduled or dispatched. Gathers the cells (every skill run
#                 twice, baseline vs skilled; every agent suite once) and
#                 publishes verdicts and recorded agent sessions to the
#                 `dashboard-data` branch.
#   compare-*   — dispatched with `models`. Runs the same skill(s) once per
#                 agent model, all scored by one pinned judge, so the dashboard
#                 can show which model the skill actually helps.
#
# No job sets RUNS: each eval spec budgets its own trials through
# `defaults.runs`, and overriding it here would silently make every verdict
# underpowered.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/com.github.copilot/agents/**'
      - 'plugins/skraft-framework/plugin.json'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'tests/skills/**'
      - 'tests/agents/**'
      - 'tests/dashboard/**'
      - 'eng/**'
      - '.github/workflows/skill-evaluation.yml'
  schedule:
    # Monday, 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Evaluate a single skill (directory name under plugins/skraft-framework/skills). Leave empty for all.'
        type: string
        required: false
      models:
        description: 'Comma-separated agent models to compare, e.g. gpt-5.6-luna,claude-sonnet-5. Leave empty to run the ordinary single-model evaluation instead.'
        type: string
        required: false
      judge_model:
        description: 'The one judge that scores every arm. Arms scored by different judges are not on the same scale and are never compared.'
        type: string
        required: false
        default: gpt-5.6-terra

permissions:
  contents: read

concurrency:
  group: skill-evaluation-${{ github.ref }}
  # A new push makes a running PR evaluation stale: its verdict would describe a
  # commit nobody will merge. Cancel it instead of queueing the fresh run behind
  # up to 150 minutes of obsolete work. Scheduled and dispatched runs are never
  # cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALLY_PACKAGE: '@microsoft/vally-cli@0.12.0'
  # vally-cli 0.12.0 depends on @github/copilot-sdk via a floating `^1.0.7`
  # range, and @github/copilot-sdk@1.0.9 in turn depends on @github/copilot via
  # a floating `^1.0.78`. Both must be pinned, and the pin must be on
  # @github/copilot itself — never on one of its platform binaries. Each
  # @github/copilot release locks its optionalDependencies to its own exact
  # version, so pinning `@github/copilot-linux-x64@1.0.78` next to a floating
  # @github/copilot that resolves to 1.0.83 puts the two in conflict: the
  # optional 1.0.83 binary is silently skipped and the SDK fails at run time
  # with `Could not resolve a @github/copilot platform package`. Pinning
  # @github/copilot lets npm install the matching platform binary for whatever
  # runner the job lands on, Linux or otherwise.
  #
  # WHERE the three are installed matters as much as the pins. The SDK finds
  # the CLI with `import.meta.resolve('@github/copilot-<platform>-<arch>/sdk')`
  # from its OWN file, so the platform binary has to sit in a `node_modules`
  # on the SDK's parent chain. `npm install -g` does not put it there: it
  # leaves the binary nested at
  # `lib/node_modules/@github/copilot/node_modules/@github/copilot-linux-x64`,
  # invisible from the sibling `lib/node_modules/@github/copilot-sdk`, and
  # every run dies with `Could not resolve a @github/copilot platform package`.
  # A project-tree install hoists all three flat under `node_modules/@github/`,
  # where resolution succeeds — so these are installed with `npm install
  # --no-save` and reached through `node_modules/.bin`, never with `-g`.
  COPILOT_SDK_PACKAGE: '@github/copilot-sdk@1.0.9'
  COPILOT_CLI_PACKAGE: '@github/copilot@1.0.78'
  JUDGE_MODEL: gpt-5.6-luna
  DATA_BRANCH: dashboard-data
  RETENTION_DAYS: '14'
  VALLY_TELEMETRY_OPTOUT: '1'

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the Vally CLI
        run: npm install -g "$VALLY_PACKAGE"

      - name: Install project dependencies
        run: npm install

      - name: Dashboard tooling tests
        run: node --test tests/dashboard/*.test.mjs

      - name: Scan the plugin catalogue
        run: node eng/catalog/scan.mjs

      - name: Fail on a catalogue finding
        run: |
          node -e "
            const { findings } = require('./artifacts/catalog/report.json');
            for (const finding of findings) console.log(\`::warning file=\${finding.path}::[\${finding.code}] \${finding.message}\`);
            if (findings.length) {
              console.log(\`::error::The catalogue scan reported \${findings.length} finding(s); fix them or adjust the skill.\`);
              process.exit(1);
            }
          "

      # Advisory, not blocking. Vally's `valid-refs` check rejects any link that
      # leaves a skill's own directory, which SKRAFT's roster → adapter skills do
      # deliberately (a roster's whole job is to point at its adapters).
      - name: Lint the shipped skills (advisory)
        continue-on-error: true
        run: vally lint plugins/skraft-framework/skills

      - name: Check every experiment file points at something real
        # `vally experiment run --dry-run` validates structure and the `vary`
        # invariant but not the targets, so a mistyped skill path yields an arm
        # with nothing mounted — which reads downstream exactly like "the skill
        # did not help". Silent, and fatal to the conclusion.
        run: node eng/check-experiment-paths.mjs

      - name: Lint every evaluation spec
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(tests/skills/*/eval.yaml)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No evaluation spec to lint."
            exit 0
          fi
          for spec in "${specs[@]}"; do
            echo "::group::$spec"
            vally lint --eval-spec "$spec" --strict
            echo "::endgroup::"
          done

  # ── One runner per subject ──────────────────────────────────────────────────
  # PR, scheduled and dispatched runs share the same three steps: plan which
  # subjects to run, evaluate each one on its own runner, then gather every
  # cell's evidence in one job that alone posts or publishes it. Running the
  # cells side by side is what turns "sum of every eval" into "longest eval":
  # a PR touching three skills used to wait for three skill evals in a row.

  plan:
    name: Plan the evaluation matrix
    # Fork PRs have no access to COPILOT_GITHUB_TOKEN, so skip rather than fail.
    # A dispatch that names models wants the comparison below, not this path.
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && inputs.models == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The skip list is applied here, so a parked suite never costs a runner.
      - name: List the subjects to evaluate
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Read from the environment, never interpolated into the shell.
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            node eng/plan-eval-matrix.mjs --base "$BASE" --head "$HEAD" > matrix.json
          elif [ -n "${SKILL:-}" ]; then
            node eng/plan-eval-matrix.mjs --subject "$SKILL" > matrix.json
          else
            node eng/plan-eval-matrix.mjs --all > matrix.json
          fi
          count=$(node -p 'require("./matrix.json").include.length')
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## Evaluation plan — $count subject(s)"
            echo
            node -e 'for (const { kind, name } of require("./matrix.json").include) console.log(`- ${kind}: \`${name}\``)'
          } >> "$GITHUB_STEP_SUMMARY"

  evaluate-subject:
    name: Evaluate ${{ matrix.kind }} · ${{ matrix.name }}
    # A spec the linter rejects still runs, and still bills an hour of live model
    # time, to produce a verdict about an instrument that was never wired. The
    # `rubric` under `graders[].config` was exactly that: silently ignored by
    # Vally, silently replaced by its default rubric, and only caught by a lint
    # job that finished forty minutes before the evaluation it should have
    # stopped. Gate the spend on the static check. `plan` runs beside `lint`, so
    # waiting on both costs nothing extra.
    needs: [lint, plan]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # Each spec budgets its own trials, so the wall clock follows the spec, not
    # a flat one-trial-per-stimulus floor.
    timeout-minutes: 150
    # Ordinary runs resolve MODEL from each eval spec. Keeping it explicitly
    # blank here prevents a workflow-level default from overriding every spec.
    # Only compare-models below is allowed to force MODEL.
    env:
      MODEL: ''
    permissions:
      contents: read
    strategy:
      # One subject erroring must not cancel the subjects that would have
      # produced evidence; the aggregation job reports every cell.
      fail-fast: false
      # Every cell runs two arms × WORKERS agent sessions at once against the
      # same Copilot token. Cap the fan-out so a PR that touches every agent
      # descriptor does not trade wall clock for rate-limit retries.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The Spring Boot fixtures run `mvn verify` at setup and compile for Java 21;
      # the runner image's default JDK is not guaranteed to be 21. Caching the
      # local Maven repository spares every cell the same dependency download.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: matrix.kind == 'skill'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'tests/skills/**/fixtures/**/pom.xml'

      # The Python fixtures install themselves into a virtual environment at setup
      # (`pip install -e ".[dev]"`); the pip cache spares every cell the download.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.kind == 'skill'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'tests/skills/**/fixtures/**/pyproject.toml'

      # No lockfile, so setup-node's own npm cache cannot be used. Keying on the
      # three pins means a toolchain bump never restores a stale tree.
      - name: Cache the npm download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-eval-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ env.VALLY_PACKAGE }}-${{ env.COPILOT_SDK_PACKAGE }}-${{ env.COPILOT_CLI_PACKAGE }}
          restore-keys: |
            npm-eval-${{ runner.os }}-

      # Skill and agent-suite executors drive a real agent through
      # @github/copilot-sdk, so the CLI, the SDK and Vally must share one
      # resolution root. See the `env` block for why that root is the project
      # tree and never the global prefix.
      - name: Install the evaluation toolchain
        run: |
          npm install --no-save --prefer-offline --no-audit --no-fund \
            "$VALLY_PACKAGE" "$COPILOT_SDK_PACKAGE" "$COPILOT_CLI_PACKAGE"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run the ${{ matrix.kind }} evaluation
        env:
          # A fine-grained PAT with the "Copilot Requests" account permission.
          # The auto-generated GITHUB_TOKEN cannot reach Copilot. The runner
          # re-exports it under every name Vally 0.12.0 and the spawned Copilot
          # runtime read.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # `skills <name>` or `agents <name>`, built by eng/plan-eval-matrix.mjs.
          RUNNER_ARGS: ${{ matrix.args }}
          KIND: ${{ matrix.kind }}
          NAME: ${{ matrix.name }}
        run: |
          set -uo pipefail
          read -r -a args <<< "$RUNNER_ARGS"
          # GitHub runs this step under `bash -e`: a bare failing command would end
          # the step before its status is read, and the agent branch below would
          # never run. `|| status=$?` keeps the runner's exit code without exiting.
          status=0
          ./eng/run-vally-evals.sh "${args[@]}" || status=$?
          # A suite scoring under its threshold makes the runner exit non-zero.
          # Agent verdicts are advisory by contract, so record it and let the
          # comment report it; a skill cell that errors still fails.
          if [ "$status" -ne 0 ] && [ "$KIND" = "agent" ]; then
            echo "::warning::Agent suite $NAME did not meet its threshold or errored; see the evaluation report."
            exit 0
          fi
          exit "$status"

      - name: Upload this subject's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: eval-results/
          if-no-files-found: warn
          # Only the aggregation job below reads it; the merged artifact is the
          # one that is kept.
          retention-days: 1
          overwrite: true

  evaluate-pr:
    # Same job id and name as before the matrix split, so a required status
    # check keeps pointing at the job that carries the regression gate.
    name: Pre-merge evaluation (changed skills and agent suites only)
    needs: [plan, evaluate-subject]
    # Runs when a cell failed too: the cells that did finish are still evidence,
    # and the comment must say which subject errored.
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
      && needs.evaluate-subject.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Every cell wrote eval-results/<subject>/, so merging them rebuilds the
      # exact layout a single sequential run used to produce.
      - name: Collect every subject
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eval-part-*
          path: eval-results
          merge-multiple: true

      # evaluation-evidence.yml looks for exactly this name to publish the PR's
      # verdicts and trajectories from trusted code.
      - name: Upload trajectories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-pr-${{ github.event.pull_request.number }}
          path: eval-results/
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

      - name: Build the PR comment
        run: |
          node eng/build-pr-comment.mjs --results-dir eval-results --out pr-comment.md
          # The PR comment is replaced on every run; the run summary keeps this
          # run's verdicts for anyone comparing pushes.
          cat pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      # One evaluation comment per PR, updated in place. A hidden marker finds
      # it again; a comment posted before the marker existed is adopted rather
      # than duplicated.
      - name: Post or update the PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- skraft:skill-evaluation -->'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const sha = context.payload.pull_request.head.sha
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              fs.readFileSync('pr-comment.md', 'utf8').trimEnd(),
              '',
              `<sub>Evaluated at \`${sha.slice(0, 7)}\` · [workflow run](${runUrl}) · ${new Date().toISOString()} — ` +
                'this comment is replaced by every new evaluation of this PR; each run summary keeps its own verdicts.</sub>',
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const fromThisWorkflow = (comment) => comment.user?.login === 'github-actions[bot]'
            const tagged = comments.filter((comment) => fromThisWorkflow(comment) && comment.body?.includes(marker))
            const legacy = comments.filter((comment) => fromThisWorkflow(comment) &&
              /^## (Skill evaluation — baseline vs skilled|Agent conformance)/.test(comment.body ?? ''))
            const target = (tagged.length ? tagged : legacy).at(-1)

            if (target) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: target.id, body })
              core.info(`Updated ${target.html_url}`)
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body })
              core.info(`Created ${data.html_url}`)
            }

      - name: Fail on a regression
        if: ${{ !cancelled() }}
        run: node eng/check-pr-regressions.mjs --results-dir eval-results

  publish:
    name: Publish verdicts and sessions
    needs: [plan, evaluate-subject]
    # Runs even when a cell failed: the subjects that did finish are evidence.
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
      && needs.evaluate-subject.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with dashboard-data-compact.yml: a publication and a history
    # compaction must never interleave on the evidence branch. Only this short
    # job holds the lock now, not the hours of evaluation before it.
    concurrency:
      group: dashboard-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Collect every subject
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eval-part-*
          path: eval-results
          merge-multiple: true

      - name: Upload trajectories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Publish verdicts and sessions to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(eval-results/*/results.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::warning::No verdict was produced; nothing to publish."
            exit 0
          fi

          args=()
          for result in "${results[@]}"; do args+=(--results "$result"); done
          # Scan the whole output root: the session logs sit under
          # eval-results/<skill>/<variant>/, one subtree per evaluated spec.
          args+=(--replay-from eval-results)

          ./eng/dashboard/publish.sh "${args[@]}" \
            --commit "${{ github.sha }}" \
            --run "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summarise the run
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Evaluation verdicts"
            echo
            echo "| Subject | Verdict | Evidence |"
            echo "| --- | --- | --- |"
            for result in eval-results/*/results.json; do
              node -e "
                const { verdicts = [] } = require('./$result');
                for (const verdict of verdicts) {
                  const state = !verdict.conclusive || verdict.underpowered ? 'inconclusive'
                    : verdict.passed ? 'pass' : verdict.flaky ? 'flaky' : verdict.regressed ? 'regression' : 'no improvement';
                  console.log(\`| \${verdict.subject.kind}: \${verdict.subject.name} | \${state} | \${verdict.reason} |\`);
                }
              "
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Model comparison ────────────────────────────────────────────────────────
  # One skill, one judge, several agent models. Splitting it into three jobs is
  # deliberate: the arms must run in parallel to stay inside a sane wall clock,
  # but the evidence branch must be written exactly once, so publication is its
  # own job and it alone holds the `dashboard-data` lock.

  compare-matrix:
    name: Resolve the model arms
    if: github.event_name == 'workflow_dispatch' && inputs.models != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      arms: ${{ steps.parse.outputs.arms }}
    steps:
      - id: parse
        env:
          # Read from the environment, never interpolated into the shell, so a
          # dispatch input cannot become a command.
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          arms=$(node -e "
            const arms = [...new Set((process.env.MODELS ?? '').split(',').map((model) => model.trim()).filter(Boolean))];
            if (arms.length < 2) {
              console.error(\`::error::A comparison needs at least two models; got \${arms.length}.\`);
              process.exit(1);
            }
            console.log(JSON.stringify(arms));
          ")
          echo "arms=$arms" >> "$GITHUB_OUTPUT"
          echo "Comparing: $arms"

  compare-models:
    name: ${{ matrix.model }} versus baseline
    needs: compare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One failing arm must not erase the arms that did produce evidence.
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.compare-matrix.outputs.arms) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The Spring Boot fixtures run `mvn verify` at setup and compile for Java 21;
      # the runner image's default JDK is not guaranteed to be 21.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # See the `env` block: the project tree is the only layout where the SDK
      # can resolve the @github/copilot platform binary.
      - name: Install the evaluation toolchain
        run: |
          npm install --no-save "$VALLY_PACKAGE" "$COPILOT_SDK_PACKAGE" "$COPILOT_CLI_PACKAGE"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run the skill twice on ${{ matrix.model }} and judge the pair
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SKILL: ${{ inputs.skill }}
          # The arm under test varies; the judge is pinned for every arm, which
          # is the only thing that makes the arms comparable at all.
          MODEL: ${{ matrix.model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          # A comparison is about skills. An agent suite is single-arm and pins
          # its own model, so running it per arm would publish the same verdict
          # several times.
          SKIP_AGENTS: '1'
          RESULTS_DIR: ${{ github.workspace }}/eval-results/model-compare/${{ matrix.model }}
        run: ./eng/run-vally-evals.sh ${SKILL:+"$SKILL"}

      - name: Upload this arm
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-arm-${{ matrix.model }}
          path: eval-results/model-compare/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 14

  publish-comparison:
    name: Publish the model comparison
    needs: compare-models
    # Runs even when an arm failed: the arms that did finish are still evidence.
    if: always() && needs.compare-models.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    # Shared with dashboard-data-compact.yml and the `evaluate` job: a
    # publication and a history compaction must never interleave.
    concurrency:
      group: dashboard-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Collect every arm
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: model-arm-*
          path: eval-results/model-compare

      - name: Publish the arms to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # One level deeper than the single-model layout: <arm>/<skill>/results.json.
          results=(eval-results/model-compare/*/*/results.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::warning::No arm produced a verdict; nothing to publish."
            exit 0
          fi

          args=()
          for result in "${results[@]}"; do args+=(--results "$result"); done
          args+=(--replay-from eval-results/model-compare)

          ./eng/dashboard/publish.sh "${args[@]}" \
            --commit "${{ github.sha }}" \
            --run "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summarise the comparison
        if: always()
        env:
          JUDGE_MODEL: ${{ inputs.judge_model }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Model comparison"
            echo
            echo "Every arm below was scored by \`$JUDGE_MODEL\`."
            echo
            echo "| Model | Subject | Verdict | Baseline | Skilled | Lift | Tokens |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            for result in eval-results/model-compare/*/*/results.json; do
              node -e "
                const run = require('./$result');
                for (const verdict of run.verdicts ?? []) {
                  const state = !verdict.conclusive || verdict.underpowered ? 'inconclusive'
                    : verdict.passed ? 'pass' : verdict.flaky ? 'flaky' : verdict.regressed ? 'regression' : 'no improvement';
                  const quality = verdict.metrics?.quality ?? {};
                  const tokens = verdict.metrics?.efficiency?.tokenDeltaPercent;
                  const show = (value, digits = 3) => value == null ? '—' : value.toFixed(digits);
                  console.log(\`| \${run.model} | \${verdict.subject.name} | \${state} | \${show(quality.baseline)} | \${show(quality.skilled)} | \${show(quality.delta)} | \${tokens == null ? '—' : tokens + '%'} |\`);
                }
              "
            done
          } >> "$GITHUB_STEP_SUMMARY"
