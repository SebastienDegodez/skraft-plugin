name: Skill evaluation

# One workflow, three jobs, deliberately split by cost:
#
#   lint        — on every pull request. Structural checks only, no model is
#                 called, so it never consumes Copilot quota.
#   evaluate-pr — on every pull request that changed a skill. Evaluates only
#                 the skill(s) the PR touched (RUNS=1) and posts the verdict
#                 as a PR comment; blocks merge only on a credible regression.
#                 Skipped for fork PRs (no secrets available there anyway).
#   evaluate    — scheduled or dispatched. Runs every skill twice (baseline vs
#                 skilled), judges the pairs, and publishes verdicts and
#                 recorded agent sessions to the `dashboard-data` branch.
#   compare-*   — dispatched with `models`. Runs the same skill(s) once per
#                 agent model, all scored by one pinned judge, so the dashboard
#                 can show which model the skill actually helps.

on:
  pull_request:
    paths:
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/agents/**'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'tests/skills/**'
      - 'tests/dashboard/**'
      - 'eng/**'
      - '.github/workflows/skill-evaluation.yml'
  schedule:
    # Monday, 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Evaluate a single skill (directory name under plugins/skraft-framework/skills). Leave empty for all.'
        type: string
        required: false
      models:
        description: 'Comma-separated agent models to compare, e.g. gpt-5.6-luna,claude-sonnet-5. Leave empty to run the ordinary single-model evaluation instead.'
        type: string
        required: false
      judge_model:
        description: 'The one judge that scores every arm. Arms scored by different judges are not on the same scale and are never compared.'
        type: string
        required: false
        default: gpt-5.6-terra

permissions:
  contents: write

concurrency:
  group: skill-evaluation-${{ github.ref }}
  cancel-in-progress: false

env:
  VALLY_PACKAGE: '@microsoft/vally-cli@0.12.0'
  MODEL: gpt-5.6-luna
  JUDGE_MODEL: gpt-5.6-luna
  DATA_BRANCH: dashboard-data
  RETENTION_DAYS: '14'
  VALLY_TELEMETRY_OPTOUT: '1'

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Vally CLI
        run: npm install -g "$VALLY_PACKAGE"

      - name: Dashboard tooling tests
        run: node --test tests/dashboard/*.test.mjs

      - name: Scan the plugin catalogue
        run: node eng/catalog/scan.mjs

      - name: Fail on a catalogue finding
        run: |
          node -e "
            const { findings } = require('./artifacts/catalog/report.json');
            for (const finding of findings) console.log(\`::warning file=\${finding.path}::[\${finding.code}] \${finding.message}\`);
            if (findings.length) {
              console.log(\`::error::The catalogue scan reported \${findings.length} finding(s); fix them or adjust the skill.\`);
              process.exit(1);
            }
          "

      # Advisory, not blocking. Vally's `valid-refs` check rejects any link that
      # leaves a skill's own directory, which SKRAFT's roster → adapter skills do
      # deliberately (a roster's whole job is to point at its adapters).
      - name: Lint the shipped skills (advisory)
        continue-on-error: true
        run: vally lint plugins/skraft-framework/skills

      - name: Lint every evaluation spec
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(tests/skills/*/eval.yaml)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No evaluation spec to lint."
            exit 0
          fi
          for spec in "${specs[@]}"; do
            echo "::group::$spec"
            vally lint --eval-spec "$spec" --strict
            echo "::endgroup::"
          done

  evaluate-pr:
    name: Skill versus baseline (changed skills only)
    # Fork PRs have no access to COPILOT_GITHUB_TOKEN, so skip rather than fail.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect which skill(s) this PR changed
        id: changed
        run: |
          set -euo pipefail
          {
            echo 'skills<<PR_SKILLS_EOF'
            node eng/detect-changed-skills.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
            echo 'PR_SKILLS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install the Vally CLI
        if: steps.changed.outputs.skills != ''
        run: npm install -g "$VALLY_PACKAGE"

      - name: Run each changed skill twice and judge the pair
        if: steps.changed.outputs.skills != ''
        env:
          # See the `evaluate` job below for why this specific token is needed.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SKILLS: ${{ steps.changed.outputs.skills }}
        run: |
          set -euo pipefail
          while IFS= read -r skill; do
            [ -n "$skill" ] || continue
            ./eng/run-vally-evals.sh "$skill"
          done <<< "$SKILLS"

      - name: Upload trajectories
        if: always() && steps.changed.outputs.skills != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-pr-${{ github.event.pull_request.number }}
          path: eval-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Build the PR comment
        if: always() && steps.changed.outputs.skills != ''
        run: node eng/build-pr-comment.mjs --results-dir eval-results --out pr-comment.md

      - name: Post the PR comment
        if: always() && steps.changed.outputs.skills != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('pr-comment.md', 'utf8')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

      - name: Fail on a regression
        if: steps.changed.outputs.skills != ''
        run: node eng/check-pr-regressions.mjs --results-dir eval-results

  evaluate:
    name: Skill versus baseline
    # A dispatch that names models wants the comparison below, not this job.
    if: github.event_name != 'pull_request' && inputs.models == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shared with dashboard-data-compact.yml: a publication and a history
    # compaction must never interleave on the evidence branch.
    concurrency:
      group: dashboard-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Vally CLI
        run: npm install -g "$VALLY_PACKAGE"

      - name: Run each eval twice and judge the pair
        env:
          # A fine-grained PAT with the "Copilot Requests" account permission.
          # The auto-generated GITHUB_TOKEN cannot reach Copilot. The runner
          # re-exports it under every name Vally 0.12.0 and the spawned Copilot
          # runtime read.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Passed through the environment and quoted at the call site so a
          # dispatch input can never be interpreted as shell.
          SKILL: ${{ inputs.skill }}
        run: ./eng/run-vally-evals.sh ${SKILL:+"$SKILL"}

      - name: Upload trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verdicts and sessions to the data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(eval-results/*/results.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::warning::No verdict was produced; nothing to publish."
            exit 0
          fi

          args=()
          for result in "${results[@]}"; do args+=(--results "$result"); done
          # Scan the whole output root: the session logs sit under
          # eval-results/<skill>/<variant>/, one subtree per evaluated spec.
          args+=(--replay-from eval-results)

          ./eng/dashboard/publish.sh "${args[@]}" \
            --commit "${{ github.sha }}" \
            --run "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summarise the run
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Skill versus baseline"
            echo
            echo "| Subject | Verdict | Evidence |"
            echo "| --- | --- | --- |"
            for result in eval-results/*/results.json; do
              node -e "
                const { verdicts = [] } = require('./$result');
                for (const verdict of verdicts) {
                  const state = !verdict.conclusive || verdict.underpowered ? 'inconclusive'
                    : verdict.regressed ? 'regression' : verdict.passed ? 'pass' : 'no improvement';
                  console.log(\`| \${verdict.subject.name} | \${state} | \${verdict.reason} |\`);
                }
              "
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Model comparison ────────────────────────────────────────────────────────
  # One skill, one judge, several agent models. Splitting it into three jobs is
  # deliberate: the arms must run in parallel to stay inside a sane wall clock,
  # but the evidence branch must be written exactly once, so publication is its
  # own job and it alone holds the `dashboard-data` lock.

  compare-matrix:
    name: Resolve the model arms
    if: github.event_name == 'workflow_dispatch' && inputs.models != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      arms: ${{ steps.parse.outputs.arms }}
    steps:
      - id: parse
        env:
          # Read from the environment, never interpolated into the shell, so a
          # dispatch input cannot become a command.
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          arms=$(node -e "
            const arms = [...new Set((process.env.MODELS ?? '').split(',').map((model) => model.trim()).filter(Boolean))];
            if (arms.length < 2) {
              console.error(\`::error::A comparison needs at least two models; got \${arms.length}.\`);
              process.exit(1);
            }
            console.log(JSON.stringify(arms));
          ")
          echo "arms=$arms" >> "$GITHUB_OUTPUT"
          echo "Comparing: $arms"

  compare-models:
    name: ${{ matrix.model }} versus baseline
    needs: compare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One failing arm must not erase the arms that did produce evidence.
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.compare-matrix.outputs.arms) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Vally CLI
        run: npm install -g "$VALLY_PACKAGE"

      - name: Run the skill twice on ${{ matrix.model }} and judge the pair
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SKILL: ${{ inputs.skill }}
          # The arm under test varies; the judge is pinned for every arm, which
          # is the only thing that makes the arms comparable at all.
          MODEL: ${{ matrix.model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          RESULTS_DIR: ${{ github.workspace }}/eval-results/model-compare/${{ matrix.model }}
        run: ./eng/run-vally-evals.sh ${SKILL:+"$SKILL"}

      - name: Upload this arm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-arm-${{ matrix.model }}
          path: eval-results/model-compare/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 14

  publish-comparison:
    name: Publish the model comparison
    needs: compare-models
    # Runs even when an arm failed: the arms that did finish are still evidence.
    if: always() && needs.compare-models.result != 'skipped'
    runs-on: ubuntu-latest
    # Shared with dashboard-data-compact.yml and the `evaluate` job: a
    # publication and a history compaction must never interleave.
    concurrency:
      group: dashboard-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect every arm
        uses: actions/download-artifact@v4
        with:
          pattern: model-arm-*
          path: eval-results/model-compare

      - name: Publish the arms to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # One level deeper than the single-model layout: <arm>/<skill>/results.json.
          results=(eval-results/model-compare/*/*/results.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::warning::No arm produced a verdict; nothing to publish."
            exit 0
          fi

          args=()
          for result in "${results[@]}"; do args+=(--results "$result"); done
          args+=(--replay-from eval-results/model-compare)

          ./eng/dashboard/publish.sh "${args[@]}" \
            --commit "${{ github.sha }}" \
            --run "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summarise the comparison
        if: always()
        env:
          JUDGE_MODEL: ${{ inputs.judge_model }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Model comparison"
            echo
            echo "Every arm below was scored by \`$JUDGE_MODEL\`."
            echo
            echo "| Model | Subject | Verdict | Baseline | Skilled | Lift | Tokens |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            for result in eval-results/model-compare/*/*/results.json; do
              node -e "
                const run = require('./$result');
                for (const verdict of run.verdicts ?? []) {
                  const state = !verdict.conclusive || verdict.underpowered ? 'inconclusive'
                    : verdict.regressed ? 'regression' : verdict.passed ? 'pass' : 'no improvement';
                  const quality = verdict.metrics?.quality ?? {};
                  const tokens = verdict.metrics?.efficiency?.tokenDeltaPercent;
                  const show = (value, digits = 3) => value == null ? '—' : value.toFixed(digits);
                  console.log(\`| \${run.model} | \${verdict.subject.name} | \${state} | \${show(quality.baseline)} | \${show(quality.skilled)} | \${show(quality.delta)} | \${tokens == null ? '—' : tokens + '%'} |\`);
                }
              "
            done
          } >> "$GITHUB_STEP_SUMMARY"
