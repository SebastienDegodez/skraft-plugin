name: Skill evaluation

# One workflow, two jobs, deliberately split by cost:
#
#   lint     — on every pull request. Structural checks only, no model is called,
#              so it never consumes Copilot quota.
#   evaluate — scheduled or dispatched. Runs every skill twice (baseline vs
#              skilled), judges the pairs, and publishes verdicts and recorded
#              agent sessions to the `dashboard-data` branch.

on:
  pull_request:
    paths:
      - 'plugins/skills/**'
      - 'plugins/agents/**'
      - 'plugins/.claude-plugin/plugin.json'
      - 'tests/skills/**'
      - 'tests/dashboard/**'
      - 'eng/**'
      - '.github/workflows/skill-evaluation.yml'
  schedule:
    # Monday, 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Evaluate a single skill (directory name under plugins/skills). Leave empty for all.'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: skill-evaluation-${{ github.ref }}
  cancel-in-progress: false

env:
  VALLY_PACKAGE: '@microsoft/vally-cli@0.12.0'
  MODEL: gpt-5.6-luna
  JUDGE_MODEL: gpt-5.6-luna
  DATA_BRANCH: dashboard-data
  RETENTION_DAYS: '14'
  VALLY_TELEMETRY_OPTOUT: '1'

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Vally CLI
        run: npm install -g "$VALLY_PACKAGE"

      - name: Dashboard tooling tests
        run: node --test tests/dashboard/*.test.mjs

      - name: Scan the plugin catalogue
        run: node eng/catalog/scan.mjs

      - name: Fail on a catalogue finding
        run: |
          node -e "
            const { findings } = require('./artifacts/catalog/report.json');
            for (const finding of findings) console.log(\`::warning file=\${finding.path}::[\${finding.code}] \${finding.message}\`);
            if (findings.length) {
              console.log(\`::error::The catalogue scan reported \${findings.length} finding(s); fix them or adjust the skill.\`);
              process.exit(1);
            }
          "

      # Advisory, not blocking. Vally's `valid-refs` check rejects any link that
      # leaves a skill's own directory, which SKRAFT's roster → adapter skills do
      # deliberately (a roster's whole job is to point at its adapters).
      - name: Lint the shipped skills (advisory)
        continue-on-error: true
        run: vally lint plugins/skills

      - name: Lint every evaluation spec
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(tests/skills/*/eval.yaml)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No evaluation spec to lint."
            exit 0
          fi
          for spec in "${specs[@]}"; do
            echo "::group::$spec"
            vally lint --eval-spec "$spec" --strict
            echo "::endgroup::"
          done

  evaluate:
    name: Skill versus baseline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shared with dashboard-data-compact.yml: a publication and a history
    # compaction must never interleave on the evidence branch.
    concurrency:
      group: dashboard-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Vally CLI
        run: npm install -g "$VALLY_PACKAGE"

      - name: Run each eval twice and judge the pair
        env:
          # A fine-grained PAT with the "Copilot Requests" account permission.
          # The auto-generated GITHUB_TOKEN cannot reach Copilot. The runner
          # re-exports it under every name Vally 0.12.0 and the spawned Copilot
          # runtime read.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Passed through the environment and quoted at the call site so a
          # dispatch input can never be interpreted as shell.
          SKILL: ${{ inputs.skill }}
        run: ./eng/run-vally-evals.sh ${SKILL:+"$SKILL"}

      - name: Upload trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verdicts and sessions to the data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(eval-results/*/results.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::warning::No verdict was produced; nothing to publish."
            exit 0
          fi

          args=()
          for result in "${results[@]}"; do args+=(--results "$result"); done
          # Scan the whole output root: the session logs sit under
          # eval-results/<skill>/<variant>/, one subtree per evaluated spec.
          args+=(--replay-from eval-results)

          ./eng/dashboard/publish.sh "${args[@]}" \
            --commit "${{ github.sha }}" \
            --run "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summarise the run
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Skill versus baseline"
            echo
            echo "| Subject | Verdict | Evidence |"
            echo "| --- | --- | --- |"
            for result in eval-results/*/results.json; do
              node -e "
                const { verdicts = [] } = require('./$result');
                for (const verdict of verdicts) {
                  const state = !verdict.conclusive || verdict.underpowered ? 'inconclusive'
                    : verdict.regressed ? 'regression' : verdict.passed ? 'pass' : 'no improvement';
                  console.log(\`| \${verdict.subject.name} | \${state} | \${verdict.reason} |\`);
                }
              "
            done
          } >> "$GITHUB_STEP_SUMMARY"
