name: Release

# Automatic on every push to main, and to integration/v2-next as an `alpha` pre-release
# (2.0.0-alpha.N); also runnable on demand from the Actions tab.
# Documentation-only pushes never reach it: paths-ignore skips the run, and the
# commit-analyzer maps `docs` to no release, so a docs commit can never cut a tag.
# The `skraft` command (cli/, npm package @skraft/cli) has its own version and its own
# workflow (cli-release.yml), which this one calls as its last job: commits scoped `cli` never bump the
# plugin's version, so a push that only touches cli/ runs this workflow without a release,
# then hands over to cli-release.yml.
on:
  push:
    branches:
      - main
      - integration/v2-next
    paths-ignore:
      - 'docs/website/**'
      - 'docs/site/**'
      - 'docs/**/*.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install release tooling
        run: npm install --no-save
          semantic-release@24
          @semantic-release/changelog@6
          @semantic-release/exec@6
          @semantic-release/git@10
          conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  cli:
    name: release @skraft/cli
    needs: release
    uses: ./.github/workflows/cli-release.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
