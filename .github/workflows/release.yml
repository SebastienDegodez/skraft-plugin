name: Release

# Automatic on every push to main; also runnable on demand from the Actions tab.
# Documentation-only pushes never reach it: paths-ignore skips the run, and the
# commit-analyzer maps `docs` to no release, so a docs commit can never cut a tag.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/site/**'
      - 'docs/**/*.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install release tooling
        run: npm install --no-save
          semantic-release@24
          @semantic-release/changelog@6
          @semantic-release/exec@6
          @semantic-release/git@10
          conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
