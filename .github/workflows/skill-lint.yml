name: Skill lint

# Cheap gate on every pull request: the skills and their evaluation specs must be
# structurally valid, the catalogue must scan clean, and the tooling that feeds
# the dashboard must pass its own tests. No model is called here, so this job
# never consumes Copilot quota.

on:
  pull_request:
    paths:
      - 'plugins/skills/**'
      - 'plugins/agents/**'
      - 'plugins/.claude-plugin/plugin.json'
      - 'tests/skills/**'
      - 'tests/dashboard/**'
      - 'eng/**'
      - 'skraft-plugin.experiment.yaml'
      - '.github/workflows/skill-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dashboard tooling tests
        run: node --test tests/dashboard/*.test.mjs

      - name: Scan the plugin catalogue
        run: node eng/catalog/scan.mjs

      - name: Fail on a catalogue finding
        run: |
          findings=$(node -p "require('./artifacts/catalog/report.json').findings.length")
          node -e "
            const { findings } = require('./artifacts/catalog/report.json');
            for (const finding of findings) console.log(\`::warning file=\${finding.path}::[\${finding.code}] \${finding.message}\`);
          "
          if [ "$findings" -gt 0 ]; then
            echo "::error::The catalogue scan reported $findings finding(s); fix them or adjust the skill."
            exit 1
          fi

      # Advisory, not blocking. Vally's `valid-refs` check rejects any link that
      # leaves a skill's own directory, which SKRAFT's roster → adapter skills do
      # deliberately (a roster's whole job is to point at its adapters). The
      # findings stay visible; the blocking gates below are the ones this
      # repository owns.
      - name: Lint the shipped skills (advisory)
        continue-on-error: true
        run: npx --yes @microsoft/vally-cli@0.12.0 lint plugins/skills

      - name: Lint every evaluation spec
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(tests/skills/*/eval.yaml)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No evaluation spec to lint."
            exit 0
          fi
          for spec in "${specs[@]}"; do
            echo "::group::$spec"
            npx --yes @microsoft/vally-cli@0.12.0 lint --eval-spec "$spec" --strict
            echo "::endgroup::"
          done

      - name: Plan the experiment without spending quota
        run: npx --yes @microsoft/vally-cli@0.12.0 experiment run skraft-plugin.experiment.yaml --dry-run
        env:
          VALLY_TELEMETRY_OPTOUT: '1'
