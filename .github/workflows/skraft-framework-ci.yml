name: skraft-framework CI

on:
  push:
    paths:
      - 'plugins/src/**'
      - 'tests/skraft-framework/**'
      - '.github/workflows/skraft-framework-ci.yml'
  pull_request:
    paths:
      - 'plugins/src/**'
      - 'tests/skraft-framework/**'
      - '.github/workflows/skraft-framework-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests with coverage
        run: |
          node --test --experimental-test-coverage \
            tests/skraft-framework/*.test.mjs

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Stryker dependencies
        working-directory: plugins/src
        run: npm ci

      - name: Run mutation tests
        run: |
          node plugins/src/node_modules/.bin/stryker run \
            plugins/src/stryker.config.mjs

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
          if-no-files-found: ignore
