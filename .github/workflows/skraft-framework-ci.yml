name: skraft-framework CI

on:
  push:
    paths:
      - 'plugins/skraft-framework/src/**'
      - 'plugins/skraft-framework/com.github.copilot/agents/**'
      - 'plugins/skraft-framework/com.anthropic.claude-code/agents/**'
      - 'plugins/skraft-framework/assets/**'
      - 'plugins/skraft-framework/com.github.copilot/hooks/**'
      - 'plugins/skraft-framework/hooks/**'
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/.codex-plugin/**'
      - 'scripts/project-plugin-adapters.mjs'
      - 'scripts/dotnet-quality-gates-smoke.mjs'
      - 'scripts/python-quality-gates-smoke.mjs'
      - 'scripts/sync-skill-copies.mjs'
      - 'scripts/lib/gh-annotations-reporter.mjs'
      - 'scripts/lib/agent-*.mjs'
      - 'scripts/lib/native-claude-agent.mjs'
      - 'plugins/skraft-framework/.agent-sync.json'
      - 'plugins/skraft-framework/plugin.json'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'plugins/skraft-framework/skraft-framework.config.json'
      - 'tests/skraft-framework/**'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-framework-ci.yml'
  pull_request:
    paths:
      - 'plugins/skraft-framework/src/**'
      - 'plugins/skraft-framework/com.github.copilot/agents/**'
      - 'plugins/skraft-framework/com.anthropic.claude-code/agents/**'
      - 'plugins/skraft-framework/assets/**'
      - 'plugins/skraft-framework/com.github.copilot/hooks/**'
      - 'plugins/skraft-framework/hooks/**'
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/.codex-plugin/**'
      - 'scripts/project-plugin-adapters.mjs'
      - 'scripts/dotnet-quality-gates-smoke.mjs'
      - 'scripts/python-quality-gates-smoke.mjs'
      - 'scripts/sync-skill-copies.mjs'
      - 'scripts/lib/gh-annotations-reporter.mjs'
      - 'scripts/lib/agent-*.mjs'
      - 'scripts/lib/native-claude-agent.mjs'
      - 'plugins/skraft-framework/.agent-sync.json'
      - 'plugins/skraft-framework/plugin.json'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'plugins/skraft-framework/skraft-framework.config.json'
      - 'tests/skraft-framework/**'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-framework-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check generated plugin adapters
        run: node scripts/project-plugin-adapters.mjs --check

      - name: Check the copies that keep every skill self-contained
        run: node scripts/sync-skill-copies.mjs --check

      # The JavaScript quality-gates runner tests resolve the pinned Stryker packages.
      - name: Install the framework's dev dependencies
        working-directory: plugins/skraft-framework/src
        run: npm ci

      # Floor on the framework runtime's coverage, a little under the measured level:
      # a change that leaves new code untested fails here.
      - name: Run tests with coverage
        run: |
          node --test --experimental-test-coverage \
            '--test-coverage-include=plugins/skraft-framework/src/**' \
            '--test-coverage-exclude=plugins/skraft-framework/src/node_modules/**' \
            --test-coverage-lines=95 --test-coverage-branches=90 --test-coverage-functions=93 \
            "tests/skraft-framework/**/*.test.mjs"

  test-windows:
    name: Tests (Windows, not yet blocking)
    runs-on: windows-latest
    # The hooks run on Windows machines, but the suite has never run there: this job
    # reports what breaks without blocking a merge. Drop continue-on-error once green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the framework's dev dependencies
        working-directory: plugins/skraft-framework/src
        run: npm ci

      - name: Run tests
        shell: bash
        run: node --test "tests/skraft-framework/**/*.test.mjs"

  model-policy:
    name: Agent model policy (B12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check agent model assignment matches cost_role_class policy
        run: node plugins/skraft-framework/src/cli/resolve-model-bin.mjs --check

  config-policy:
    name: Guardrail config in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check skraft-framework.config.json matches the agent descriptors
        run: node plugins/skraft-framework/src/cli/build-config-bin.mjs --check

  skill-scripts:
    name: Skill scripts (${{ matrix.os }})
    # Every skill ships its own Node scripts and runs them on the user's machine:
    # each one must work, unchanged, on Linux, macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Check the copies that keep every skill self-contained
        run: node scripts/sync-skill-copies.mjs --check

      # The JavaScript quality-gates runner tests resolve the pinned Stryker packages.
      - name: Install the framework's dev dependencies
        working-directory: plugins/skraft-framework/src
        run: npm ci

      - name: Run the skill script suites
        shell: bash
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/lib/gh-annotations-reporter.mjs --test-reporter-destination=stdout
          "tests/skraft-framework/skill-autonomy/*.test.mjs"
          "tests/skraft-framework/quality-gates/*.test.mjs"
          "tests/skraft-framework/mikado-method/*.test.mjs"
          "tests/skraft-framework/clean-architecture-dotnet/*.test.mjs"
          "tests/skraft-framework/reporting/*.test.mjs"

      - name: Run the .NET gate scripts on a real solution (real Stryker.NET)
        if: always()
        run: node scripts/dotnet-quality-gates-smoke.mjs

      - name: Run the Python gate scripts on a real project (real cosmic-ray)
        if: always()
        run: node scripts/python-quality-gates-smoke.mjs

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Stryker dependencies
        working-directory: plugins/skraft-framework/src
        run: npm ci

      - name: Run mutation tests
        shell: bash
        run: |
          set -o pipefail
          node plugins/skraft-framework/src/node_modules/.bin/stryker run \
            plugins/skraft-framework/src/stryker.config.mjs 2>&1 | tee stryker-output.txt

      # The failure reason as a check-run annotation, readable without the job log.
      - name: Report why mutation testing failed
        if: failure()
        shell: bash
        run: >-
          grep -v -E '^Mutation testing [0-9]+%|^\s*$' stryker-output.txt | tail -n 60 |
          node -e "let s='';process.stdin.on('data',(d)=>{s+=d}).on('end',()=>{s=s.replace(/\x1b\[[0-9;]*m/g,'');console.log('::error title=Stryker::'+s.replaceAll('%','%25').replaceAll('\r','').replaceAll('\n','%0A'))})"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
          if-no-files-found: ignore
