name: skraft-framework CI

on:
  push:
    branches: [main, integration/v2-next]
    paths:
      - 'plugins/skraft-framework/engine/**'
      - 'plugins/skraft-framework/hooks/**'
      - 'plugins/skraft-framework/types/**'
      - '.releaserc.json'
      - '.github/workflows/**'
      - 'plugins/skraft-framework/com.github.copilot/agents/**'
      - 'plugins/skraft-framework/com.anthropic.claude-code/agents/**'
      - 'plugins/skraft-framework/assets/**'
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/.codex-plugin/**'
      - 'plugins/skraft-framework/.agent-sync.json'
      - 'plugins/skraft-framework/plugin.json'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'tests/skraft-framework/**'
      - 'tests/skill-scripts/**'
      - 'tests/tooling/**'
      - 'tests/regression/**'
      - 'eng/**'
      - 'scripts/**'
      - 'package.json'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-framework-ci.yml'
  pull_request:
    branches: [main, integration/v2-next, 'v2/lot-*']
    paths:
      - 'plugins/skraft-framework/engine/**'
      - 'plugins/skraft-framework/hooks/**'
      - 'plugins/skraft-framework/types/**'
      - '.releaserc.json'
      - '.github/workflows/**'
      - 'plugins/skraft-framework/com.github.copilot/agents/**'
      - 'plugins/skraft-framework/com.anthropic.claude-code/agents/**'
      - 'plugins/skraft-framework/assets/**'
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/.codex-plugin/**'
      - 'plugins/skraft-framework/.agent-sync.json'
      - 'plugins/skraft-framework/plugin.json'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'tests/skraft-framework/**'
      - 'tests/skill-scripts/**'
      - 'tests/tooling/**'
      - 'tests/regression/**'
      - 'eng/**'
      - 'scripts/**'
      - 'package.json'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-framework-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Each failing node:test case becomes a check-run annotation, readable without the job log.
# Passed through NODE_OPTIONS for npm scripts: node ignores reporter flags placed after the glob.
env:
  ANNOTATED_TESTS: >-
    --test-reporter=spec --test-reporter-destination=stdout
    --test-reporter=./scripts/lib/gh-annotations-reporter.mjs --test-reporter-destination=stdout

jobs:
  engine-unit:
    name: Engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the engine unit tests
        env:
          NODE_OPTIONS: ${{ env.ANNOTATED_TESTS }}
        run: npm run test:engine:unit

  engine-lint:
    name: Engine lint (function size and complexity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the engine's dev dependencies
        run: npm ci --prefix plugins/skraft-framework/engine
      - name: Lint the engine
        run: npm run lint:engine

  engine-integration:
    name: Engine integration tests (${{ matrix.os }})
    # The engine runs on the user's machine: real adapters and the CLI must work,
    # unchanged, on Linux, macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the engine integration tests
        env:
          NODE_OPTIONS: ${{ env.ANNOTATED_TESTS }}
        run: npm run test:engine:integration

  claude-mod:
    name: Claude Code mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate the plugin and its mod module
        run: claude plugin validate plugins/skraft-framework
      # The mod's *.test.ts live in tests/, never in plugins/: the script runs
      # `claude plugin test` on a temporary copy of the plugin that holds them.
      - name: Run the mod's tests in the Claude Code runtime
        run: node tests/skraft-framework/integration/claude-mod/run-plugin-test.mjs

  engine-mutation:
    name: Engine mutation testing
    runs-on: ubuntu-latest
    needs: [engine-unit, engine-integration]
    env:
      INCREMENTAL_FILE: plugins/skraft-framework/engine/reports/stryker-incremental.json
      CACHE_PREFIX: stryker-incremental-${{ github.base_ref || github.ref_name }}-
    steps:
      # The whole history: a pull request mutates what it changed since its merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the engine's dev dependencies
        run: npm ci --prefix plugins/skraft-framework/engine

      # A pull request restores the incremental file of the branch it targets, so
      # Stryker only re-runs the mutants its change can affect.
      - name: Restore the Stryker incremental file
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}

      # A pull request mutates the engine lines it added or changed against the branch it
      # targets; the push to that branch mutates the whole engine and saves the incremental file.
      - name: Run mutation tests
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ -n "$BASE_REF" ]; then
            node eng/mutation-scope.mjs --base "origin/$BASE_REF" --head HEAD --run 2>&1 | tee stryker-output.txt
          else
            npm run mutation:engine 2>&1 | tee stryker-output.txt
          fi

      - name: Report why mutation testing failed
        if: failure()
        shell: bash
        run: >-
          grep -v -E '^Mutation testing [0-9]+%|^\s*$' stryker-output.txt | tail -n 60 |
          node -e "let s='';process.stdin.on('data',(d)=>{s+=d}).on('end',()=>{s=s.replace(/\x1b\[[0-9;]*m/g,'');console.log('::error title=Stryker::'+s.replaceAll('%','%25').replaceAll('\r','').replaceAll('\n','%0A'))})"

      - name: Save the Stryker incremental file
        if: always() && hashFiles('plugins/skraft-framework/engine/reports/stryker-incremental.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-mutation-report
          path: plugins/skraft-framework/engine/reports/mutation/mutation.html
          if-no-files-found: ignore

  regression-harness:
    name: Regression harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the regression harness tests
        env:
          NODE_OPTIONS: ${{ env.ANNOTATED_TESTS }}
        run: npm run test:regression

  tooling:
    name: Repository tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The configuration schema parity test validates its fixtures with the engine's Ajv.
      - name: Install the engine's dev dependencies
        run: npm ci --prefix plugins/skraft-framework/engine
      - name: Run the tooling tests
        env:
          NODE_OPTIONS: ${{ env.ANNOTATED_TESTS }}
        run: npm run test:tooling

  checks:
    name: Plugin copies, dispatch tree, model policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check generated plugin adapters
        run: node scripts/project-plugin-adapters.mjs --check

      - name: Check the copies that keep every skill self-contained
        run: node scripts/sync-skill-copies.mjs --check

      - name: Dispatch tree and declared skills are valid
        run: node scripts/agent-policy/build-config-bin.mjs

      - name: Claude Code agents declare a model family; Copilot agents name no model
        run: node scripts/agent-policy/resolve-model-bin.mjs --check --forbid-model

  skill-scripts:
    name: Skill scripts (${{ matrix.os }})
    # Every skill ships its own Node scripts and runs them on the user's machine:
    # each one must work, unchanged, on Linux, macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Check the copies that keep every skill self-contained
        run: node scripts/sync-skill-copies.mjs --check

      # The JavaScript quality-gates runner tests resolve the pinned Stryker packages
      # from the engine's node_modules.
      - name: Install the engine's dev dependencies
        run: npm ci --prefix plugins/skraft-framework/engine

      # Reporters on the command line, before the glob: these suites spawn `node --test`
      # themselves, so NODE_OPTIONS would leak the reporters into them.
      - name: Run the skill script suites
        shell: bash
        run: node --test $ANNOTATED_TESTS "tests/skill-scripts/**/*.test.mjs"

      - name: Run the .NET gate scripts on a real solution (real Stryker.NET)
        if: always()
        run: node scripts/dotnet-quality-gates-smoke.mjs

      - name: Run the Python gate scripts on a real project (real cosmic-ray)
        if: always()
        run: node scripts/python-quality-gates-smoke.mjs
