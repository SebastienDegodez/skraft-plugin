name: skraft-framework CI

on:
  push:
    paths:
      - 'scripts/ci-mutation-survivors.mjs'
      - 'scripts/ci-failure-annotations.mjs'
      - 'plugins/skraft-framework/src/**'
      - 'plugins/skraft-framework/com.github.copilot/agents/**'
      - 'plugins/skraft-framework/com.anthropic.claude-code/agents/**'
      - 'plugins/skraft-framework/assets/**'
      - 'plugins/skraft-framework/com.github.copilot/hooks/**'
      - 'plugins/skraft-framework/hooks/**'
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/.codex-plugin/**'
      - 'scripts/project-plugin-adapters.mjs'
      - 'scripts/dotnet-quality-gates-smoke.mjs'
      - 'scripts/lib/agent-*.mjs'
      - 'scripts/lib/native-claude-agent.mjs'
      - 'plugins/skraft-framework/.agent-sync.json'
      - 'plugins/skraft-framework/plugin.json'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'plugins/skraft-framework/skraft-framework.config.json'
      - 'tests/skraft-framework/**'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-framework-ci.yml'
  pull_request:
    paths:
      - 'scripts/ci-mutation-survivors.mjs'
      - 'scripts/ci-failure-annotations.mjs'
      - 'plugins/skraft-framework/src/**'
      - 'plugins/skraft-framework/com.github.copilot/agents/**'
      - 'plugins/skraft-framework/com.anthropic.claude-code/agents/**'
      - 'plugins/skraft-framework/assets/**'
      - 'plugins/skraft-framework/com.github.copilot/hooks/**'
      - 'plugins/skraft-framework/hooks/**'
      - 'plugins/skraft-framework/skills/**'
      - 'plugins/skraft-framework/.codex-plugin/**'
      - 'scripts/project-plugin-adapters.mjs'
      - 'scripts/dotnet-quality-gates-smoke.mjs'
      - 'scripts/lib/agent-*.mjs'
      - 'scripts/lib/native-claude-agent.mjs'
      - 'plugins/skraft-framework/.agent-sync.json'
      - 'plugins/skraft-framework/plugin.json'
      - 'plugins/skraft-framework/.claude-plugin/plugin.json'
      - 'plugins/skraft-framework/skraft-framework.config.json'
      - 'tests/skraft-framework/**'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-framework-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check generated plugin adapters
        run: node scripts/project-plugin-adapters.mjs --check

      # The JavaScript quality-gates runner tests resolve the pinned Stryker packages.
      - name: Install the framework's dev dependencies
        working-directory: plugins/skraft-framework/src
        run: npm ci

      # Floor on the framework runtime's coverage, a little under the measured level:
      # a change that leaves new code untested fails here.
      - name: Run tests with coverage
        run: |
          node --test --experimental-test-coverage \
            '--test-coverage-include=plugins/skraft-framework/src/**' \
            '--test-coverage-exclude=plugins/skraft-framework/src/node_modules/**' \
            --test-coverage-lines=95 --test-coverage-branches=90 --test-coverage-functions=93 \
            "tests/skraft-framework/**/*.test.mjs"

  test-windows:
    name: Tests (Windows, not yet blocking)
    runs-on: windows-latest
    # The hooks run on Windows machines, but the suite has never run there: this job
    # reports what breaks without blocking a merge. Drop continue-on-error once green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the framework's dev dependencies
        working-directory: plugins/skraft-framework/src
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          node --test "tests/skraft-framework/**/*.test.mjs" 2>&1 | tee node-test.log
          exit "${PIPESTATUS[0]}"

      # The failing tests and their errors, readable on the check run without the raw log.
      - name: Annotate the failing tests
        if: failure()
        shell: bash
        run: node scripts/ci-failure-annotations.mjs node-test node-test.log

  model-policy:
    name: Agent model policy (B12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check agent model assignment matches cost_role_class policy
        run: node plugins/skraft-framework/src/cli/resolve-model-bin.mjs --check

  config-policy:
    name: Guardrail config in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check skraft-framework.config.json matches the agent descriptors
        run: node plugins/skraft-framework/src/cli/build-config-bin.mjs --check

  dotnet-gates:
    name: .NET quality-gate scripts (real Stryker.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the gate scripts on a real solution
        run: node scripts/dotnet-quality-gates-smoke.mjs

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      checks: write # publishes the surviving mutants as check runs

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Stryker dependencies
        working-directory: plugins/skraft-framework/src
        run: npm ci

      - name: Run mutation tests
        run: |
          node plugins/skraft-framework/src/node_modules/.bin/stryker run \
            plugins/skraft-framework/src/stryker.config.mjs 2>&1 | tee stryker.log
          exit "${PIPESTATUS[0]}"

      # Why Stryker stopped (a crash, or the score under the break threshold), readable on
      # the check run without the raw log.
      - name: Annotate the mutation failure
        if: failure()
        run: node scripts/ci-failure-annotations.mjs tail stryker.log 80

      # The mutants the tests let live, worst file first, with the line each one changed:
      # readable on the pull request's checks (and through the API) without the artifact.
      - name: Publish the surviving mutants
        if: always() && hashFiles('reports/mutation/mutation.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/ci-mutation-survivors.mjs reports/mutation/mutation.json mutation-pages
          total=$(ls mutation-pages/page-*.md 2>/dev/null | wc -l)
          for i in $(seq 1 "$total"); do
            gh api "repos/${{ github.repository }}/check-runs" -X POST \
              -f name="Mutation survivors ($i/$total)" -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=neutral \
              -f "output[title]=Surviving mutants, page $i of $total" \
              -F "output[summary]=@mutation-pages/summary.md" \
              -F "output[text]=@mutation-pages/page-$i.md" > /dev/null
          done

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
