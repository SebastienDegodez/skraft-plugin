name: Release @skraft/cli

# The skraft command has its own version, computed from the commits that touch cli/ only
# (semantic-release-monorepo): feat → minor, fix → patch, BREAKING → major. Tags cli-v<version>.
# - main: stable, npm dist-tag latest.
# - integration/v2-next: 1.0.0-alpha.N, npm dist-tag alpha (npm i -g @skraft/cli@alpha).
# Nothing is committed back: cli/package.json keeps 0.0.0-development; the version is written
# into the package at publish time.
#
# Publishing uses npm trusted publishing (OIDC, npm 11.5 or later): on npmjs.com, @skraft/cli
# names this repository and this workflow file as its trusted publisher.
# First release only: npm sets a trusted publisher on an existing package, so the very first
# publish uses the NPM_TOKEN secret (a granular token limited to @skraft). Once the package
# exists, configure the trusted publisher and delete the secret: without it, npm uses OIDC.
#
# It runs as the last job of the plugin's Release workflow (release.yml calls it), never beside
# it: Release pushes its own chore(release) commit, and semantic-release publishes nothing from a
# branch that moved under it ("the local branch is behind the remote one"), while still exiting 0.
# So this job checks out the branch as Release left it, and publishes only a version npm has never
# seen. A workflow_run trigger would not do: GitHub reads workflow_run from the default branch only,
# and main is v1.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cli-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: semantic-release (cli/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Run the skraft command tests
        run: npm run test:cli

      - name: Install release tooling
        run: npm install --no-save
          semantic-release@25
          semantic-release-monorepo@8
          @semantic-release/exec@7
          conventional-changelog-conventionalcommits@8

      - name: Find the next version, and whether npm already has it
        id: next
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../eng/cli-next-version.mjs

      - name: Run semantic-release on cli/
        if: steps.next.outputs.publish == 'true'
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release --no-ci
