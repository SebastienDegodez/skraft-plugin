# =============================================================================
# MANUAL SETUP REQUIRED before this workflow can open PRs automatically:
#
# 1. Allow GitHub Actions to create pull requests
#    Settings > Actions > General > "Workflow permissions"
#    > tick "Allow GitHub Actions to create and approve pull requests".
#    Without it, `gh pr create` fails with the default GITHUB_TOKEN
#    ("GitHub Actions is not permitted to create or approve pull requests").
#
# 2. Fully automate workflow-file updates with a GitHub App (recommended)
#    Define repository secrets:
#      - GH_AW_APP_ID
#      - GH_AW_APP_PRIVATE_KEY
#    With those secrets, this workflow mints an installation token and can push
#    both regular files and .github/workflows/* updates. Without them, workflow
#    file updates are reverted and listed in the PR body for a manual recompile.
# =============================================================================
name: Upgrade gh-aw

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.GH_AW_APP_ID }}
          private-key: ${{ secrets.GH_AW_APP_PRIVATE_KEY }}

      - name: Resolve auth mode
        id: auth
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "using_app_token=true" >> "$GITHUB_OUTPUT"
            echo "push_token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "using_app_token=false" >> "$GITHUB_OUTPUT"
            echo "push_token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.auth.outputs.push_token }}

      - name: Install gh-aw CLI
        run: curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash

      - name: Run gh-aw upgrade
        run: gh aw upgrade
        env:
          GH_TOKEN: ${{ steps.auth.outputs.push_token }}

      - name: Detect changes
        id: changes
        run: |
          changed=$(
            git diff --name-only
            git ls-files --others --exclude-standard
          )

          if [ -z "$changed" ]; then
            echo "Already up to date."
            echo "has_pushable=false" >> "$GITHUB_OUTPUT"
            echo "needs_recompile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          workflow_files=$(
            git diff --name-only -- '.github/workflows/'
            git ls-files --others --exclude-standard -- '.github/workflows/'
          )

          if [ "${{ steps.auth.outputs.using_app_token }}" = "true" ]; then
            echo "has_pushable=true" >> "$GITHUB_OUTPUT"
            echo "needs_recompile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          other=$(
            git diff --name-only -- . ':!.github/workflows/'
            git ls-files --others --exclude-standard -- . ':!.github/workflows/'
          )
          echo "has_pushable=$( [ -n "$other" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

          if [ -n "$workflow_files" ]; then
            echo "needs_recompile=true" >> "$GITHUB_OUTPUT"
            {
              echo "workflow_files<<EOF"
              echo "$workflow_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "needs_recompile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.changes.outputs.has_pushable == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automated/gh-aw-upgrade"

          if [ "${{ steps.auth.outputs.using_app_token }}" != "true" ]; then
            # Revert workflow files (can't push these with GITHUB_TOKEN)
            git checkout HEAD -- '.github/workflows/' 2>/dev/null || true
            # Remove any new (untracked) files added under .github/workflows/
            git ls-files --others -- '.github/workflows/' | xargs -r rm -f
          fi

          git checkout -B "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "No pushable changes after excluding compiled workflows."
            exit 0
          fi

          git commit -m "chore: upgrade gh-aw runtime"
          git push -f origin "$BRANCH"

          # Build PR body
          BODY="Automated gh-aw runtime upgrade."
          BODY+=$'\n\n'
          if [ "${{ steps.auth.outputs.using_app_token }}" = "true" ]; then
            BODY+="GitHub App token detected; workflow sources and lock files are included automatically."
            BODY+=$'\n\n'
          fi
          if [ "${{ steps.changes.outputs.needs_recompile }}" = "true" ]; then
            BODY+="## ⚠️ Workflow recompilation needed"
            BODY+=$'\n\n'
            BODY+="The following workflow files also need updating but cannot be "
            BODY+="pushed automatically (\`GITHUB_TOKEN\` lacks the \`workflows\` scope "
            BODY+="required to modify files under \`.github/workflows/\`):"
            BODY+=$'\n\n'
            BODY+='```'
            BODY+=$'\n'
            BODY+="${{ steps.changes.outputs.workflow_files }}"
            BODY+=$'\n'
            BODY+='```'
            BODY+=$'\n\n'
            BODY+="After merging this PR, run locally:"
            BODY+=$'\n\n'
            BODY+='```bash'
            BODY+=$'\n'
            BODY+="git pull"
            BODY+=$'\n'
            BODY+="gh aw compile"
            BODY+=$'\n'
            BODY+="git add '.github/workflows/*.lock.yml'"
            BODY+=$'\n'
            BODY+="git commit -m 'chore: recompile gh-aw workflows'"
            BODY+=$'\n'
            BODY+="git push"
            BODY+=$'\n'
            BODY+='```'
            BODY+=$'\n\n'
            BODY+="To fully automate this, configure a GitHub App with \`workflows:write\` "
            BODY+="permission and use \`actions/create-github-app-token\` in this workflow."
          fi

          # Update existing PR or create new one
          existing_pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body "$BODY"
          else
            gh pr create \
              --title "chore: upgrade gh-aw runtime" \
              --body "$BODY" \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ steps.auth.outputs.push_token }}
