# One-off: freezes the published v1 handbook trees into the `docs-archive-v1` release asset, so
# the Docusaurus deploy keeps /skraft-plugin/v1.x.y/ online without Ruby. Each tag is built with
# its own Gemfile, then gets a static "archived" banner (no fetch from the live site) and
# v1/index.html lists the trees.
#
# Run it by hand from integration/v2-next before the final PR to main. `dry-run` (the default)
# only uploads the tarball as a workflow artifact; unchecked, it also creates the release.
# Then pin the printed sha256 as DOCS_V1_ARCHIVE_SHA256 in pages-deploy.yml. The final PR deletes
# this workflow.
name: Docs archive v1

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Upload the tarball as an artifact only; do not create the release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docs-archive-v1
  cancel-in-progress: false

env:
  # The v1 trees published today, newest first (v1/index.html keeps this order).
  V1_TAGS: "v1.15.3 v1.15.2 v1.15.1 v1.15.0 v1.14.1 v1.14.0 v1.13.0 v1.12.0 v1.11.0"
  RELEASE_TAG: docs-archive-v1
  ASSET: docs-v1-archive.tar.gz

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create, skipped on a dry run
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the v1 tags

      - name: Set up Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "3.3"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build each v1 tag with its own Gemfile, then mark it archived
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/archive"
          rm -rf "$out" && mkdir -p "$out"
          for tag in $V1_TAGS; do
            git rev-parse --verify -q "refs/tags/$tag" >/dev/null || { echo "::error::tag $tag not found"; exit 1; }
            src="$RUNNER_TEMP/src/$tag"
            rm -rf "$src" && mkdir -p "$src"
            git archive "refs/tags/$tag" docs/site | tar -x -C "$src"
            (cd "$src/docs/site" \
              && BUNDLE_GEMFILE="$PWD/Gemfile" bundle install --jobs 4 \
              && BUNDLE_GEMFILE="$PWD/Gemfile" JEKYLL_ENV=production bundle exec jekyll build \
                   --baseurl "$BASE_PATH/$tag" --destination "$out/$tag")
            node eng/docs/archive-banner.mjs banner "$out/$tag" --tag "$tag" --current "$BASE_PATH/"
          done
          node eng/docs/archive-banner.mjs index "$out" --base "$BASE_PATH/" --tags "${V1_TAGS// /,}"
          node eng/docs/check-build.mjs "$out" --archive-only --archive "${V1_TAGS// /,}"

      - name: Pack and hash the archive
        id: pack
        run: |
          set -euo pipefail
          tar -czf "$ASSET" -C "$RUNNER_TEMP/archive" .
          sha256sum "$ASSET" | tee "$ASSET.sha256"
          echo "sha256=$(cut -d' ' -f1 "$ASSET.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload the archive as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-v1-archive
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Create the docs-archive-v1 release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          gh release create "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" \
            --target "$GITHUB_SHA" --latest=false \
            --title "skraft v1 documentation archive" \
            --notes "The built v1 handbook trees ($V1_TAGS), served by the Pages deploy. sha256: $SHA256"

      - name: Summary
        env:
          SHA256: ${{ steps.pack.outputs.sha256 }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "### docs-v1-archive.tar.gz"
            echo "sha256: \`$SHA256\` (pin it as DOCS_V1_ARCHIVE_SHA256 in pages-deploy.yml)"
            echo "dry run: $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
