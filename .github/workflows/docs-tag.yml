name: Docs tag

# A documentation-only push to main gets a patch tag so the published
# versioned site can pick it up. Never a major or minor bump: those belong to
# semantic-release. No Vally evaluation and no mutation testing run here.
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/**/*.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Create the patch tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged"; exit 0
          fi
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          next="$(node eng/docs/plan.mjs --next-doc-tag)"
          [ "${latest%.*}" = "${next%.*}" ] || { echo "::error::refusing a non-patch bump $latest -> $next"; exit 1; }
          git tag "$next"
          git push origin "refs/tags/$next"
          gh workflow run pages-deploy.yml --ref main
