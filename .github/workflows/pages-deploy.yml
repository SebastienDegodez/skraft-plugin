name: Deploy SKRAFT docs site to GitHub Pages

on:
  push:
    branches: [main, integration/v2-next]
    paths:
      - "docs/site/**"
      - "eng/**"
      - "plugins/skraft-framework/**"
      - "tests/skills/**"
      - ".github/workflows/pages-deploy.yml"
  # Re-published by the docs-tag workflow after it creates a patch tag.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs/site

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # The dashboard catalogue is derived from the plugin sources at build time,
      # so the published page can never drift from what the plugin ships.
      - name: Build the dashboard catalogue
        run: |
          node eng/catalog/scan.mjs
          node eng/dashboard/build.mjs --repository "${{ github.repository }}"

      - name: Build with Jekyll
        working-directory: docs/site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination ../../_site

      # Versioned docs: the latest line is the root (main); the 5 minor lines
      # before it, every patch tag of those lines, and the integration branch
      # (integration/v2-next, published under /v2-next/) are built under their own
      # path. Selection rules: eng/docs/versions.mjs. The integration branch is the
      # Docusaurus handbook (docs/website, Node 22) when it has one, else its docs/site.
      - name: Build the versioned documentation
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          INTEGRATION_BRANCH: integration/v2-next
        run: |
          set -euo pipefail
          git fetch origin "$INTEGRATION_BRANCH:refs/remotes/origin/$INTEGRATION_BRANCH" \
            || echo "::warning::integration branch $INTEGRATION_BRANCH not found, its documentation is not published"
          node eng/docs/plan.mjs --integration "$INTEGRATION_BRANCH" > _site/versions.json
          export BUNDLE_GEMFILE="$PWD/docs/site/Gemfile"
          build_ref() { # <ref> <path>
            rm -rf /tmp/docsrc && mkdir -p /tmp/docsrc
            git archive "$1" docs/site | tar -x -C /tmp/docsrc
            (cd /tmp/docsrc/docs/site && JEKYLL_ENV=production bundle exec jekyll build \
              --baseurl "$BASE_PATH/$2" --destination "$GITHUB_WORKSPACE/_site/$2")
            node eng/docs/inject-switcher.mjs "_site/$2" "$BASE_PATH" "$2"
          }
          # The Docusaurus handbook (docs/website) of <ref>, built for <base>/<path>. Fails, and
          # leaves _site/<path> alone, when <ref> has no handbook, the build fails, or the
          # built pages do not use that base URL (docusaurus.config.mjs without
          # SKRAFT_DOCS_BASE_URL). It needs the whole tree: the site imports eng/ and scripts/.
          build_website() { # <ref> <path>
            local src="$RUNNER_TEMP/website-src"
            git cat-file -e "$1:docs/website/package.json" 2>/dev/null || return 1
            git worktree remove --force "$src" 2>/dev/null || rm -rf "$src"
            git worktree add --detach "$src" "$1" || return 1
            npm ci --prefix "$src/docs/website" --no-audit --no-fund || return 1
            SKRAFT_DOCS_BASE_URL="$BASE_PATH/$2" npm run build --prefix "$src/docs/website" || return 1
            grep -Eq "(href|src)=\"?$BASE_PATH/${2}assets/" "$src/docs/website/build/index.html" || return 1
            rm -rf "_site/$2" && mkdir -p "_site/$2" || return 1
            cp -R "$src/docs/website/build/." "_site/$2" || return 1
            node eng/docs/inject-switcher.mjs "_site/$2" "$BASE_PATH" "$2" || return 1
          }
          node eng/docs/inject-switcher.mjs _site "$BASE_PATH" ""
          for tag in $(node -e 'const m=JSON.parse(require("fs").readFileSync("_site/versions.json"));for(const l of m.lines)for(const v of l.versions)console.log(v.tag)'); do
            build_ref "refs/tags/$tag" "$tag/"
          done
          if git rev-parse --verify -q "refs/remotes/origin/$INTEGRATION_BRANCH" >/dev/null; then
            integration_path="$(node eng/docs/plan.mjs --integration "$INTEGRATION_BRANCH" --integration-path)"
            if ! build_website "refs/remotes/origin/$INTEGRATION_BRANCH" "$integration_path"; then
              echo "::warning::no Docusaurus handbook built from $INTEGRATION_BRANCH, publishing its docs/site with Jekyll"
              build_ref "refs/remotes/origin/$INTEGRATION_BRANCH" "$integration_path"
            fi
          else
            node -e 'const f="_site/versions.json",m=JSON.parse(require("fs").readFileSync(f));m.integration=null;require("fs").writeFileSync(f,JSON.stringify(m))'
          fi

      # AGENTVIZ replays the raw agent trajectories the evaluation runs record.
      # It is a third-party SPA taken from its npm package, which ships the built
      # dist/. The version is pinned: an upstream change never reaches the site
      # without a deliberate bump (the GitHub repository is no longer public).
      - name: Publish AGENTVIZ under the dashboard
        env:
          AGENTVIZ_VERSION: "1.2.0"
        run: |
          set -euo pipefail
          rm -rf /tmp/agentviz && mkdir -p /tmp/agentviz
          (cd /tmp/agentviz && npm pack "agentviz@${AGENTVIZ_VERSION}" --silent >/dev/null && tar -xzf agentviz-*.tgz)
          test -f /tmp/agentviz/package/dist/index.html || { echo "::error::agentviz@${AGENTVIZ_VERSION} ships no dist/index.html"; exit 1; }
          mkdir -p _site/dashboard/replay
          cp -r /tmp/agentviz/package/dist/* _site/dashboard/replay/
          echo "agentviz@${AGENTVIZ_VERSION}" > _site/dashboard/replay/.agentviz-version

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
