# Only main deploys: the github-pages environment refuses every other branch.
#
# From 2.0.0 (this file on main): one Docusaurus build of docs/website holds the whole site.
# 2.x at / and /fr/, next at /next/ and /fr/next/, the dashboard, and the v1 trees taken from
# the docs-archive-v1 release asset (sha256 pinned below). Nothing outside the artifact
# survives a Pages deployment, so every version is in it.
#
# Until 2.0.0 main runs its own copy of this workflow, which builds integration/v2-next under
# /v2-next/ with SKRAFT_DOCS_BASE_URL. A push to integration/v2-next therefore dispatches the
# workflow on main instead of deploying itself (request-deploy, deleted by the final PR).
name: Deploy SKRAFT docs site to GitHub Pages

on:
  push:
    branches: [main, integration/v2-next]
    paths:
      - "docs/website/**"
      - "docs/site/**"
      - "eng/**"
      - "plugins/skraft-framework/**"
      - "tests/skills/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Set by the final PR from the docs-archive-v1 run summary (docs/v2/docusaurus-migration-plan.md §6).
  DOCS_V1_ARCHIVE_SHA256: ""
  V1_TAGS: "v1.15.3,v1.15.2,v1.15.1,v1.15.0,v1.14.1,v1.14.0,v1.13.0,v1.12.0,v1.11.0"

jobs:
  request-deploy:
    if: github.ref == 'refs/heads/integration/v2-next'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask for a deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages-deploy.yml --ref main

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # last-update dates of the pages

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install
        run: |
          npm ci
          npm ci --prefix docs/website

      # The dashboard catalogue is derived from the plugin sources at build time,
      # so the published page can never drift from what the plugin ships.
      - name: Build the dashboard catalogue
        run: |
          node eng/catalog/scan.mjs
          node eng/dashboard/build.mjs --repository "${{ github.repository }}" --out docs/website/static/dashboard/data/dashboard.json

      - name: Copy the workflow graphs of each version
        if: hashFiles('eng/docs/workflow-copies.mjs') != ''
        run: node eng/docs/workflow-copies.mjs --out docs/website/static/workflows

      - name: Build the handbook, all locales and versions
        env:
          SKRAFT_DOCS_EDIT_BRANCH: main
        run: npm run build --prefix docs/website

      # AGENTVIZ replays the raw agent trajectories the evaluation runs record.
      # It is a third-party SPA taken from its npm package, which ships the built
      # dist/. The version is pinned: an upstream change never reaches the site
      # without a deliberate bump (the GitHub repository is no longer public).
      - name: Publish AGENTVIZ under the dashboard
        env:
          AGENTVIZ_VERSION: "1.2.0"
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/agentviz" && mkdir -p "$RUNNER_TEMP/agentviz"
          (cd "$RUNNER_TEMP/agentviz" && npm pack "agentviz@${AGENTVIZ_VERSION}" --silent >/dev/null && tar -xzf agentviz-*.tgz)
          test -f "$RUNNER_TEMP/agentviz/package/dist/index.html" || { echo "::error::agentviz@${AGENTVIZ_VERSION} ships no dist/index.html"; exit 1; }
          # The dashboard is copied into each locale build (/dashboard/, /fr/dashboard/); so is its replay.
          for replay in docs/website/build/dashboard/replay docs/website/build/fr/dashboard/replay; do
            mkdir -p "$replay"
            cp -r "$RUNNER_TEMP/agentviz/package/dist/." "$replay/"
            echo "agentviz@${AGENTVIZ_VERSION}" > "$replay/.agentviz-version"
          done

      - name: Add the v1 archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$DOCS_V1_ARCHIVE_SHA256" || { echo "::error::DOCS_V1_ARCHIVE_SHA256 is not pinned"; exit 1; }
          cd "$RUNNER_TEMP"
          gh release download docs-archive-v1 --pattern docs-v1-archive.tar.gz --clobber
          echo "$DOCS_V1_ARCHIVE_SHA256  docs-v1-archive.tar.gz" | sha256sum -c -
          tar -xzf docs-v1-archive.tar.gz -C "$GITHUB_WORKSPACE/docs/website/build"

      - name: Check the layout of the site
        run: >-
          node eng/docs/check-build.mjs docs/website/build
          --versions docs/website/versions.json --dashboard --archive "$V1_TAGS"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
