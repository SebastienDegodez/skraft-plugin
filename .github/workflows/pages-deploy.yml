name: Deploy SKRAFT docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "eng/**"
      - "plugins/skraft-framework/**"
      - "tests/skills/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs/site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # The dashboard catalogue is derived from the plugin sources at build time,
      # so the published page can never drift from what the plugin ships.
      - name: Build the dashboard catalogue
        run: |
          node eng/catalog/scan.mjs
          node eng/dashboard/build.mjs --repository "${{ github.repository }}"

      - name: Build with Jekyll
        working-directory: docs/site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination ../../_site

      # AGENTVIZ replays the raw agent trajectories the evaluation runs record.
      # It is a third-party SPA, built from a pinned commit and never vendored.
      - name: Resolve the AGENTVIZ commit
        id: agentviz
        run: |
          sha="$(git ls-remote https://github.com/jayparikh/agentviz.git refs/heads/main | cut -f1)"
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve the AGENTVIZ main branch"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore the AGENTVIZ build
        id: agentviz-cache
        uses: actions/cache@v4
        with:
          path: /tmp/agentviz-dist
          key: agentviz-dist-${{ steps.agentviz.outputs.sha }}

      - name: Build AGENTVIZ
        if: steps.agentviz-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/jayparikh/agentviz.git /tmp/agentviz-src
          cd /tmp/agentviz-src
          git checkout "${{ steps.agentviz.outputs.sha }}"
          npm ci
          npm run build
          mkdir -p /tmp/agentviz-dist
          cp -r dist/* /tmp/agentviz-dist/

      - name: Publish AGENTVIZ under the dashboard
        run: |
          mkdir -p _site/dashboard/replay
          cp -r /tmp/agentviz-dist/* _site/dashboard/replay/
          echo "${{ steps.agentviz.outputs.sha }}" > _site/dashboard/replay/.agentviz-commit

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
