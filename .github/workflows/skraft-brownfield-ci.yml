name: skraft-brownfield CI

on:
  push:
    paths:
      - 'plugins/skraft-brownfield/**'
      - 'tests/skill-scripts/mikado-method/**'
      - 'tests/skill-scripts/skill-autonomy/**'
      - 'scripts/project-plugin-adapters.mjs'
      - 'scripts/set-version.mjs'
      - 'scripts/lib/agent-*.mjs'
      - 'scripts/agent-policy/**'
      - 'eng/lib/**'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-brownfield-ci.yml'
  pull_request:
    paths:
      - 'plugins/skraft-brownfield/**'
      - 'tests/skill-scripts/mikado-method/**'
      - 'tests/skill-scripts/skill-autonomy/**'
      - 'scripts/project-plugin-adapters.mjs'
      - 'scripts/set-version.mjs'
      - 'scripts/lib/agent-*.mjs'
      - 'scripts/agent-policy/**'
      - 'eng/lib/**'
      - '.claude-plugin/marketplace.json'
      - '.cursor-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/skraft-brownfield-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-scripts:
    name: Skill scripts (${{ matrix.os }})
    # validate-mikado runs on developer machines as an sh and a PowerShell twin: the one
    # contract suite runs both on every OS (and Windows PowerShell 5.1 on Windows).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the brownfield skill script contract and the skill autonomy rules
        shell: bash
        run: node --test "tests/skill-scripts/mikado-method/*.test.mjs" "tests/skill-scripts/skill-autonomy/*.test.mjs"

  checks:
    name: Agent trees, dispatch tree, models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Both agent trees in sync with their baseline
        run: node scripts/project-plugin-adapters.mjs --check --plugin-root plugins/skraft-brownfield
      - name: Dispatch tree and declared skills are valid
        run: node scripts/agent-policy/build-config-bin.mjs --dir plugins/skraft-brownfield/com.github.copilot/agents
      - name: Claude Code agents declare a model family; Copilot agents name no model
        run: node scripts/agent-policy/resolve-model-bin.mjs --check --forbid-model --dir plugins/skraft-brownfield/com.github.copilot/agents

  claude-plugin:
    name: Claude Code plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate the plugin
        run: claude plugin validate plugins/skraft-brownfield
