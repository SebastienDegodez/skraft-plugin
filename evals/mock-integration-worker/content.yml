# Content evals for mock-integration-worker
# Source of truth: .specs/specs/2026-06-09-testing-workers-mocking-contract-design.md (Plan d'evals)
# Each fixture must show a measurable delta between with_skill and without_skill.
agent: mock-integration-worker

fixtures:
  - id: C-01-microcks-default
    name: "Default strategy — Microcks container, no override present"
    user_prompt: "Write an integration test that mocks the downstream Eligibility API for this endpoint."
    seed_context:
      stack: dotnet
      skraft_instructions: "absent (no testing.mocking.strategy)"
      downstream: "Eligibility API (OpenAPI contract present)"
    expected_output:
      - "Resolves strategy = microcks via the override cascade (default)."
      - "Loads mocking-microcks-dotnet."
      - "Emits MicrocksContainerEnsemble + WithMainArtifacts seeded from the downstream contract."
      - "Points the SUT downstream client base URL at GetRestMockEndpoint via UseSetting."
      - "Returns a structured result (strategy: microcks, stack: dotnet, files, testCommand) — no commit."
    forbidden:
      - "Driving the business RED->GREEN cycle."
      - "Mocking the SUT itself instead of the downstream."
      - "Hardcoding `dotnet test` instead of resolving via resolving-stack-commands."
    value_delta: "without_skill tends to hand-roll an HttpMessageHandler or hit the real API; with_skill produces the Microcks ensemble wiring."

  - id: C-02-inprocess-instruction-file
    name: "Override via instruction file — in-process double"
    user_prompt: "Write an integration test mocking the downstream Eligibility API for this endpoint."
    seed_context:
      stack: dotnet
      skraft_instructions: "testing.mocking.strategy: inprocess"
      downstream: "Eligibility API"
    expected_output:
      - "Reads testing.mocking.strategy=inprocess from skraft.instructions.md by tool call."
      - "Loads mocking-inprocess-dotnet."
      - "Default library = FakeItEasy (table priority, none named)."
      - "Registers an in-process double swapped into the test host DI; NO Microcks container."
    forbidden:
      - "Spinning up a Microcks container when inprocess was resolved."
      - "Defaulting to Moq when no library is named."
    value_delta: "with_skill honors the repo override and picks FakeItEasy; without_skill ignores the file or defaults to Moq."

  - id: C-03-prompt-override-moq
    name: "Prompt override beats default — Moq named explicitly"
    user_prompt: "Mock the downstream Eligibility API with Moq for this integration test."
    seed_context:
      stack: dotnet
      skraft_instructions: "absent"
      downstream: "Eligibility API"
    expected_output:
      - "Prompt override wins: strategy = inprocess, library = moq."
      - "Registers a Moq double in the test host DI."
    forbidden:
      - "Falling back to Microcks despite the explicit Moq request."
      - "Using FakeItEasy when the prompt named Moq."
    value_delta: "with_skill maps 'with Moq' to the inprocess Moq path; without_skill may keep the Microcks default."
