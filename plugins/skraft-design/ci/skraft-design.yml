# skraft-design in CI (#662). Copy this file into the project as .github/workflows/skraft-design.yml.
#
# - Run it by hand (workflow_dispatch) with one issue or one epic: the design runs in mode "ci".
#   When it waits on a person, the engine publishes the draft pull request and asks each question in
#   a comment of its own there, and this job keeps the run's tracking folder as an artifact. A new
#   question never rewrites an earlier one; once answered, its comment says what was recorded
#   and keeps the question, folded.
#   While nothing is designed yet (a question of scope, before any commit), the engine asks on the
#   issue or epic instead, since GitHub opens no pull request without a commit.
# - Answer in that draft, or on that issue, with one comment: /skraft-answer, then one "Q1: B" line
#   per question, or your own words, which an interpreter agent reads when the run resumes. The comment
#   resumes the same run: the engine records it only when its author has write access to the
#   repository (admin, maintain or write) and it answers the pending question; then the design
#   goes on, and pauses again or ends with the architecture pull request.
# - The default branch moved while the run waited (a back end merged, a configuration added)?
#   Answer /skraft-answer REFRESH: the same run takes it as it is now and designs again from RESEARCH.
#
# - The workflow gives the publication consent for this repository (ci-consent.mjs), in the job's
#   own home: committing this file is the team's consent; a committed skraft-design-config.json
#   holds no `publish`, which would be read over it. No skraft-design-config.json is needed;
#   the merged base is the repository's default branch unless one sets baseBranch.
#
# Secrets:
# - SKRAFT_DESIGN_JOURNAL_KEY: 64 hexadecimal characters (`openssl rand -hex 32`); the journal is
#   signed with it, so the job that resumes verifies what the pausing job wrote.
# - ANTHROPIC_API_KEY: the Claude Code host that conducts the agents.
# Variables:
# - SKRAFT_PLUGIN_REF: the skraft-plugin ref the plugin is taken from (a tag), main by default.

name: skraft-design

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Story issue number (leave empty with epic)
        required: false
      epic:
        description: Epic issue number (leave empty with issue)
        required: false
  issue_comment:
    # edited: a reply corrected in place; the engine refuses a key that is already answered.
    types: [created, edited]

concurrency:
  group: skraft-design-${{ github.event.issue.number || github.event.inputs.epic || github.event.inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  design:
    # A comment resumes only a design run, and only when it is a reply; the engine checks the
    # author's access before anything runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/skraft-answer ')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SKRAFT_DESIGN_JOURNAL_KEY: ${{ secrets.SKRAFT_DESIGN_JOURNAL_KEY }}
      PLUGIN: ${{ github.workspace }}/.skraft-plugin/plugins/skraft-design
    steps:
      - name: Find the design branch the reply answers
        id: target
        if: github.event_name == 'issue_comment'
        env:
          NUMBER: ${{ github.event.issue.number }}
          ON_PULL_REQUEST: ${{ github.event.issue.pull_request && 'yes' || '' }}
        run: |
          if [ -n "$ON_PULL_REQUEST" ]; then
            head="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          else
            head=""
            for candidate in "design/epic-$NUMBER" "design/issue-$NUMBER"; do
              if gh api "repos/$GITHUB_REPOSITORY/branches/$candidate" --silent 2>/dev/null; then head="$candidate"; break; fi
            done
          fi
          case "$head" in design/*) ;; *) echo "no design run answers #$NUMBER"; exit 1 ;; esac
          echo "branch=$head" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.branch || github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SebastienDegodez/skraft-plugin
          ref: ${{ vars.SKRAFT_PLUGIN_REF || 'main' }}
          path: .skraft-plugin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore the run this reply resumes
        if: github.event_name == 'issue_comment'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          name="skraft-design-${BRANCH//\//-}"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=1" --jq '.artifacts[0].id // empty')"
          if [ -z "$id" ]; then echo "no kept run for $BRANCH"; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/run.zip"
          mkdir -p .copilot-tracking/skraft-design-runs
          unzip -q -o "$RUNNER_TEMP/run.zip" -d .copilot-tracking/skraft-design-runs

      - name: Record the reply
        if: github.event_name == 'issue_comment'
        env:
          COMMENT: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          printf '%s' "$COMMENT" > "$RUNNER_TEMP/comment.md"
          node "$PLUGIN/engine/drivers/cli/ci-reply.mjs" --author "$AUTHOR" --comment-file "$RUNNER_TEMP/comment.md"

      - name: Consent to publish on this repository
        run: node "$PLUGIN/engine/drivers/cli/ci-consent.mjs"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Design
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ github.event.inputs.issue }}
          EPIC: ${{ github.event.inputs.epic }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="issue #$ISSUE"; [ -n "$EPIC" ] && scope="epic #$EPIC"
            task="Use the skraft-design skill to design the architecture of $scope with mode ci."
          else
            task="Use the skraft-design skill to resume the active architecture run: call skraft_design_next."
          fi
          printf '%s\n\n%s\n' "$task The workspace is $GITHUB_WORKSPACE." \
            "This is a CI run: never answer a question yourself. When the engine waits, report its result and stop. Run every agent in the foreground and wait for its final reply: never end your turn while an agent is still running." > "$RUNNER_TEMP/prompt.txt"
          claude -p --plugin-dir "$PLUGIN" --permission-mode acceptEdits \
            --allowedTools "mcp__plugin_skraft-design_skraft-design,Agent,Read,Write,Edit,Glob,Grep,Skill,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(mkdir -p:*)" \
            < "$RUNNER_TEMP/prompt.txt"

      # Fails the job when the run waits on a question no draft and no issue comment holds.
      - name: Check the question reached people
        run: node "$PLUGIN/engine/drivers/cli/ci-check.mjs"

      - name: Name the kept run
        id: kept
        if: always()
        run: |
          branch="$(git branch --show-current)"
          echo "name=skraft-design-${branch//\//-}" >> "$GITHUB_OUTPUT"

      - name: Keep the run for the next reply
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.kept.outputs.name }}
          path: .copilot-tracking/skraft-design-runs/
          include-hidden-files: true
          overwrite: true
          retention-days: 30
