<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skraft pipeline</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <h1 id="slug">Skraft pipeline</h1>
    <p id="story" class="story"></p>
    <p id="summary" class="summary" role="status" aria-live="polite">Reading the pipeline…</p>
    <p id="freshness" class="freshness"></p>
  </header>

  <ol id="track" class="track" aria-label="Phases"></ol>

  <section id="question" class="question" hidden aria-labelledby="question-title">
    <h2 id="question-title">The pipeline is waiting for you</h2>
    <p id="question-text" class="question-text"></p>
    <div id="question-options" class="options"></div>
    <form id="question-form" class="free-answer">
      <label for="question-free">Another answer</label>
      <input id="question-free" name="answer" autocomplete="off">
      <button type="submit">Record answer</button>
    </form>
    <p id="question-key" class="key"></p>
    <p id="question-note" class="note" hidden></p>
  </section>

  <section class="actions" aria-label="Ask Copilot">
    <button id="ask-resume" type="button">Ask Copilot to resume the run</button>
    <button id="ask-explain" type="button" class="quiet">Ask Copilot where it stands</button>
    <p id="ask-note" class="note" hidden></p>
  </section>

  <section aria-labelledby="phases-title">
    <h2 id="phases-title">Phases</h2>
    <div id="phases"></div>
  </section>

  <section aria-labelledby="reports-title">
    <h2 id="reports-title">Reports</h2>
    <div id="reports"></div>
  </section>

  <section aria-labelledby="decisions-title">
    <h2 id="decisions-title">Decisions</h2>
    <div id="decisions"></div>
  </section>

  <section aria-labelledby="log-title">
    <h2 id="log-title">Run log</h2>
    <ol id="log" class="log"></ol>
  </section>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <header>
      <h2 id="viewer-title"></h2>
      <button id="viewer-close" type="button">Close</button>
    </header>
    <pre id="viewer-text"></pre>
  </dialog>
</body>
</html>
