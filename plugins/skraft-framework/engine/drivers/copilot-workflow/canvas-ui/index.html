<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="skraft-panel-token" content="__SKRAFT_PANEL_TOKEN__">
  <title>skraft pipeline</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1 id="title">skraft pipeline</h1>
    <p id="status" class="status"></p>
    <p id="reason" class="reason" role="status" aria-live="polite">Reading the pipeline…</p>
  </header>
  <section id="question" class="question" hidden aria-labelledby="question-header">
    <h2 id="question-header"></h2>
    <p id="question-text"></p>
    <div id="question-choices" class="choices"></div>
    <p id="question-note" class="note" role="status" aria-live="polite"></p>
  </section>
  <ol id="phases" class="phases" aria-label="Phases and steps"></ol>
  <ul id="details" class="details" aria-label="Under way, reviews, gates and cost"></ul>
  <p id="offline" class="note" hidden>The panel lost its connection to skraft; reopen the canvas.</p>
</body>
</html>
