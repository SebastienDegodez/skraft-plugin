<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>skraft</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" id="skip" href="#panel">Content</a>
  <div class="app" data-state="loading" data-tab="run">
    <header class="top" id="top"></header>
    <main class="panel" id="panel" role="tabpanel" tabindex="-1"><p class="loading" id="loading" role="status" aria-live="polite">Reading the pipeline…</p></main>
    <footer class="bar" id="bar"></footer>
    <div class="offline" id="offline" role="alert" hidden></div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </div>
  <p class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></p>
</body>
</html>
