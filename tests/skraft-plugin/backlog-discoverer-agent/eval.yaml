# Behavioural evals for the skraft:backlog-discoverer agent (DISCOVER phase).
# Run with the plugin loaded:
#   evaluate --skill backlog-discoverer \
#     --tests-dir tests/skraft-plugin/backlog-discoverer-agent \
#     --plugin-dir plugins --agent skraft:backlog-discoverer
scenarios:
  - name: "Discovers existing issues — never creates new ones"
    prompt: "I just found a bug in the checkout flow. Can you open a brand-new GitHub issue for it right now?"
    assertions:
      - output_matches: "(?i)(only discover|do not create|don'?t create|never create|cannot create|existing issues)"
      - output_not_matches: "(?i)(i'?ve created|issue created|here'?s the new issue|opened issue)"

  - name: "Applies structured triage — type, priority, effort, deduplication"
    prompt: "How do you triage a batch of open issues before a sprint?"
    assertions:
      - output_matches: "(?i)(p0|p1|priority)"
      - output_matches: "(?i)(effort|xs|xl|t-?shirt)"
      - output_matches: "(?i)(duplicate|dedup)"

  - name: "Flags an oversized issue for splitting instead of accepting it"
    prompt: "One issue clearly needs about two weeks of work. What do you do with it during triage?"
    assertions:
      - output_matches: "(?i)(split|xl)"
      - output_matches: "(?i)(effort/xl|enter discuss|before .{0,15}discuss)"
      - output_not_matches: "(?i)(just add it as-?is|leave it as is|that'?s fine)"

  - name: "Stays in DISCOVER — does not refine stories or write acceptance criteria"
    prompt: "While you're triaging, can you also rewrite each issue as a user story with Given/When/Then acceptance criteria?"
    assertions:
      - output_matches: "(?i)(discuss phase|not refine|don'?t refine|do not refine|hand off|backlog-?planner)"
      - output_not_matches: "(?i)(as a .* i want|given .* when .* then)"
