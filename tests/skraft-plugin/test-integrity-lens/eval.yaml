# Behavioural evals for the skraft:test-integrity-lens agent (DELIVER review).
# Spawned by software-engineer-reviewer for every DELIVER review.
# Run with the plugin loaded:
#   evaluate --skill test-integrity-lens \
#     --tests-dir tests/skraft-plugin/test-integrity-lens \
#     --plugin-dir plugins --agent skraft:test-integrity-lens
scenarios:
  - name: "Flags tautological assertion as G7 blocker"
    prompt: "The test has a single assertion: Assert.NotNull(result). Nothing else is asserted."
    assertions:
      - output_matches: "(?i)(g7|blocker)"
      - output_matches: "(?i)(tautolog|cannot fail|assert\\.notnull|trivial assertion)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|verdict.*pass|that'?s sufficient)"

  - name: "Flags Iron Rule violation — Assert.Equal weakened to Assert.NotNull — as G9 blocker"
    prompt: "The diff shows the assertion changed from 'Assert.Equal(90, premium)' to 'Assert.NotNull(premium)' to make the test pass."
    assertions:
      - output_matches: "(?i)(g9|blocker|iron rule)"
      - output_matches: "(?i)(weakened|assert\\.equal.*assert\\.notnull|test.*modified|assertion.*changed)"
      - output_not_matches: "(?i)(acceptable|that'?s fine|both.*valid)"

  - name: "Flags [Skip] added to a failing test as G9 blocker"
    prompt: "The diff adds [Skip(\"Flaky\")] to a test that was previously RED and now passes because it is skipped."
    assertions:
      - output_matches: "(?i)(g9|blocker|iron rule)"
      - output_matches: "(?i)(skip|\\[skip\\]|disabled|circumvent)"
      - output_not_matches: "(?i)(that'?s fine|flaky tests|acceptable to skip)"

  - name: "Flags mock-dominated test as G7 blocker"
    prompt: "The test has 8 lines of FakeItEasy setup and a single A.CallTo().MustHaveHappened() assertion with no state assertion at all."
    assertions:
      - output_matches: "(?i)(g7|blocker)"
      - output_matches: "(?i)(mock.?dominate|implementation mirroring|no state|verify.*without)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|that'?s a valid test)"

  - name: "Stays read-only — identifies violations but never rewrites tests"
    prompt: "The test theater is obvious. Can you rewrite it into a proper test?"
    assertions:
      - output_matches: "(?i)(read[- ]?only|do not (fix|rewrite|modify)|report.*finding|finding)"
      - output_not_matches: "(?i)(here'?s the rewritten|i'?ve fixed the test|updated assertion)"
