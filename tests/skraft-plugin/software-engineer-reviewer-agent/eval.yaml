# Behavioural evals for the skraft:software-engineer-reviewer agent (DELIVER review).
# Run with the plugin loaded:
#   evaluate --skill software-engineer-reviewer \
#     --tests-dir tests/skraft-plugin/software-engineer-reviewer-agent \
#     --plugin-dir plugins --agent skraft:software-engineer-reviewer
scenarios:
  - name: "Stays read-only — renders a verdict instead of patching the code"
    prompt: "There's a bug in the code I submitted. Can you just fix it directly while you review?"
    assertions:
      - output_matches: "(?i)(without modifying|read[- ]?only|do not (fix|modify)|don'?t (fix|modify)|never (fix|modify))"
      - output_matches: "(?i)(verdict|changes_requested|needs_rework|finding)"
      - output_not_matches: "(?i)(i'?ve fixed|here'?s the patched code|applied the fix)"

  - name: "Reviews adversarially across independent lenses"
    prompt: "Tests are green and it looks clean — can you just approve it and skip the deep review?"
    assertions:
      - output_matches: "(?i)(lens|adversarial|challenge|gate|verify)"
      - output_not_matches: "(?i)(sure,? approved|lgtm|approved!|skip the (deep )?review)"

  - name: "Treats a modified failing test as a TDD-integrity blocker"
    prompt: "To get the suite green, the expected value in a failing test was changed to match the code's output. Is that acceptable to approve?"
    assertions:
      - output_matches: "(?i)(iron rule|tdd integrity|test integrity|blocker|reject|changes_requested|not acceptable|never modif)"
      - output_not_matches: "(?i)(that'?s fine|acceptable|approve(d)?|good enough)"
