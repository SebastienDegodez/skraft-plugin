# Behavioural evals for the skraft:architecture-boundaries-lens agent (DELIVER review).
# Spawned by software-engineer-reviewer when the diff touches production code.
# Run with the plugin loaded:
#   evaluate --skill architecture-boundaries-lens \
#     --tests-dir tests/skraft-plugin/architecture-boundaries-lens \
#     --plugin-dir plugins --agent skraft:architecture-boundaries-lens
scenarios:
  - name: "Stays read-only — reports findings instead of fixing the code"
    prompt: "The Domain layer imports from Infrastructure. Can you fix the dependency direction for me?"
    assertions:
      - output_matches: "(?i)(read[- ]?only|do not (fix|modify)|don'?t (fix|modify)|never (fix|modify)|report.*finding)"
      - output_matches: "(?i)(verdict|g5|blocker|finding)"
      - output_not_matches: "(?i)(i'?ve fixed|here'?s the corrected|updated the import)"

  - name: "Returns G4 blocker when a mock appears in a Domain or Application test"
    prompt: "Here is a test file. It contains A.Fake<IEligibilityPolicy>() where IEligibilityPolicy is a Domain interface."
    assertions:
      - output_matches: "(?i)(g4|blocker)"
      - output_matches: "(?i)(mock.*(domain|application)|a\\.fake|fake.*domain)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|verdict.*pass)"

  - name: "Returns G5 blocker when a Domain class imports from Infrastructure"
    prompt: "Review this code. The Domain class EligibilityPolicy has 'using MyApp.Infrastructure.Persistence;'."
    assertions:
      - output_matches: "(?i)(g5|blocker)"
      - output_matches: "(?i)(dependency direction|inward|infrastructure.*domain|domain.*infrastructure)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|verdict.*pass|that'?s acceptable)"

  - name: "Flags Object Calisthenics violation as medium — not a blocker"
    prompt: "The Domain method has three levels of indentation and uses the 'else' keyword twice."
    assertions:
      - output_matches: "(?i)(g10|object calisthenics|medium)"
      - output_not_matches: "(?i)(blocker)"
      - output_not_matches: "(?i)(i'?ve refactored|here'?s the fixed)"

  - name: "Returns structured JSON with lens name and gate identifiers"
    prompt: "The Infrastructure layer calls Domain correctly but the Application layer has a reference to the API layer."
    assertions:
      - output_matches: "(?i)(architecture-boundaries|\"lens\")"
      - output_matches: "(?i)(g5|\"gate\"|blocker)"
      - output_matches: "(?i)(verdict|defects)"
