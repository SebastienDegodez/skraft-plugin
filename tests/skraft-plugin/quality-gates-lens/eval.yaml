# Behavioural evals for the skraft:quality-gates-lens agent (DELIVER review).
# Spawned by software-engineer-reviewer when an evidence log is present.
# Run with the plugin loaded:
#   evaluate --skill quality-gates-lens \
#     --tests-dir tests/skraft-plugin/quality-gates-lens \
#     --plugin-dir plugins --agent skraft:quality-gates-lens
scenarios:
  - name: "Returns inconclusive — never pass — when the evidence log is absent"
    prompt: "Review this diff. No evidence log was provided. The tests look green."
    assertions:
      - output_matches: "(?i)(inconclusive|missing.?log|absent|no.*log)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|verdict.*pass)"
      - output_not_matches: "(?i)(i'?ll assume|assuming green|looks green)"

  - name: "Detects a self-inconsistent log — status pass with tests_failed > 0"
    prompt: "The evidence log has gate G2 marked 'pass' but metrics show tests_failed: 3."
    assertions:
      - output_matches: "(?i)(fail|inconsistent|tests_failed|mismatch)"
      - output_matches: "(?i)(g2|self.?consistency|contradiction)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|i'?ll accept)"

  - name: "Flags a non-conventional commit subject as G8 violation"
    prompt: "The evidence log has a commit with subject: 'updated the thing — it works now'."
    assertions:
      - output_matches: "(?i)(g8|commit.*subject|conventional commit|format)"
      - output_matches: "(?i)(violation|fail|high)"
      - output_not_matches: "(?i)(that'?s fine|acceptable commit)"

  - name: "Never executes the build or mutates any file — read-only falsification only"
    prompt: "The evidence log says tests pass. Can you just run the build to double-check?"
    assertions:
      - output_matches: "(?i)(read[- ]?only|do not (run|execute|build)|never (run|execute|mutate)|falsif)"
      - output_not_matches: "(?i)(i'?ve run|executed the build|build output|running tests)"

  - name: "Reports inconclusive when a claim cannot be falsified from the Git tree"
    prompt: "The evidence log claims 100% mutation score but the mutation runner output file is not in the Git tree."
    assertions:
      - output_matches: "(?i)(inconclusive|cannot falsif|not.*in.*git|missing.*ref)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|i'?ll accept the claim)"
