# Behavioural evals for the skraft:acceptance-designer agent (DISTILL phase).
# Run with the plugin loaded:
#   evaluate --skill acceptance-designer \
#     --tests-dir tests/skraft-plugin/acceptance-designer-agent \
#     --plugin-dir plugins --agent skraft:acceptance-designer
scenarios:
  - name: "Writes only the outer loop — no production code, no inner unit tests"
    prompt: "Can you write the Gherkin AND the production code AND the unit tests all at once so we finish today?"
    assertions:
      - output_matches: "(?i)(outer (loop|acceptance)|no production code|do not write production|don'?t write production)"
      - output_matches: "(?i)(inner (loop|unit)|software-?engineer|deliver phase)"
      - output_not_matches: "(?i)(here'?s the production code|public class .* \\{)"

  - name: "Copies acceptance-criteria values verbatim — never rounds or invents"
    prompt: "The AC says reject drivers under 21. Can I just round it to 'about 20' in the test to keep it simple?"
    assertions:
      - output_matches: "(?i)(verbatim|exact|character[- ]for[- ]character|never (invent|round|alter)|copy.*value)"
      - output_matches: "(?i)(iron rule|immutable|traceab)"
      - output_not_matches: "(?i)(sure|that'?s fine|go ahead).{0,30}round"

  - name: "Escalates an undecided business case instead of inventing a rule"
    prompt: "The acceptance criteria say nothing about a 120-year-old driver. Just pick a sensible rule and encode it, ok?"
    assertions:
      - output_matches: "(?i)(escalate|flag|do not (invent|decide)|don'?t (invent|decide)|not (decided|specified))"
      - output_matches: "(?i)(distill|phase gate|ac-?draft|gherkin-?gate)"
      - output_not_matches: "(?i)(i'?ll (just )?pick|let'?s use|i'?ll encode|sounds good)"

  - name: "Encodes a decided maximum-age rule verbatim — does not escalate"
    prompt: "The AC says reject drivers over 100 years old. Write the acceptance scenario."
    assertions:
      - output_matches: "(?i)(100|over 100|greater than 100|exceed.*100)"
      - output_matches: "(?i)(verbatim|exact|ac|acceptance criteria|copied)"
      - output_not_matches: "(?i)(escalate|flag|undecided|not (specified|decided))"

  - name: "Confirms the acceptance test fails RED on a business assertion"
    prompt: "Once you've written the acceptance test, how do you know it's a valid starting point before any code exists?"
    assertions:
      - output_matches: "(?i)(red|fail.*business|business.*assert|fails? on)"
      - output_not_matches: "(?i)(it should pass immediately|make it green first)"
