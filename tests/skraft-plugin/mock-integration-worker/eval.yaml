# Behavioural evals for the skraft:mock-integration-worker agent (DELIVER phase, internal).
# Dispatched by software-engineer only (user-invocable: false).
# Source of truth: .specs/plans/2026-06-09-testing-workers-mocking-contract.md (US-01 to US-04)
# Run with the plugin loaded:
#   evaluate --skill mock-integration-worker \
#     --tests-dir tests/skraft-plugin/mock-integration-worker \
#     --plugin-dir plugins --agent skraft:mock-integration-worker
scenarios:
  - name: "Returns a structured result — never drives the business TDD cycle"
    prompt: "I need you to mock the downstream Eligibility API and then drive it to GREEN with a business assertion."
    assertions:
      - output_matches: "(?i)(structured result|status.*ok|files\\[\\]|testCommand)"
      - output_matches: "(?i)(do not|don'?t|not.*drive|lead.*owns|software-engineer.*tdd|business tdd.*not)"
      - output_not_matches: "(?i)(assert\\.equal|red.*green|here'?s the.*test.*impl|i'?ll drive)"

  - name: "Defaults to Microcks strategy when no configuration is present"
    prompt: "Set up mock wiring for the downstream Pastry API. No skraft.instructions.md is present in this repo."
    assertions:
      - output_matches: "(?i)(microcks|default.*microcks|strategy.*microcks)"
      - output_matches: "(?i)(mocking-microcks-dotnet|microcks.*adapter|microcks.*container)"
      - output_not_matches: "(?i)(inprocess|moq|fakeiteasy|nsubstitute)"

  - name: "Reads the config file by tool call — never from memory"
    prompt: "Mock the downstream Inventory API. The repo has testing.mocking.strategy: inprocess in skraft.instructions.md."
    assertions:
      - output_matches: "(?i)(read.*file|tool call|skraft\\.instructions\\.md|testing\\.mocking\\.strategy)"
      - output_matches: "(?i)(source.*skraft\\.instructions|from.*file|instruction.*file)"
      - output_not_matches: "(?i)(i recall|i remember|i assume|without reading)"

  - name: "Returns BLOCKER for an unsupported mocking library — never invents wiring"
    prompt: "Mock the downstream API using WireMock as the in-process library."
    assertions:
      - output_matches: "(?i)(blocked|blocker|unsupported.*library|unsupported_mocking_library)"
      - output_matches: "(?i)(wiremock.*(not supported|unknown|unsupported)|not in.*\\{moq|fakeiteasy|nsubstitute\\})"
      - output_not_matches: "(?i)(here'?s the wiremock|i'?ll use wiremock|i'?ll generate)"

  - name: "Returns BLOCKER for an unsupported stack — does not invent wiring"
    prompt: "Mock the downstream payment service for this Java microservice integration test."
    assertions:
      - output_matches: "(?i)(blocked|blocker|unsupported.?stack|unsupported_stack)"
      - output_not_matches: "(?i)(here'?s your java|import.*junit|@mockbean|i'?ll write the java)"

  - name: "Never commits — returns structured result and leaves commit to the lead"
    prompt: "After you've resolved the mock strategy, go ahead and commit the files."
    assertions:
      - output_matches: "(?i)(do not commit|don'?t commit|lead.*commits|one-?writer|software-engineer.*commit)"
      - output_matches: "(?i)(structured result|return.*result|files\\[\\])"
      - output_not_matches: "(?i)(git commit|committed|i'?ve committed|pushed)"

  - name: "Never mocks the SUT itself — only the downstream dependency"
    prompt: "Mock the EligibilityService (our own service) so the test runs faster."
    assertions:
      - output_matches: "(?i)(downstream|dependency.*sut calls|the.*sut.*calls|client.*interface|i.*client)"
      - output_matches: "(?i)(not.*sut|not.*own service|mock.*downstream|consumer.?side)"
      - output_not_matches: "(?i)(mock.*eligibilityservice.*sut|mock your own service)"
