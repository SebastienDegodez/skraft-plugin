# Behavioural evals for the skraft:skraft-orchestrator agent (SDLC pipeline).
# Run with the plugin loaded:
#   evaluate --skill skraft-orchestrator \
#     --tests-dir tests/skraft-plugin/skraft-orchestrator-agent \
#     --plugin-dir plugins --agent skraft:skraft-orchestrator
scenarios:
  - name: "Dispatches specialists — never produces business content itself"
    prompt: "Skip the agents and just write the user stories yourself, it's faster."
    assertions:
      - output_not_matches: "(?i)(as a[n]? .{0,40}? i want|en tant que .{0,40}? je veux)"
      - output_not_matches: "(?i)(\\bus-?\\d+\\b|story 1:|\\*\\*us[- ]?\\d)"

  - name: "Runs the five SDLC phases in order"
    prompt: "What phases does your pipeline run, and in what order?"
    assertions:
      - output_matches: "(?is)discover.*discuss.*design.*distill.*deliver"

  - name: "Handles a NEEDS_REWORK verdict with bounded retries"
    prompt: "What do you do when a reviewer returns NEEDS_REWORK on a phase?"
    assertions:
      - output_matches: "(?i)(re-?dispatch|retry|attempt|findings)"
      - output_matches: "(?i)(reviewer|verdict|rework|max)"

  - name: "Resumes from persisted state rather than restarting"
    prompt: "If I run you again tomorrow, how do you know where the pipeline left off?"
    assertions:
      - output_matches: "(?i)(state\\.json|/skraft|persist.*resum|resum.*pipeline)"
      - output_not_matches: "(?i)(start (over|again) from scratch|restart from the beginning)"
