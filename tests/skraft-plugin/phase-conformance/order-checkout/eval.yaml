# Phase checkpoint conformance — piste order-checkout — consommé par `verify-checkpoint`.
#
# Un scénario par phase 5D. Chacun pointe vers le checkpoint committé produit par
# cette phase et n'asserte QUE des artefacts fichier (no agent, no LLM). C'est la
# porte déterministe qui attrape un checkpoint qui dériverait du format attendu.
#
#   dotnet run --project src/SkraftTestHarness.Cli -- verify-checkpoint \
#     --tests-dir ../../tests/skraft-plugin/phase-conformance/order-checkout \
#     --fixtures-root ./fixtures
scenarios:
  - name: "DISCOVER checkpoint carries triage + an APPROVED review"
    tags: [discover, conformance, order-checkout]
    workspace:
      fixture: clean-architecture-app
      checkpoint: order-checkout/after-discover
    prompt: "Triage issue #42 and propose a sprint path."
    assertions:
      - file_exists: ".copilot-tracking/skraft-plans/order-checkout/state.json"
      - file_matches_glob: ".copilot-tracking/skraft-plans/order-checkout/research/**/order-checkout-research.md"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/order-checkout/reviews/**/discover-order-checkout-review.md"
          text: "Verdict: APPROVED"

  - name: "DISCUSS checkpoint carries a refined story + an APPROVED review"
    tags: [discuss, conformance, order-checkout]
    workspace:
      fixture: clean-architecture-app
      checkpoint: order-checkout/after-discuss
    prompt: "Refine the checkout story with acceptance criteria."
    assertions:
      - file_matches_glob: ".copilot-tracking/skraft-plans/order-checkout/plans/**/order-checkout-plan.instructions.md"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/order-checkout/plans/**/order-checkout-plan.instructions.md"
          text: "Acceptance criteria"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/order-checkout/reviews/**/discuss-order-checkout-review.md"
          text: "Verdict: APPROVED"

  - name: "DESIGN checkpoint carries an ADR + contracts + an APPROVED review"
    tags: [design, conformance, order-checkout]
    workspace:
      fixture: clean-architecture-app
      checkpoint: order-checkout/after-design
    prompt: "Model the checkout and record the decision."
    assertions:
      - file_matches_glob: "docs/adr/adr-*-order-checkout.md"
      - file_contains:
          glob: "docs/adr/adr-*-order-checkout.md"
          text: "**Status:** Accepted"
      - file_matches_glob: ".copilot-tracking/skraft-plans/order-checkout/details/**/order-checkout-contracts.md"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/order-checkout/reviews/**/design-order-checkout-review.md"
          text: "Verdict: APPROVED"

  - name: "DISTILL checkpoint carries Gherkin + a test plan + an APPROVED review"
    tags: [distill, conformance, order-checkout]
    workspace:
      fixture: clean-architecture-app
      checkpoint: order-checkout/after-distill
    prompt: "Distil executable scenarios and a test plan."
    assertions:
      - file_matches_glob: ".copilot-tracking/skraft-plans/order-checkout/features/order-checkout.feature"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/order-checkout/features/order-checkout.feature"
          text: "Platinum tier gets a 10% discount"
      - file_matches_glob: ".copilot-tracking/skraft-plans/order-checkout/details/**/order-checkout-details.md"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/order-checkout/reviews/**/distill-order-checkout-review.md"
          text: "Verdict: APPROVED"
