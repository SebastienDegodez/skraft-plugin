# Phase checkpoint conformance — piste promotion-stacking — consommé par `verify-checkpoint`.
#
# Un scénario par phase 5D. Chacun pointe vers le checkpoint A committé et
# n'asserte QUE des artefacts fichier (no agent, no LLM). Vérifie aussi que le
# code checkout de base (overlayé) est présent, et que les artefacts mentionnent
# l'API Promotions externe + Microcks.
#
#   dotnet run --project src/SkraftTestHarness.Cli -- verify-checkpoint \
#     --tests-dir ../../tests/skraft-plugin/phase-conformance/promotion-stacking \
#     --fixtures-root ./fixtures
scenarios:
  - name: "DISCOVER checkpoint carries triage + an APPROVED review + the existing checkout"
    tags: [discover, conformance, promotion-stacking]
    workspace:
      fixture: clean-architecture-app
      baseline: promotion-stacking/baseline
      checkpoint: promotion-stacking/after-discover
    prompt: "Triage issue #57 and propose a sprint path."
    assertions:
      - file_exists: "src/OrderDiscount.Domain/Order.cs"
      - file_exists: "contracts/promotions-api.yaml"
      - file_exists: ".copilot-tracking/skraft-plans/promotion-stacking/state.json"
      - file_matches_glob: ".copilot-tracking/skraft-plans/promotion-stacking/research/**/promotion-stacking-research.md"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/promotion-stacking/reviews/**/discover-promotion-stacking-review.md"
          text: "Verdict: APPROVED"

  - name: "DISCUSS checkpoint carries a refined story + an APPROVED review"
    tags: [discuss, conformance, promotion-stacking]
    workspace:
      fixture: clean-architecture-app
      baseline: promotion-stacking/baseline
      checkpoint: promotion-stacking/after-discuss
    prompt: "Refine the promotion-stacking story."
    assertions:
      - file_matches_glob: ".copilot-tracking/skraft-plans/promotion-stacking/plans/**/promotion-stacking-plan.instructions.md"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/promotion-stacking/plans/**/promotion-stacking-plan.instructions.md"
          text: "Acceptance criteria"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/promotion-stacking/reviews/**/discuss-promotion-stacking-review.md"
          text: "Verdict: APPROVED"

  - name: "DESIGN checkpoint carries an ADR + contracts (Microcks dual) + an APPROVED review"
    tags: [design, conformance, promotion-stacking]
    workspace:
      fixture: clean-architecture-app
      baseline: promotion-stacking/baseline
      checkpoint: promotion-stacking/after-design
    prompt: "Model promotion stacking and record the decision."
    assertions:
      - file_matches_glob: "docs/adr/adr-*-promotion-stacking.md"
      - file_contains:
          glob: "docs/adr/adr-*-promotion-stacking.md"
          text: "**Status:** Accepted"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/promotion-stacking/details/**/promotion-stacking-contracts.md"
          text: "OPEN_API_SCHEMA"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/promotion-stacking/reviews/**/design-promotion-stacking-review.md"
          text: "Verdict: APPROVED"

  - name: "DISTILL checkpoint carries Gherkin (Microcks mock) + a test plan + an APPROVED review"
    tags: [distill, conformance, promotion-stacking]
    workspace:
      fixture: clean-architecture-app
      baseline: promotion-stacking/baseline
      checkpoint: promotion-stacking/after-distill
    prompt: "Distil executable scenarios and a test plan."
    assertions:
      - file_matches_glob: ".copilot-tracking/skraft-plans/promotion-stacking/features/promotion-stacking.feature"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/promotion-stacking/features/promotion-stacking.feature"
          text: "mocked with Microcks"
      - file_matches_glob: ".copilot-tracking/skraft-plans/promotion-stacking/details/**/promotion-stacking-details.md"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/promotion-stacking/reviews/**/distill-promotion-stacking-review.md"
          text: "Verdict: APPROVED"
