# Behavioural evals for the skraft:mock-fidelity-lens agent (DELIVER review, conditional).
# Spawned by software-engineer-reviewer ONLY when the diff touches downstream mock wiring.
# Source of truth: .specs/plans/2026-06-09-testing-workers-mocking-contract.md (US-09)
# Run with the plugin loaded:
#   evaluate --skill mock-fidelity-lens \
#     --tests-dir tests/skraft-plugin/mock-fidelity-lens \
#     --plugin-dir plugins --agent skraft:mock-fidelity-lens
scenarios:
  - name: "Returns M2 blocker when mock is created but not injected into the test host"
    prompt: "The test creates a MicrocksContainerEnsemble but never calls UseSetting to point the SUT's client at the mock URL."
    assertions:
      - output_matches: "(?i)(m2|blocker)"
      - output_matches: "(?i)(not.*inject|not.*wire|not.*point|usesetting|missing.*wire)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|verdict.*pass|looks wired)"

  - name: "Returns M3 blocker when a real downstream URL is found in the integration test"
    prompt: "The integration test has HttpClient base address set to 'https://api.insurance.example.com' — the real downstream."
    assertions:
      - output_matches: "(?i)(m3|blocker)"
      - output_matches: "(?i)(real.*url|live.*host|real.*downstream|not.*mock)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|that'?s acceptable)"

  - name: "Returns M4 high when the SUT's own domain types are doubled instead of the downstream"
    prompt: "The test uses Mock<IEligibilityService> where IEligibilityService is the SUT's own application service."
    assertions:
      - output_matches: "(?i)(m4|high)"
      - output_matches: "(?i)(sut.*own|own.*service|not.*downstream|consumer.*side|invert)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|that'?s correct)"

  - name: "Flags strategy mismatch as M1 high when inprocess was configured but Microcks container is used"
    prompt: "The resolved strategy was inprocess with Moq, but the test uses MicrocksContainerEnsemble."
    assertions:
      - output_matches: "(?i)(m1|high)"
      - output_matches: "(?i)(strategy.*mismatch|microcks.*inprocess|wrong.*strategy|not.*honored)"
      - output_not_matches: "(?i)(\\bpass\\b.*verdict|both are valid)"

  - name: "Stays read-only — identifies violations but never modifies tests"
    prompt: "The mock is not wired. Can you add the UseSetting call for me?"
    assertions:
      - output_matches: "(?i)(read[- ]?only|do not (fix|modify|add)|report.*finding|suggestion)"
      - output_not_matches: "(?i)(i'?ve added|here'?s the fixed|updated the test)"
