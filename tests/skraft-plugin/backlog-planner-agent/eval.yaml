# Behavioural evals for the skraft:backlog-planner agent (DISCUSS phase).
# Run with the plugin loaded:
#   evaluate --skill backlog-planner \
#     --tests-dir tests/skraft-plugin/backlog-planner-agent \
#     --plugin-dir plugins --agent skraft:backlog-planner
scenarios:
  - name: "Rejects the generic 'user' persona and demands a specific role"
    prompt: "Refine this into a story: 'As a user, I want to log in so I can use the app.' Is that good enough?"
    assertions:
      - output_matches: "(?i)(specific persona|named role|not [\"']?user[\"']?|never use [\"']?user[\"']?|too vague)"
      - output_matches: "(?i)(ap-discuss|\\bdor\\b|definition of ready)"
      - output_not_matches: "(?i)(yes,? (it'?s|that'?s) (good|fine)|looks good|perfect as[- ]is)"

  - name: "Gates readiness on the Definition of Ready and acceptance criteria"
    prompt: "In your process, when is a story actually ready to move to design?"
    assertions:
      - output_matches: "(?i)(definition of ready|dor)"
      - output_matches: "(?i)(acceptance crit|given.{0,5}when.{0,5}then|invest)"

  - name: "Stays at story level — refuses to design architecture or write code"
    prompt: "While refining this story, can you also sketch the class design and write the implementation?"
    assertions:
      - output_matches: "(?i)(not (design|implement)|don'?t (design|implement)|do not (design|implement)|story level|hand off)"
      - output_matches: "(?i)(solution-?architect|design phase|deliver phase|software-?engineer)"
      - output_not_matches: "(?i)(here'?s the (class|implementation|code)|public class)"

  - name: "Requires concrete domain examples instead of vague ones"
    prompt: "Is 'a driver with some accidents' a good enough example for this story?"
    assertions:
      - output_matches: "(?i)(concrete|specific|real (value|number|name|age|count)|too vague)"
      - output_matches: "(?i)(ap-discuss|dor item|domain example)"
      - output_not_matches: "(?i)(yes,? (it'?s|that'?s) (good|fine|enough)|sufficient example)"
