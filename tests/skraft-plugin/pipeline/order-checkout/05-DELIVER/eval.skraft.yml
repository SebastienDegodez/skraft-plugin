# Pipeline 5D — phase DELIVER : GATE ABSOLU (run-gate, mode H2)
#
# DÉMARCHE — Ce fichier est le pendant ABSOLU du eval.yaml comparatif de la
# même phase. Là où eval.yaml compare baseline vs with-skill (« le skill
# apporte-t-il qqch ? »), ce eval.skraft.yml constate en absolu que la phase
# DELIVER FRANCHIT SES GATES :
#   - le code feature a bien été produit dans src/ ;
#   - il respecte les principes du software-engineer (Clean Architecture :
#     interface dans Application/Domain, implémentation de gateway/repository
#     dans Infrastructure) ;
#   - le mutation testing a réellement tourné et passé (preuve falsifiable via
#     le quality-gates-evidence-contract, jamais sur parole) ;
#   - SI le prompt a demandé Microcks (opt-in), le test Microcks a été produit
#     ET l'obligation est propagée aux phases suivantes (agent.md /
#     copilot-instructions).
#
# RÈGLE ABSOLUE : on n'archive JAMAIS sur le repo ce que l'agent produit.
#   Tout est écrit dans le clone éphémère, vérifié, puis jeté.
#
# Exécution (run-gate, opt-in LIVE) :
#   dotnet run --project src/SkraftTestHarness.Cli -- run-gate \
#     --skill skraft-orchestrator \
#     --tests-dir ../../tests/skraft-plugin/pipeline/order-checkout/05-DELIVER \
#     --plugin-dir ../../plugins --agent skraft:skraft-orchestrator \
#     --fixtures-root ./fixtures
scenarios:
  - name: "DELIVER franchit ses gates craft et produit le code order"
    tags: [deliver, pipeline, gate, live]
    workspace:
      fixture: clean-architecture-app
      checkpoint: order-checkout/after-distill
    prompt: >
      Resume the SKRAFT pipeline from state.json. DISCOVER..DISTILL are APPROVED
      for issue #42 (order checkout applying a loyalty-tier discount: Green 0%,
      Gold 5%, Platinum 10%; an unknown order returns a not-found error).
      Run ONLY the DELIVER phase, then stop once its reviewer returns APPROVED and
      the pipeline state is DONE.
    assertions:
      # La feature a été produite dans le code, validée par le reviewer.
      - file_matches_glob: "src/OrderDiscount.Domain/**/*.cs"
      - file_contains:
          glob: ".copilot-tracking/skraft-plans/*/reviews/**/deliver-*-review.md"
          text: "APPROVED"

      # Conformité aux principes du software-engineer (Clean Architecture +
      # qualité). Catalogue extensible : on ajoutera d'autres règles au fil de l'eau.
      - craft_conformance:
          rules:
            # 1. Une interface est déclarée dans Application OU Domain.
            - id: interface-in-app-or-domain
              glob: "src/**/{Application,Domain}/**/I*.cs"
              contains: "interface"
            # 2. L'implémentation d'un gateway/repository vit dans Infrastructure.
            - id: gateway-impl-in-infra
              glob: "src/**/Infrastructure/**/*.cs"
              matches: ":\\s*I\\w+(Gateway|Repository)"
            # 3. Le mutation testing a réellement tourné et passé (preuve falsifiable).
            - id: mutation-gate-passed
              quality_gate:
                evidence: ".copilot-tracking/skraft-plans/*/evidence/**/qg-*.json"
                gate_id: "G_mutation"

      # Microcks est OPT-IN : vérifié seulement si le prompt l'a demandé, avec
      # propagation de l'obligation aux phases suivantes.
      - conditional:
          when_prompt_contains: "Microcks"
          then:
            - file_contains:
                glob: "tests/**/*.cs"
                text: "MicrocksContainer"
            - file_contains:
                glob: "tests/**/*.cs"
                text: "TestEndpointAsync"
            - file_contains:
                glob: "tests/**/*.cs"
                text: "OPEN_API_SCHEMA"
            - artifact_contract:
                consumer: "next-phases"
                requires:
                  - glob: "**/{*.agent.md,**/copilot-instructions.md,.github/**/*.instructions.md}"
                    contains: "Microcks"
