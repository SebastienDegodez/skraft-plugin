name: mocking-strategy-roster
description: Evaluates whether the way a downstream dependency is faked in an integration test is resolved from the project's own configuration instead of being assumed.
type: capability
defaults:
  timeout: 3m
  runs: 3
scoring:
  threshold: 1
# The workspace holds `skraft-config.json` and nothing else: no solution, no test
# project, no downstream client. Every rubric below has to be satisfiable from
# that, which means judging the resolved decision and the wiring the answer
# names — never wiring the answer could only have applied to code that is not
# here. The first draft asked for a substitute "registered inside the test host";
# with no test host in the workspace, the only way to score was to claim a change
# that was never made, and the arm that honestly reported the empty repository
# scored zero for it.
# The strategy is a property of the component in `skraft-config.json`
# (`mocking.strategy`, Microcks when absent), so each stimulus stages the
# configuration that sets up its decision.
stimuli:
  - name: Resolve the approach from the project instead of assuming one
    prompt: |
      Our .NET checkout service calls a downstream pricing API over HTTP. I want an
      integration test that exercises our own endpoint end to end with that downstream
      call faked. Set up the faking for me.
    environment:
      files:
        - src: fixtures/inprocess/skraft-config.json
          dest: skraft-config.json
    graders:
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - mocking-strategy-roster
    rubric:
      - Reads the component's own configuration before choosing anything, instead of assuming an approach.
      - Lands on the in-process substitute this component declares, rather than a containerised or generic default.
      - Names where the substitute has to be registered for it to replace the real downstream in the test host.
      - Leaves the business behaviour of the test to the caller instead of inventing assertions about pricing rules.
      - Reports the repository state it actually found, without claiming to have changed code that is not in the workspace.

  # Inverted in V2 lot 6. This stimulus used to grade an explicit request as
  # settling the choice over the project default. The strategy now belongs to
  # the component: Microcks unless its `skraft-config.json` entry sets
  # `"mocking": { "strategy": "inprocess" }`, one strategy per component. The
  # decision is unchanged — which source settles the choice when the request and
  # the project disagree — and its expected answer is now the component.
  - name: A one-test request does not override the component's strategy
    prompt: |
      Same .NET checkout service and the same downstream pricing API. For this one
      test I want the dependency replaced with NSubstitute, not with anything that
      needs a container. Wire it up.
    environment:
      files:
        - src: fixtures/microcks-default/skraft-config.json
          dest: skraft-config.json
    graders:
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - mocking-strategy-roster
    rubric:
      - Reads the component's own configuration before choosing, and finds that it declares no in-process strategy, so the containerised contract-based mock is the one this component uses.
      - Does not wire an in-process substitute for this one test while the component's configuration still says otherwise, and does not mix two faking approaches in the component's tests.
      - Points to the component's strategy setting in the project configuration as the place where a switch to in-process doubles is made for the whole component, instead of editing it silently for one test.
      - Reports the repository state it actually found, without claiming to have changed code that is not in the workspace.

  - name: A dependency-free rule needs no fake at all
    prompt: |
      In the same .NET service, the domain has a pure rule that turns a loyalty tier
      into a discount percentage. It calls nothing external. Write a test for it.
    environment:
      files:
        - src: fixtures/microcks-default/skraft-config.json
          dest: skraft-config.json
    tags:
      intent: non-activation
    graders:
      - type: prompt
        config:
          scoring: scale_1_10
      # A near-miss guard: nothing external is involved, so there is no fake to
      # choose and loading the roster would be the false positive this stimulus
      # exists to catch.
      - type: skill-invocation
        name: The skill under test stays out of the way
        config:
          disallowed:
            - mocking-strategy-roster
    rubric:
      - Writes a direct test for the rule with no test double at all.
      - Recognises that nothing external is involved and therefore nothing needs faking.
      - Does not introduce a test host, a container, or a mocking library for a self-contained rule.
