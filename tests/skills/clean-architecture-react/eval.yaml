name: clean-architecture-react
description: |
  Verifies the React front-end guidance on screens asked for in plain terms,
  never by pattern name: one folder per feature split into application,
  infrastructure and ui, no feature importing another, app/ as the only place
  that builds infrastructure, business rules left to the API (the client sends
  the request and shows the refusal), and small components, each alone in a
  folder of its own name and exported by name. The project carries the skill's
  ESLint layer and component rules; the lint, type and test graders run them,
  and the node graders check the same layout without a toolchain.
  Probes (Sonnet 5.5 through Claude Code, 3 runs per cell, node graders only:
  no npm registry in the sandbox). On a bare Vite template the base wrote flat
  src/App.tsx, ExpenseForm.tsx and api.ts and installed no guard, 0/3 on the
  layout, component and guard graders; with the skill 3/3. With the layer rules
  already in the project the base followed them 3/3 on every existing-app
  stimulus, which stay as regression guards. An environment-variable change
  loaded the skill 2/3 until its description excluded that, then 0/3.
type: capability
defaults:
  timeout: 4m
  runs: 4
  # Pinned to Sonnet: the probes that sized these stimuli ran on Sonnet.
  # MODEL in the environment still overrides it for the compare-models matrix.
  model: claude-sonnet-5.5
scoring:
  threshold: 1

stimuli:
  # Regression guard. The build, lint and test setup exist with the layer rules
  # already installed: probes without the skill followed them 3/3.
  - name: 'React project with the layer rules: an expenses screen over an existing API'
    tags:
      role: regression-guard
    prompt: |
      The project is already set up (React 19, TypeScript, Vite, Vitest, ESLint). Extend it: do
      not scaffold a new project, do not change package.json, tsconfig.json, eslint.config.js or
      the eslint/ folder, and do not start a dev server.

      src/ holds only main.tsx. Build the first screen: the expenses of the
      signed-in employee, from GET /api/expenses, which returns
      [{ "id": "e1", "label": "Train ticket", "amount": 42.5, "currency": "EUR", "status": "submitted" }],
      and a form to submit a new one through POST /api/expenses with
      { "label", "amount", "currency" }. The API answers 422 with
      { "errors": { "<field>": "<message>" } } when a field is invalid; show
      those messages next to the fields. Production code only, no tests.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files:
        - src: fixtures/todos-vite/.gitignore
          dest: .gitignore
        - src: fixtures/todos-vite/eslint.config.js
          dest: eslint.config.js
        - src: fixtures/todos-vite/eslint/clean-architecture.js
          dest: eslint/clean-architecture.js
        - src: fixtures/todos-vite/index.html
          dest: index.html
        - src: fixtures/todos-vite/package.json
          dest: package.json
        - src: fixtures/todos-vite/src/vite-env.d.ts
          dest: src/vite-env.d.ts
        - src: fixtures/todos-vite/tests/setup.ts
          dest: tests/setup.ts
        - src: fixtures/todos-vite/tsconfig.json
          dest: tsconfig.json
        - src: fixtures/todos-vite/vite.config.ts
          dest: vite.config.ts
        - src: fixtures/vite-template/src/main.tsx
          dest: src/main.tsx
      commands: &react-setup
        - 'npm install --no-audit --no-fund --loglevel=error'
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "chore: project skeleton"'
    graders:
      - &react-layout
        type: run-command
        name: Each file sits in a feature folder of its layer; no feature imports another; dependencies point inward
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path'), { execSync } = require('child_process');
              const sh = c => { try { return execSync(c, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }); } catch { return ''; } };
              const added = [...sh('git diff --name-only --diff-filter=AMR HEAD').split('\n'), ...sh('git ls-files --others --exclude-standard').split('\n')]
                .filter(f => /^src\/.+\.(ts|tsx)$/.test(f) && fs.existsSync(f));
              if (!added.length) { console.log('no new or changed file under src/'); process.exit(1); }
              const ENTRY = /^src\/(main\.tsx?|vite-env\.d\.ts)$/;
              const where = f => {
                const m = f.match(/^src\/([^/]+)\/(?:(application|infrastructure|ui)\/)?/);
                if (!m) return null;
                if (m[1] === 'app' || m[1] === 'shared') return { kind: m[1] };
                return m[2] ? { kind: 'feature', feature: m[1], layer: m[2] } : null;
              };
              const resolve = (from, spec) => {
                if (spec.startsWith('.')) return path.posix.normalize(path.posix.join(path.posix.dirname(from), spec));
                const alias = spec.match(/^(?:@|~|@src)\/(.+)$/);
                return alias ? 'src/' + alias[1] : null;
              };
              const problems = [];
              for (const f of added) {
                if (ENTRY.test(f)) continue;
                const at = where(f);
                if (!at) { problems.push(f + ': outside src/app, src/shared and src/<feature>/{application,infrastructure,ui}'); continue; }
                const text = fs.readFileSync(f, 'utf8');
                const specs = [...text.matchAll(/(?:^|\n)\s*(?:import|export)\s[^'"]*?from\s*['"]([^'"]+)['"]|import\(\s*['"]([^'"]+)['"]\s*\)/g)].map(m => m[1] || m[2]);
                for (const spec of specs) {
                  const target = resolve(f, spec);
                  if (at.kind === 'feature' && at.layer === 'application') {
                    if (/^(react|react-dom|axios|ky|swr|msw)(\/|$)|^@tanstack\//.test(spec)) problems.push(f + ': application imports ' + spec);
                  }
                  if (!target) continue;
                  const to = where(target);
                  if (!to) continue;
                  if (at.kind === 'shared' && to.kind !== 'shared') problems.push(f + ': shared/ imports ' + target);
                  if (at.kind === 'feature' && to.kind === 'app') problems.push(f + ': feature ' + at.feature + ' imports app/');
                  if (at.kind === 'feature' && to.kind === 'feature' && to.feature !== at.feature) problems.push(f + ': feature ' + at.feature + ' imports feature ' + to.feature);
                  if (at.kind === 'feature' && to.kind === 'feature' && to.feature === at.feature) {
                    if (at.layer === 'ui' && to.layer === 'infrastructure') problems.push(f + ': ui imports infrastructure');
                    if (at.layer === 'application' && to.layer !== 'application') problems.push(f + ': application imports ' + to.layer);
                  }
                }
                if (at.kind === 'feature' && at.layer === 'application' && /\bfetch\s*\(|\bXMLHttpRequest\b|\blocalStorage\b/.test(text)) problems.push(f + ': application talks to the network or the browser');
              }
              if (problems.length) { console.log([...new Set(problems)].join('\n')); process.exit(1); }
              console.log(added.length + ' changed files in feature folders, dependencies inward, no feature imports another');
          expected_exit_code: 0
          timeout: 1m
      - &react-components
        type: run-command
        name: Each component is alone in a folder of its own name and exported by name
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path'), { execSync } = require('child_process');
              const sh = c => { try { return execSync(c, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }); } catch { return ''; } };
              const added = [...sh('git diff --name-only --diff-filter=AR HEAD').split('\n'), ...sh('git ls-files --others --exclude-standard').split('\n')]
                .filter(f => /^src\/.+\.(ts|tsx)$/.test(f) && !/^src\/(main\.tsx?|vite-env\.d\.ts)$/.test(f) && fs.existsSync(f));
              const components = added.filter(f => f.endsWith('.tsx'));
              if (!components.length) { console.log('no new component under src/: nothing to check'); process.exit(0); }
              const problems = [];
              for (const f of added) {
                const base = path.posix.basename(f), name = base.replace(/\.tsx?$/, ''), dir = path.posix.basename(path.posix.dirname(f));
                const text = fs.readFileSync(f, 'utf8');
                if (name === 'index') { problems.push(f + ': index barrel'); continue; }
                if ((f.endsWith('.tsx') || /^use[A-Z]/.test(name)) && dir !== name) problems.push(f + ': not in a ' + name + '/ folder of its own');
                if (/^\s*export\s+default\b/m.test(text)) problems.push(f + ': default export');
                if (!f.endsWith('.tsx')) continue;
                const declared = [...text.matchAll(/^(?:export\s+(?:default\s+)?)?(?:const|function)\s+([A-Z]\w*)\b(?!\s*=\s*(?:create|styled|memo\b))/gm)].map(m => m[1])
                  .filter(n => /^[A-Z][a-z0-9]/.test(n) && !/(Props|Context|Schema|Routes?)$/.test(n));
                if (declared.length > 1) problems.push(f + ': ' + declared.length + ' components in one file (' + declared.join(', ') + ')');
                if (/\{\s*[\w.?!]+\.length\s*&&/.test(text)) problems.push(f + ': {x.length && …} can render 0');
                if (/key=\{\s*(index|i|idx)\s*\}/.test(text)) problems.push(f + ': array index used as key');
              }
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log(components.length + ' new components, each alone in a folder of its own name, exported by name');
          expected_exit_code: 0
          timeout: 1m
      - &react-lint
        type: run-command
        name: The lint passes, layer and component rules included
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; npm run --silent lint >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 5m
      - &react-types
        type: run-command
        name: The project typechecks
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; npm run --silent typecheck >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 5m
      - &react-tests
        type: run-command
        name: Every test is green
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; npm run --silent test >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 5m
      - &react-config-unchanged
        type: diff-not-contains
        name: The build, type and lint configuration is unchanged
        config:
          pattern: '(?m)^diff --git a/(package\.json|tsconfig\.json|eslint\.config\.js|eslint/)'
      - &react-judge
        type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-react
    rubric:
      - Puts the expenses screen, its use cases and its HTTP calls in one expenses feature folder, split by layer.
      - Lets the components reach the use cases through a hook, never the HTTP code directly.
      - Shows the field errors the API returns instead of re-validating the fields on the client.

  # Deterministic decider. A bare Vite template: no layer rules to imitate. The
  # skill must lay out the feature and install the guard; the base cannot know it.
  - name: 'React greenfield: a bare Vite template, the first screen'
    prompt: |
      This is a fresh React 19 + TypeScript + Vite project; src/ holds only
      main.tsx. Build the first screen: the expenses of the signed-in employee,
      from GET /api/expenses, which returns
      [{ "id": "e1", "label": "Train ticket", "amount": 42.5, "currency": "EUR", "status": "submitted" }],
      and a form to submit a new one through POST /api/expenses with
      { "label", "amount", "currency" }. The API answers 422 with
      { "errors": { "<field>": "<message>" } } when a field is invalid; show
      those messages next to the fields. Do not start a dev server. Production
      code only, no tests.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files:
        - src: fixtures/vite-template/.gitignore
          dest: .gitignore
        - src: fixtures/vite-template/eslint.config.js
          dest: eslint.config.js
        - src: fixtures/vite-template/index.html
          dest: index.html
        - src: fixtures/vite-template/package.json
          dest: package.json
        - src: fixtures/vite-template/src/main.tsx
          dest: src/main.tsx
        - src: fixtures/vite-template/src/vite-env.d.ts
          dest: src/vite-env.d.ts
        - src: fixtures/vite-template/tests/setup.ts
          dest: tests/setup.ts
        - src: fixtures/vite-template/tsconfig.json
          dest: tsconfig.json
        - src: fixtures/vite-template/vite.config.ts
          dest: vite.config.ts
      commands: *react-setup
    graders:
      - *react-layout
      - *react-components
      - type: run-command
        name: The lint rules that guard the layout are installed in the project
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const deps = { ...pkg.dependencies, ...pkg.devDependencies };
              const problems = [];
              if (!deps['eslint-plugin-boundaries']) problems.push('eslint-plugin-boundaries is not a dependency');
              const config = ['eslint.config.js', 'eslint.config.mjs', 'eslint.config.ts'].find(f => fs.existsSync(f));
              if (!config) problems.push('no eslint flat config');
              else {
                const text = fs.readFileSync(config, 'utf8');
                const local = [...text.matchAll(/from\s+['"](\.[^'"]+)['"]/g)].map(m => path.join(path.dirname(config), m[1])).filter(f => fs.existsSync(f));
                const all = [text, ...local.map(f => fs.readFileSync(f, 'utf8'))].join('\n');
                if (!/boundaries\/(dependencies|element-types)/.test(all)) problems.push(config + ' declares no boundaries dependency rule');
              }
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log('boundaries installed and its dependency rule declared');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: The lint passes once the new dependencies are installed
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; { npm install --no-audit --no-fund --loglevel=error && npm run --silent lint; } >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 6m
      - *react-types
      - *react-tests
      - *react-judge
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-react
    rubric:
      - Lays the screen out as an expenses feature folder split into application, infrastructure and ui, with app/ wiring it.
      - Installs lint rules that keep that layout, rather than relying on the next developer to follow it.
      - Keeps each component small and alone in a folder of its own name.

  # Deterministic decider. A second feature beside todos: its own folder, its
  # own gateway, wired in app/, and nothing imported from the todos feature.
  - name: 'React existing app: a projects screen beside the todos'
    prompt: |
      The project is already set up (React 19, TypeScript, Vite, Vitest, ESLint). Extend it: do
      not scaffold a new project, do not change package.json, tsconfig.json, eslint.config.js or
      the eslint/ folder, and do not start a dev server.

      Add a projects screen below the todos. GET /api/projects returns
      [{ "id": "p1", "name": "Website", "openTodos": 3 }]; list each project with
      its number of open todos. The API owns the projects. Production code
      only, no tests.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files: &todos-files
        - src: fixtures/todos-vite/.gitignore
          dest: .gitignore
        - src: fixtures/todos-vite/eslint.config.js
          dest: eslint.config.js
        - src: fixtures/todos-vite/eslint/clean-architecture.js
          dest: eslint/clean-architecture.js
        - src: fixtures/todos-vite/index.html
          dest: index.html
        - src: fixtures/todos-vite/package.json
          dest: package.json
        - src: fixtures/todos-vite/src/app/App/App.tsx
          dest: src/app/App/App.tsx
        - src: fixtures/todos-vite/src/app/composition.ts
          dest: src/app/composition.ts
        - src: fixtures/todos-vite/src/main.tsx
          dest: src/main.tsx
        - src: fixtures/todos-vite/src/shared/ui/ErrorMessage/ErrorMessage.tsx
          dest: src/shared/ui/ErrorMessage/ErrorMessage.tsx
        - src: fixtures/todos-vite/src/todos/application/ListTodos.ts
          dest: src/todos/application/ListTodos.ts
        - src: fixtures/todos-vite/src/todos/application/TodoGateway.ts
          dest: src/todos/application/TodoGateway.ts
        - src: fixtures/todos-vite/src/todos/application/TodoViewModel.ts
          dest: src/todos/application/TodoViewModel.ts
        - src: fixtures/todos-vite/src/todos/infrastructure/HttpTodoGateway.ts
          dest: src/todos/infrastructure/HttpTodoGateway.ts
        - src: fixtures/todos-vite/src/todos/ui/TodoItem/TodoItem.tsx
          dest: src/todos/ui/TodoItem/TodoItem.tsx
        - src: fixtures/todos-vite/src/todos/ui/TodoList/TodoList.tsx
          dest: src/todos/ui/TodoList/TodoList.tsx
        - src: fixtures/todos-vite/src/todos/ui/TodosContext/TodosContext.ts
          dest: src/todos/ui/TodosContext/TodosContext.ts
        - src: fixtures/todos-vite/src/todos/ui/TodosProvider/TodosProvider.tsx
          dest: src/todos/ui/TodosProvider/TodosProvider.tsx
        - src: fixtures/todos-vite/src/todos/ui/useTodos/useTodos.ts
          dest: src/todos/ui/useTodos/useTodos.ts
        - src: fixtures/todos-vite/src/todos/ui/useTodosUseCases/useTodosUseCases.ts
          dest: src/todos/ui/useTodosUseCases/useTodosUseCases.ts
        - src: fixtures/todos-vite/src/vite-env.d.ts
          dest: src/vite-env.d.ts
        - src: fixtures/todos-vite/tests/integration/todos/infrastructure/HttpTodoGateway.test.ts
          dest: tests/integration/todos/infrastructure/HttpTodoGateway.test.ts
        - src: fixtures/todos-vite/tests/setup.ts
          dest: tests/setup.ts
        - src: fixtures/todos-vite/tests/unit/todos/InMemoryTodoGateway.ts
          dest: tests/unit/todos/InMemoryTodoGateway.ts
        - src: fixtures/todos-vite/tests/unit/todos/application/ListTodos.test.ts
          dest: tests/unit/todos/application/ListTodos.test.ts
        - src: fixtures/todos-vite/tests/unit/todos/ui/TodoList.test.tsx
          dest: tests/unit/todos/ui/TodoList.test.tsx
        - src: fixtures/todos-vite/tsconfig.json
          dest: tsconfig.json
        - src: fixtures/todos-vite/vite.config.ts
          dest: vite.config.ts
      commands: *react-setup
    graders:
      - *react-layout
      - *react-components
      - *react-lint
      - *react-types
      - *react-tests
      - *react-config-unchanged
      - type: file-matches
        name: The application reaches the projects through a gateway
        config:
          path: 'src/*/application/**/*.ts'
          pattern: '(interface|type)\s+\w*Project\w*Gateway\b'
      - type: file-not-exists
        name: Nothing claims to own the projects as a repository
        config:
          path: 'src/**/*Repository*'
      - *react-judge
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-react
    rubric:
      - Adds the projects in their own feature folder, split by layer like the todos.
      - Builds the projects gateway in app/ and hands it to the feature, as the todos already do.
      - Imports nothing from the todos feature.

  # Deterministic decider. The rule belongs to the API: the client asks and
  # shows the refusal, it does not re-decide completion in a use case.
  - name: 'React existing app: complete a todo, refused by the API when already done'
    prompt: |
      The project is already set up (React 19, TypeScript, Vite, Vitest, ESLint). Extend it: do
      not scaffold a new project, do not change package.json, tsconfig.json, eslint.config.js or
      the eslint/ folder, and do not start a dev server.

      Add a "Complete" button to each todo. It sends PUT /api/todos/:id with
      { "done": true }. A todo that is already completed cannot be completed
      again: the API answers 409 in that case, and the user must then see a
      message saying so. Production code only, no tests.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files: *todos-files
      commands: *react-setup
    graders:
      - *react-layout
      - *react-components
      - *react-lint
      - *react-types
      - *react-tests
      - *react-config-unchanged
      - type: run-command
        name: The client sends the request and shows the refusal; it does not re-decide the rule
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), { execSync } = require('child_process');
              const sh = c => { try { return execSync(c, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }); } catch { return ''; } };
              // The API owns "a completed todo cannot be completed again": the client asks, and shows the refusal.
              const changed = [...sh('git diff --name-only --diff-filter=AMR HEAD').split('\n'), ...sh('git ls-files --others --exclude-standard').split('\n')]
                .filter(f => /^src\/.+\.(ts|tsx)$/.test(f) && fs.existsSync(f));
              const addedLines = f => {
                const tracked = sh('git ls-files --error-unmatch ' + JSON.stringify(f)) !== '';
                return tracked ? sh('git diff -U0 HEAD -- ' + JSON.stringify(f)).split('\n').filter(l => l.startsWith('+') && !l.startsWith('+++')).map(l => l.slice(1))
                  : fs.readFileSync(f, 'utf8').split('\n');
              };
              const problems = [];
              // A guard reads the todo's own state: todo.done, !record.completed, view.status === 'done'.
              const guard = /\bif\s*\(\s*!?\s*[\w$]+(?:\??\.[\w$]+)*\??\.(done|completed|isDone|isCompleted)\b|\bif\s*\(.*\.status\s*[!=]==?\s*['"](done|completed)['"]/;
              for (const f of changed.filter(f => /^src\/[^/]+\/application\//.test(f))) {
                for (const line of addedLines(f)) if (guard.test(line) && !/^\s*\/\//.test(line)) problems.push(f + ': decides on completion itself: ' + line.trim());
              }
              const infra = changed.filter(f => /^src\/[^/]+\/infrastructure\//.test(f));
              if (!infra.some(f => /\b409\b|Conflict/.test(fs.readFileSync(f, 'utf8')))) problems.push('no adapter under infrastructure/ reads the 409 the API answers');
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log('the client sends the request and reads the refusal; it does not re-decide the rule');
          expected_exit_code: 0
          timeout: 1m
      - *react-judge
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-react
    rubric:
      - Leaves the "already completed" rule to the API and turns its 409 into a message for the user.
      - Keeps the PUT call in infrastructure, behind the todos gateway.
      - Adds no check of the todo's state in a use case before calling the API.

  # Deterministic decider for component size. Two small pieces of UI that tempt a
  # single file with nested components.
  - name: 'React existing app: a filter and an add form for the todos'
    prompt: |
      The project is already set up (React 19, TypeScript, Vite, Vitest, ESLint). Extend it: do
      not scaffold a new project, do not change package.json, tsconfig.json, eslint.config.js or
      the eslint/ folder, and do not start a dev server.

      Above the todo list, add a filter (All / Open / Done) and a form to add a
      todo: POST /api/todos with { "title" } returns the created todo, which
      then appears in the list. The title is required. Production code only, no
      tests.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files: *todos-files
      commands: *react-setup
    graders:
      - *react-layout
      - *react-components
      - *react-lint
      - *react-types
      - *react-tests
      - *react-config-unchanged
      - *react-judge
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-react
    rubric:
      - Splits the filter, the form and their parts into small components, each in a folder of its own name.
      - Labels the form field and reports the missing title accessibly.
      - Keeps the POST call in infrastructure and the filtering out of the components' markup logic.

  # Non-activation: a configuration change.
  - name: 'React existing app: the API base URL from the environment'
    tags:
      intent: non-activation
    prompt: |
      The API does not always run on the same origin as the app. Read its base
      URL from the VITE_API_BASE_URL environment variable, keeping the current
      behaviour when it is not set.
    environment:
      files: *todos-files
      commands: *react-setup
    graders:
      - *react-lint
      - *react-tests
      - *react-judge
      - type: skill-invocation
        name: The skill under test stays out of the way
        config:
          disallowed:
            - clean-architecture-react
    rubric:
      - Reads VITE_API_BASE_URL where the gateways are built, in app/.
      - Falls back to the current same-origin behaviour when the variable is empty.
      - Changes nothing else.
