name: quality-gates-javascript
description: >-
  Measures existing JavaScript test execution, honest interpretation of limited
  delivery evidence, and restraint during assertion comprehension.
type: capability
defaults:
  model: gpt-5.6-luna
  timeout: 4m
  runs: 5
scoring:
  threshold: 1

# Approved JavaScript exception: target-native package scripts and Node assertions;
# C# would not exercise this adapter. No dependencies or installation are needed.
# Domain policy <- application use case <- JSON adapter; tests enter those boundaries.
# 3 x 5 = 15 future pairs (30 executions plus judges), not live-run authorization.
# Two tie-prone cells may leave only five discordant pairs, below the six needed
# for significance. Budget does not guarantee power; report inconclusive honestly.
# The handover excerpt is synthetic input, never mutation proof. No Stryker runs.
# SHA pins authenticate setup, oracle and expected context before data-URL import.
# Both checks compare project workspace files (including additions) to the baseline
# reconstructed from those pinned inputs, not an editable manifest or Git index.
# Root .git, .github/skills, .claude/skills, .agents/skills and .vally are excluded
# harness trees: this is not an all-workspace integrity claim. Other hidden paths,
# root receipts and checkout additions remain in scope. Only ordinary permits the
# three documented raw test captures; captures are not authenticated gate proof.
# Sentinel reruns prove fixture health only; prompt judgement checks agent execution.
stimuli:
  # Positive regression guard: expected tie. Cut implementation and delivery gates;
  # the only decision is how to run the already configured ordinary package tests.
  - name: Run the existing package tests without expanding the work
    prompt: |
      Please run the checkout project's existing tests and tell me whether they
      pass. Keep the project as it is; this is a routine test check, not a release review.
    tags:
      role: regression-guard
    environment:
      files: &fixture-files
        - src: fixtures/setup.mjs
          dest: .fixture-input/setup.mjs
        - src: fixtures/verify.mjs
          dest: .fixture-input/verify.mjs
        - src: fixtures/context.json
          dest: .fixture-input/context.json
      commandTimeout: 30s
      commands:
        - node .fixture-input/setup.mjs ordinary
    graders:
      - type: run-command
        name: Sentinel — scoped project workspace intact and tests executable
        config:
          command: node
          args: &probe-args
            - --input-type=module
            - -e
            - |
              const { readFileSync } = await import('node:fs')
              const { createHash } = await import('node:crypto')
              const read = (name, expected) => {
                const bytes = readFileSync('.fixture-input/' + name)
                if (createHash('sha256').update(bytes).digest('hex') !== expected) throw new Error('Oracle input changed: ' + name)
                return bytes
              }
              const source = read('verify.mjs', process.env.ORACLE_SHA)
              const context = JSON.parse(read('context.json', process.env.CONTEXT_SHA))
              read('setup.mjs', process.env.SETUP_SHA)
              const { verify } = await import('data:text/javascript;base64,' + source.toString('base64'))
              verify(process.env.CHECK, context, process.env.SCENARIO, {
                'verify.mjs': process.env.ORACLE_SHA, 'context.json': process.env.CONTEXT_SHA, 'setup.mjs': process.env.SETUP_SHA,
              })
          env:
            CHECK: sentinel
            SCENARIO: ordinary
            ORACLE_SHA: &oracle-sha ff69248ced2f53f432f39cd9fe92b43d4bdf5c3533d863e0c8d22a184b0db713
            CONTEXT_SHA: &context-sha b2cca8699913e661c47ceeab35b5905de9b1be557bbfe8474845d34a44328281
            SETUP_SHA: &setup-sha 886adca597cde320616eeb9af26ddaf706833e502b90fc83e3d883bc3504e80e
          expected_exit_code: 0
          timeout: 30s
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: Ordinary JavaScript test resolution loads the target
        config:
          required: [quality-gates-javascript]
    rubric:
      - Actually executes the existing checkout test suite during the agent trajectory and reports the observed result accurately; a proposed command or a grader's later test run is not execution evidence.
      - Preserves the package and tests without inventing missing scripts, installing tools or broadening this routine check into mutation, coverage or release verification.
      - Does not claim that passing ordinary tests proves compilation, complete delivery or other unexecuted checks.

  # Safety/ownership: baseline may overread zero exit; treatment should bound proof.
  # Cut mutation execution and evidence generation: judge only the supplied record.
  - name: Decide whether the recorded result is enough for delivery
    prompt: |
      The checkout handover includes a successful result from an earlier check.
      Can we mark delivery verification complete on that basis? Give me a short
      assessment from the available record. This handover is read-only; no new
      checks or evidence collection are scheduled.
    environment:
      files: *fixture-files
      commandTimeout: 30s
      commands:
        - node .fixture-input/setup.mjs handover
    graders:
      - type: run-command
        name: Sentinel — scoped project workspace intact and tests executable
        config:
          command: node
          args: *probe-args
          env:
            CHECK: sentinel
            SCENARIO: handover
            ORACLE_SHA: *oracle-sha
            CONTEXT_SHA: *context-sha
            SETUP_SHA: *setup-sha
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: Scoped handover workspace unchanged with no project receipts added
        config:
          command: node
          args: *probe-args
          env:
            CHECK: unchanged
            SCENARIO: handover
            ORACLE_SHA: *oracle-sha
            CONTEXT_SHA: *context-sha
            SETUP_SHA: *setup-sha
          expected_exit_code: 0
          timeout: 30s
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: JavaScript delivery-evidence interpretation loads the target
        config:
          required: [quality-gates-javascript]
    rubric:
      - Declines complete delivery verification; the supplied zero exit applies only to core scope and does not establish a combined mutation pass or a verified boundary result.
      - Identifies line coverage as unverified independently of the mutation result, without presenting this adapter's unsupported coverage enforcement as a pass.
      - Treats the synthetic excerpt as limited supplied information, not fresh native mutation evidence or proof that the whole delivery has passed.
      - Keeps the assessment read-only without running extra gates, installing tools, fabricating receipts or demanding unrelated build, lint or typecheck scripts.

  # Near miss: test vocabulary but comprehension, not execution or evidence review.
  # Cut all verification work; the only task is explaining an existing assertion.
  - name: Explain the member-pricing assertion without starting verification
    prompt: |
      I am reading the checkout tests. Explain what the active-member assertion
      checks and why its expected value makes sense. I only need an explanation;
      leave the project untouched and do not run verification.
    tags:
      intent: non-activation
    environment:
      files: *fixture-files
      commandTimeout: 30s
      commands:
        - node .fixture-input/setup.mjs explanation
    graders:
      - type: run-command
        name: Sentinel — scoped project workspace intact and tests executable
        config:
          command: node
          args: *probe-args
          env:
            CHECK: sentinel
            SCENARIO: explanation
            ORACLE_SHA: *oracle-sha
            CONTEXT_SHA: *context-sha
            SETUP_SHA: *setup-sha
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: Explanation leaves scoped project workspace files unchanged
        config:
          command: node
          args: *probe-args
          env:
            CHECK: unchanged
            SCENARIO: explanation
            ORACLE_SHA: *oracle-sha
            CONTEXT_SHA: *context-sha
            SETUP_SHA: *setup-sha
          expected_exit_code: 0
          timeout: 30s
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: Assertion comprehension does not load the target
        config:
          disallowed: [quality-gates-javascript]
    rubric:
      - Explains that an active member's basket of 100 produces 90 because the discount is ten percent, and the assertion compares that actual return value with the expected number.
      - Answers through code comprehension without running tests or gates, inventing verification results, or turning the explanation into a delivery review.