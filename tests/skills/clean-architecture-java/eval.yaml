      commands:
        - 'mvn -B -q -ntp verify'
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "test: payment authorization walking skeleton"'
    graders:
      - type: run-command
        name: 'Sentinel: the Maven build still resolves'
        config:
          command: mvn
          args: [-B, -q, -o, validate]
          expected_exit_code: 0
          timeout: 2m
      - type: run-command
        name: Every test in the build is green
        config:
          command: bash
          args:
            - -c
            - |
              log="$(mktemp)"; mvn -B -q -o verify >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1
