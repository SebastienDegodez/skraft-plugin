  # Regression guard. The fixture is already layered; the baseline extended it
  # correctly 2/2 in the probes. A tie is expected; a loss means the skill
  # pushed a correct extension towards something worse.
  - name: 'Java existing build: add refunds to the payment service'
    tags:
      role: regression-guard
    prompt: |
      We need refunds. Add an HTTP endpoint POST /payments/{reference}/refunds (body:
      amount, currency) that asks the payment provider to refund an authorized
      payment and keeps a receipt of the provider's answer, like authorization
      already does. The provider's API: POST /refunds with JSON
      {"reference","amount","currency"}; it answers 200 when refunded and 409 when the
      payment cannot be refunded.

      Implement it in production code; no new tests needed.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files:
        - src: fixtures/payment-spring/.gitignore
          dest: .gitignore
        - src: fixtures/payment-spring/pom.xml
          dest: pom.xml
        - src: fixtures/payment-spring/payment-domain/pom.xml
          dest: payment-domain/pom.xml
        - src: fixtures/payment-spring/payment-domain/Money.java
          dest: payment-domain/src/main/java/com/example/payment/domain/Money.java
        - src: fixtures/payment-spring/payment-domain/AuthorizationOutcome.java
          dest: payment-domain/src/main/java/com/example/payment/domain/AuthorizationOutcome.java
        - src: fixtures/payment-spring/payment-application/pom.xml
          dest: payment-application/pom.xml
        - src: fixtures/payment-spring/payment-application/PaymentGateway.java
          dest: payment-application/src/main/java/com/example/payment/application/PaymentGateway.java
        - src: fixtures/payment-spring/payment-application/ReceiptStore.java
          dest: payment-application/src/main/java/com/example/payment/application/ReceiptStore.java
        - src: fixtures/payment-spring/payment-application/AuthorizePayment.java
          dest: payment-application/src/main/java/com/example/payment/application/AuthorizePayment.java
        - src: fixtures/payment-spring/payment-infrastructure/pom.xml
          dest: payment-infrastructure/pom.xml
        - src: fixtures/payment-spring/payment-infrastructure/HttpPaymentGateway.java
          dest: payment-infrastructure/src/main/java/com/example/payment/infrastructure/HttpPaymentGateway.java
        - src: fixtures/payment-spring/payment-infrastructure/FileSystemReceiptStore.java
          dest: payment-infrastructure/src/main/java/com/example/payment/infrastructure/FileSystemReceiptStore.java
        - src: fixtures/payment-spring/payment-app/pom.xml
          dest: payment-app/pom.xml
        - src: fixtures/payment-spring/payment-app/PaymentApplication.java
          dest: payment-app/src/main/java/com/example/payment/app/PaymentApplication.java
        - src: fixtures/payment-spring/payment-app/PaymentConfiguration.java
          dest: payment-app/src/main/java/com/example/payment/app/PaymentConfiguration.java
        - src: fixtures/payment-spring/payment-app/application.properties
          dest: payment-app/src/main/resources/application.properties
        - src: fixtures/payment-spring/payment-unit-test/pom.xml
          dest: payment-unit-test/pom.xml
        - src: fixtures/payment-spring/payment-unit-test/AuthorizePaymentTest.java
          dest: payment-unit-test/src/test/java/com/example/payment/unittest/authorizepayment/AuthorizePaymentTest.java
        - src: fixtures/payment-spring/payment-integration-test/pom.xml
          dest: payment-integration-test/pom.xml
