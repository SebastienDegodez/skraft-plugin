      returns an order and POST /orders/{id}/cancel cancels it. A customer may only
      see and cancel their own orders; an order can only be cancelled while it is
      pending. Authentication is already handled upstream: each request carries the
      authenticated customer id in the X-Customer-Id header. Create whatever order
      model you need and keep orders in memory. Production code only, no tests.
