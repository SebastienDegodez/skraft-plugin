      converted to EUR with the exchange-rate provider's REST API
      (GET /rates/{currency} returns {"rate": 1.08}). A claim above 1000 EUR waits
      for a manager's approval; any other claim is approved at once. Keep claims in
      memory for now.

      Write the production code for this first feature and the build files. No
      tests for now.
