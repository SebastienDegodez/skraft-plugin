name: clean-architecture-java
description: |
  Verifies that a Java / Spring Boot service is laid out as Clean Architecture
  and stays that way: one Maven module per layer, each referencing only its inner
  neighbour, use cases as plain classes, and no port or adapter vocabulary.
  Probes without the skill (Sonnet, 2 runs per case) followed an existing
  layered build every time, but on an empty repository asked for "Clean
  Architecture" they produced one Maven module, a use-case interface with a
  *Service implementation, and port vocabulary. The greenfield stimuli are the
  deciders; the existing build is a regression guard.
type: capability
defaults:
  timeout: 4m
  runs: 4
scoring:
  threshold: 1

stimuli:
  # Deterministic decider. Empty repository: nothing to imitate, so the layout
  # is the agent's own call. The build is not run: an empty repository warms no
  # Maven cache, and compiling is not the decision under test.
  - name: 'Java greenfield: a library loan service with persistence'
    prompt: |
      Start a new Java 21 / Spring Boot 3.5 service, built with Maven, following
      Clean Architecture. Its first feature: a library member borrows a book
      through POST /loans (body: memberId, isbn). A member may hold at most 3 loans
      at a time; a book already on loan cannot be borrowed. Loans are stored in
      PostgreSQL through Spring Data JPA.

      Write the production code for this first feature and the build files. No
      tests for now.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      commands:
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git commit --quiet --allow-empty -m "chore: empty repository"'
    graders:
      - type: run-command
        name: Each layer is a Maven module that references only its inner neighbour
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'target', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const files = walk('.');
              const modules = files.filter(f => path.basename(f) === 'pom.xml' && path.dirname(f) !== '.').map(p => {
                const pom = fs.readFileSync(p, 'utf8').replace(/<parent>[\s\S]*?<\/parent>/, '').replace(/<dependencyManagement>[\s\S]*?<\/dependencyManagement>/, '');
                return { dir: path.dirname(p), id: (pom.match(/<artifactId>([^<]+)<\/artifactId>/) || [])[1], pom };
              });
              const ids = new Set(modules.map(m => m.id));
              const internal = m => [...m.pom.matchAll(/<dependency>([\s\S]*?)<\/dependency>/g)]
                .filter(d => !/<scope>test<\/scope>/.test(d[1]))
                .map(d => (d[1].match(/<artifactId>([^<]+)<\/artifactId>/) || [])[1])
                .filter(a => ids.has(a)).sort();
              const layer = suffix => modules.find(m => new RegExp(`(^|-)${suffix}$`).test(m.id));
              const [domain, application, infrastructure] = ['domain', 'application', 'infrastructure'].map(layer);
              const boot = modules.find(m => ![domain, application, infrastructure].includes(m)
                && files.some(f => f.startsWith(m.dir + path.sep) && f.endsWith('.java') && fs.readFileSync(f, 'utf8').includes('@SpringBootApplication')));
              const missing = Object.entries({ domain, application, infrastructure, 'Spring Boot entry point': boot }).filter(([, m]) => !m).map(([n]) => n);
              if (missing.length) { console.log(`no Maven module of its own for: ${missing.join(', ')}`); process.exit(1); }
              const expected = [[domain, []], [application, [domain.id]], [infrastructure, [application.id]], [boot, [infrastructure.id]]];
              const wrong = expected.filter(([m, want]) => JSON.stringify(internal(m)) !== JSON.stringify(want))
                .map(([m, want]) => `${m.id} references [${internal(m)}], expected [${want}]`);
              if (wrong.length) { console.log(wrong.join('\n')); process.exit(1); }
              console.log('one module per layer, each referencing only its inner neighbour');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: A use case is not hidden behind an interface implemented in Application
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'target', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const sources = walk('.').map(f => '/' + f.split(path.sep).join('/'))
                .filter(f => f.endsWith('.java') && f.includes('/src/main/') && /[-\/.]application[\/.]/.test(f))
                .map(f => f.slice(1));
              const text = sources.map(f => fs.readFileSync(f, 'utf8')).join('\n');
              const interfaces = [...text.matchAll(/\binterface\s+(\w+)/g)].map(m => m[1]);
              const implemented = interfaces.filter(i => new RegExp(`\\bimplements\\b[^{]*\\b${i}\\b`).test(text));
              if (implemented.length) { console.log(`use cases hidden behind an interface implemented in Application: ${implemented.join(', ')}`); process.exit(1); }
              console.log('no Application interface is implemented inside Application');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: No port or adapter package, and no port vocabulary in the code
        config:
          command: bash
          args:
            - -c
            - |
              dirs="$(find . -path ./.git -prune -o -path '*/target' -prune -o -type d \( -iname port -o -iname ports -o -iname adapter -o -iname adapters \) -print)"
              words="$(grep -rniIE --include=*.java --exclude-dir=target --exclude-dir=.git '^package .*\.(ports?|adapters?)(\.|;)|\b(input|output|inbound|outbound|driving|driven|primary|secondary) ports?\b|\bports? (and|&) adapters?\b|hexagonal' . || true)"
              [ -z "$dirs$words" ] && exit 0
              printf '%s\n%s\n' "$dirs" "$words" | head -n 20
              exit 1
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: Domain and Application import neither Spring nor Jakarta
        config:
          command: bash
          args:
            - -c
            - |
              hits="$(grep -rlE --include=*.java '^import (static )?(org\.springframework|jakarta\.)' . | grep -E '/src/main/' | grep -E '(^|[-/.])(domain|application)([/.]|$)' || true)"
              [ -z "$hits" ] && exit 0
              echo "$hits" | head -n 20
              exit 1
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-java
    rubric:
      - Builds each layer as its own Maven module, so the build rejects a reference that skips or reverses a layer.
      - Puts the HTTP endpoint in the module that boots the application, not beside the persistence code.
      - Lets the endpoint call the use case class directly, with no interface standing in front of it.
      - Keeps Spring and JPA out of the business rules and the use case.

  # Deterministic decider, second domain: no database, one outbound HTTP call,
  # so the layout decision is not tied to the JPA case.
  - name: 'Java greenfield: expense claims converted through a rates provider'
