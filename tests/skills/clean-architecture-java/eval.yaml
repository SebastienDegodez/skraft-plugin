          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-java
    rubric:
      - Adds the refund call to the existing modules, following the layout already there.
      - Lets the endpoint call the refund use case class directly, with no interface standing in front of it.
      - Reads a 409 from the provider as a refusal rather than an error.

  # Near miss. A Spring Boot change in the same build that touches no layer
  # decision: the skill must stay out of the way.
  - name: 'Java existing build: a configurable timeout on the provider client'
    tags:
