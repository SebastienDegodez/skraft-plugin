              hits="$(grep -rlE --include=*.java '^import (static )?(org\.springframework|jakarta\.)' . | grep -E '/src/main/' | grep -E '(^|[-/.])(domain|application)([/.]|$)' || true)"
              [ -z "$hits" ] && exit 0
              echo "$hits" | head -n 20
              exit 1
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-java
    rubric:
      - Adds the refund call to the existing modules, following the layout already there.
      - Lets the endpoint call the refund use case class directly, with no interface standing in front of it.
