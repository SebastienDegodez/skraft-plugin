          pattern: '(?m)^diff --git a/(?:[^ ]*/)?pom\.xml '
      - type: run-command
        name: An order is built by a factory and identified by a typed id
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'target', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const sources = walk('.').map(f => '/' + f.split(path.sep).join('/'))
                .filter(f => f.endsWith('.java') && f.includes('/src/main/'))
                .map(f => ({ file: f.slice(1), text: fs.readFileSync(f.slice(1), 'utf8') }));
              const inLayer = layer => sources.filter(s => new RegExp(`[-/.]${layer}[/.]`).test('/' + s.file));
              const methods = s => [...s.text.matchAll(/public\s+(?:final\s+|static\s+|synchronized\s+)*([\w<>\[\], ?.]+?)\s+(\w+)\s*\(([^)]*)\)/g)]
                .map(m => ({ ret: m[1].trim(), name: m[2], params: m[3], cls: (s.text.match(/\b(?:class|record)\s+(\w+)/) || [])[1] || '' }))
                .filter(m => !['class', 'record', 'new', 'return'].includes(m.ret));

              const order = inLayer('domain').find(s => /\b(?:final\s+)?class\s+Order\b/.test(s.text));
              if (!order) { console.log('no Order class in Domain (a record exposes a public constructor)'); process.exit(1); }
              const problems = [];
              if (!/private\s+Order\s*\(/.test(order.text)) problems.push('Order has no private constructor');
              if (!/static\s+Order\s+\w+\s*\(/.test(order.text)) problems.push('Order has no static factory');
              if (/public\s+Order\s*\(/.test(order.text)) problems.push('Order has a public constructor');
              if (!inLayer('domain').some(s => /\b(record|class)\s+OrderId\b/.test(s.text))) problems.push('no OrderId type in Domain');
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log('Order is built by a factory over a private constructor and identified by OrderId');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: Who may cancel is an aggregate rule, who may read is a use-case check
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'target', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const sources = walk('.').map(f => '/' + f.split(path.sep).join('/'))
                .filter(f => f.endsWith('.java') && f.includes('/src/main/'))
                .map(f => ({ file: f.slice(1), text: fs.readFileSync(f.slice(1), 'utf8') }));
              const inLayer = layer => sources.filter(s => new RegExp(`[-/.]${layer}[/.]`).test('/' + s.file));
              const methods = s => [...s.text.matchAll(/public\s+(?:final\s+|static\s+|synchronized\s+)*([\w<>\[\], ?.]+?)\s+(\w+)\s*\(([^)]*)\)/g)]
                .map(m => ({ ret: m[1].trim(), name: m[2], params: m[3], cls: (s.text.match(/\b(?:class|record)\s+(\w+)/) || [])[1] || '' }))
                .filter(m => !['class', 'record', 'new', 'return'].includes(m.ret));

              const order = inLayer('domain').find(s => /\b(class|record)\s+Order\b/.test(s.text));
              const cancel = order && order.text.match(/(?:public\s+)?[\w<>]+\s+cancel\s*\(([^)]*)\)/);
              if (!cancel || !cancel[1].trim()) { console.log('Order.cancel takes no caller: who may cancel is not an aggregate rule'); process.exit(1); }
              const getter = inLayer('application').find(s => /\b(class)\s+(Get|Find|View|Consult|Load)\w*\b/.test(s.text));
              if (!getter || !/(isOwnedBy|owner|Owner|ownedBy|customerId\(\)\s*\.equals|\.equals\()/.test(getter.text)) { console.log('the read use case does not check who may see the order'); process.exit(1); }
              const api = sources.filter(s => /@(Rest)?Controller\b/.test(s.text));
              const leak = api.filter(s => /(isOwnedBy|customerId\(\)\s*\.equals|ownerId)/.test(s.text)).map(s => s.file);
              if (leak.length) { console.log(`endpoint checks ownership itself: ${leak.join(', ')}`); process.exit(1); }
              console.log('read restriction in the use case, change restriction in the aggregate');
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-java
    rubric:
      - Refuses a cancellation by another customer inside the order itself, from the caller's id it receives.
      - Hides another customer's order in the read use case, without the order knowing who asks.
      - Keeps the endpoint to reading the header and calling the use cases.
      - Answers a foreign order the same way as a missing one.

