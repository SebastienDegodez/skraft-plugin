      - Builds each layer as its own Maven module, so the build rejects a reference that skips or reverses a layer.
      - Declares the rate lookup as an interface the use case owns and implements the HTTP call outside the business layers.
      - Puts the HTTP endpoint in the module that boots the application and lets it call the use case class directly.
      - Keeps the 1000 EUR rule with the business code, out of the endpoint and the HTTP client.

  # Regression guard. The fixture is already layered; the baseline extended it
  # correctly 2/2 in the probes. A tie is expected; a loss means the skill
  # pushed a correct extension towards something worse.
  - name: 'Java existing build: add refunds to the payment service'
    tags:
      role: regression-guard
    prompt: |
      We need refunds. Add an HTTP endpoint POST /payments/{reference}/refunds (body:
      amount, currency) that asks the payment provider to refund an authorized
      payment and keeps a receipt of the provider's answer, like authorization
      already does. The provider's API: POST /refunds with JSON
      {"reference","amount","currency"}; it answers 200 when refunded and 409 when the
      payment cannot be refunded.

      Implement it in production code; no new tests needed.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files:
        - src: ../clean-architecture-testing/fixtures/payment-spring/.gitignore
          dest: .gitignore
        - src: ../clean-architecture-testing/fixtures/payment-spring/pom.xml
          dest: pom.xml
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-domain/pom.xml
          dest: payment-domain/pom.xml
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-domain/Money.java
          dest: payment-domain/src/main/java/com/example/payment/domain/Money.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-domain/AuthorizationOutcome.java
          dest: payment-domain/src/main/java/com/example/payment/domain/AuthorizationOutcome.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-application/pom.xml
          dest: payment-application/pom.xml
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-application/PaymentGateway.java
          dest: payment-application/src/main/java/com/example/payment/application/PaymentGateway.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-application/ReceiptStore.java
          dest: payment-application/src/main/java/com/example/payment/application/ReceiptStore.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-application/AuthorizePayment.java
          dest: payment-application/src/main/java/com/example/payment/application/AuthorizePayment.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-infrastructure/pom.xml
          dest: payment-infrastructure/pom.xml
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-infrastructure/HttpPaymentGateway.java
          dest: payment-infrastructure/src/main/java/com/example/payment/infrastructure/HttpPaymentGateway.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-infrastructure/FileSystemReceiptStore.java
          dest: payment-infrastructure/src/main/java/com/example/payment/infrastructure/FileSystemReceiptStore.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-app/pom.xml
          dest: payment-app/pom.xml
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-app/PaymentApplication.java
          dest: payment-app/src/main/java/com/example/payment/app/PaymentApplication.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-app/PaymentConfiguration.java
          dest: payment-app/src/main/java/com/example/payment/app/PaymentConfiguration.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-app/application.properties
          dest: payment-app/src/main/resources/application.properties
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-unit-test/pom.xml
          dest: payment-unit-test/pom.xml
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-unit-test/AuthorizePaymentTest.java
          dest: payment-unit-test/src/test/java/com/example/payment/unittest/authorizepayment/AuthorizePaymentTest.java
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-integration-test/pom.xml
          dest: payment-integration-test/pom.xml
        - src: ../clean-architecture-testing/fixtures/payment-spring/payment-integration-test/FileSystemReceiptStoreTest.java
          dest: payment-integration-test/src/test/java/com/example/payment/integrationtest/receiptstore/FileSystemReceiptStoreTest.java
      commands:
        - 'mvn -B -q -ntp verify'
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "test: payment authorization walking skeleton"'
    graders:
      - type: run-command
        name: 'Sentinel: the Maven build still resolves'
        config:
          command: mvn
          args: [-B, -q, -o, validate]
          expected_exit_code: 0
          timeout: 2m
      - type: run-command
        name: Every test in the build is green
        config:
          command: bash
          args:
            - -c
            - |
              log="$(mktemp)"; mvn -B -q -o verify >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1
          expected_exit_code: 0
          timeout: 5m
      - type: diff-not-contains
        name: The module graph is unchanged
        config:
          pattern: '(?m)^diff --git a/(?:[^ ]*/)?pom\.xml '
      - type: run-command
        name: A use case is not hidden behind an interface implemented in Application
