          args:
            - -c
            - 'sln="$(ls *.slnx *.sln 2>/dev/null | head -n 1)"; [ -n "$sln" ] || { echo "no solution file at the root"; exit 1; }; log="$(mktemp)"; dotnet build "$sln" >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        name: One project per layer, each referencing only inward
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p.split(path.sep).join('/'));
                }
                return acc;
              };
              const projects = walk('.').filter(f => f.endsWith('.csproj')).map(f => ({
                name: path.basename(f, '.csproj'),
                refs: [...fs.readFileSync(f, 'utf8').matchAll(/<ProjectReference\s+Include="([^"]+)"/g)].map(m => path.basename(m[1].replace(/\\/g, '/'), '.csproj')),
              }));
              const layerOf = n => (n.match(/\.(Domain|Application|Infrastructure|Api|WebApi|Web)$/) || [])[1];
              const rank = { Domain: 0, Application: 1, Infrastructure: 2, Api: 3, WebApi: 3, Web: 3 };
              const missing = ['Domain', 'Application', 'Infrastructure'].filter(l => !projects.some(p => layerOf(p.name) === l));
              if (missing.length) { console.log('no project for: ' + missing.join(', ')); process.exit(1); }
              const outward = projects.filter(p => layerOf(p.name)).flatMap(p => p.refs.filter(r => layerOf(r) && rank[layerOf(r)] >= rank[layerOf(p.name)]).map(r => p.name + ' references ' + r));
              if (outward.length) { console.log(outward.join('\n')); process.exit(1); }
              console.log('Domain, Application and Infrastructure projects, references pointing inward');
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-dotnet
    rubric:
      - Puts each class of the loan feature in a loan folder of its layer project.
      - Keeps the loan limit and the already-on-loan rule in the domain, not in the endpoint.

