name: clean-architecture-dotnet
description: |
  Verifies the .NET Clean Architecture guidance on features asked for in plain
  terms, never by pattern name: commands that return nothing and receive their
  id, queries that return a read model, aggregates built by a factory with a
  typed id, access rules split between use case and aggregate. Two regression
  guards protect what the model already does unaided and what a shorter skill
  must not break: no dispatch bus for a couple of use cases, and a second
  bounded context that shares no concrete type. Probes (Sonnet, 2 runs per
  cell) without the skill failed the deciders' rules 0/4 each; with the bus
  guidance removed from the skill, a bus appeared in 2/4 runs. The fixture is
  laid out by feature inside each project (Authorization/, Shared/); the
  feature-folder grader passed every existing-solution run with or without the
  skill, while the greenfield put the EF Core code in Persistence/ 3/3 without
  it and 3/3 with the skill's former Persistence/ example, 2/2 once fixed.
type: capability
defaults:
  timeout: 4m
  runs: 4
  # Pinned to Sonnet even though it is the repository default: the probes that
  # sized these stimuli and their graders ran on Sonnet, and the verdict must stay
  # comparable if DEFAULT_MODEL moves. MODEL in the environment still overrides it
  # for the compare-models matrix.
  model: claude-sonnet-5.5
scoring:
  threshold: 1

stimuli:
  # Deterministic decider. Baseline probes: the create use case returned the
  # stored entity and generated the id, the fetch returned the domain object.
  - name: '.NET: contacts, created and fetched over HTTP'
    prompt: |
      Add a contacts feature: create a contact (name, email) and get a contact by
      id, over HTTP (POST /contacts, GET /contacts/:id), with minimal APIs.
      Contacts have no business rules. Keep them in memory for now. Production
      code only, no tests.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files:
        - src: fixtures/payment/.gitignore
          dest: .gitignore
        - src: fixtures/payment/Directory.Build.props
          dest: Directory.Build.props
        - src: fixtures/payment/Directory.Packages.props
          dest: Directory.Packages.props
        - src: fixtures/payment/PaymentAuthorization.slnx
          dest: PaymentAuthorization.slnx
        - src: fixtures/payment/src/PaymentAuthorization.Domain/PaymentAuthorization.Domain.csproj
          dest: src/PaymentAuthorization.Domain/PaymentAuthorization.Domain.csproj
        - src: fixtures/payment/src/PaymentAuthorization.Domain/Shared/Money.cs
          dest: src/PaymentAuthorization.Domain/Shared/Money.cs
        - src: fixtures/payment/src/PaymentAuthorization.Domain/Authorization/AuthorizationOutcome.cs
          dest: src/PaymentAuthorization.Domain/Authorization/AuthorizationOutcome.cs
        - src: fixtures/payment/src/PaymentAuthorization.Application/PaymentAuthorization.Application.csproj
          dest: src/PaymentAuthorization.Application/PaymentAuthorization.Application.csproj
        - src: fixtures/payment/src/PaymentAuthorization.Application/Authorization/IPaymentGateway.cs
          dest: src/PaymentAuthorization.Application/Authorization/IPaymentGateway.cs
        - src: fixtures/payment/src/PaymentAuthorization.Application/Authorization/IReceiptStore.cs
          dest: src/PaymentAuthorization.Application/Authorization/IReceiptStore.cs
        - src: fixtures/payment/src/PaymentAuthorization.Application/Authorization/AuthorizePayment.cs
          dest: src/PaymentAuthorization.Application/Authorization/AuthorizePayment.cs
        - src: fixtures/payment/src/PaymentAuthorization.Infrastructure/PaymentAuthorization.Infrastructure.csproj
          dest: src/PaymentAuthorization.Infrastructure/PaymentAuthorization.Infrastructure.csproj
        - src: fixtures/payment/src/PaymentAuthorization.Infrastructure/Authorization/HttpPaymentGateway.cs
          dest: src/PaymentAuthorization.Infrastructure/Authorization/HttpPaymentGateway.cs
        - src: fixtures/payment/src/PaymentAuthorization.Infrastructure/Authorization/FileSystemReceiptStore.cs
          dest: src/PaymentAuthorization.Infrastructure/Authorization/FileSystemReceiptStore.cs
        - src: fixtures/payment/tests/PaymentAuthorization.UnitTest/PaymentAuthorization.UnitTest.csproj
          dest: tests/PaymentAuthorization.UnitTest/PaymentAuthorization.UnitTest.csproj
        - src: fixtures/payment/tests/PaymentAuthorization.UnitTest/AuthorizePayment/AuthorizePaymentTests.cs
          dest: tests/PaymentAuthorization.UnitTest/AuthorizePayment/AuthorizePaymentTests.cs
        - src: fixtures/payment/tests/PaymentAuthorization.IntegrationTest/PaymentAuthorization.IntegrationTest.csproj
          dest: tests/PaymentAuthorization.IntegrationTest/PaymentAuthorization.IntegrationTest.csproj
        - src: fixtures/payment/tests/PaymentAuthorization.IntegrationTest/ReceiptStore/FileSystemReceiptStoreTests.cs
          dest: tests/PaymentAuthorization.IntegrationTest/ReceiptStore/FileSystemReceiptStoreTests.cs
      commands:
        - 'dotnet restore PaymentAuthorization.slnx'
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "test: payment authorization walking skeleton"'
    graders:
      - &feature-folders
        type: run-command
        name: Each new layer file sits in a feature folder; no application feature imports another
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path'), { execSync } = require('child_process');
              const sh = c => { try { return execSync(c, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }); } catch { return null; } };
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'target', 'node_modules', '.venv', '__pycache__'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p.split(path.sep).join('/'));
                }
                return acc;
              };
              // Files the agent added: new tracked files since HEAD plus untracked ones. No HEAD: everything.
              const added = sh('git rev-parse --verify -q HEAD') === null
                ? walk('.').map(f => f.replace(/^\.\//, ''))
                : [...(sh('git diff --name-only --diff-filter=AR HEAD') || '').split('\n'), ...(sh('git ls-files --others --exclude-standard') || '').split('\n')].filter(Boolean);
              const TECHNICAL = /^(ports?|adapters?|services?|repositor(y|ies)|persistence|models?|entit(y|ies)|dtos?|use_?cases?|commands?|quer(y|ies)|handlers?|controllers?|endpoints?|routers?|interfaces?|abstractions?|contracts?|gateways?|clients?|http|web|rest|api|jpa|db|database|events?|exceptions?|errors?|value_?objects?|aggregates?|mappers?|impl|inbound|outbound|in|out|core|internal)$/i;
              const SHARED = /^(shared|common)$/i;
              // Map a source file to { layer, rest } where rest is its path below the layer root.
              const locate = f => {
                let m;
                if (f.endsWith('.cs') && (m = f.match(/(?:^|\/)[\w.]+\.(Domain|Application|Infrastructure)\/(.+)$/))) return { layer: m[1].toLowerCase(), rest: m[2], lang: 'cs' };
                if (f.endsWith('.java') && f.includes('/src/main/java/') && (m = f.match(/\/(domain|application|infrastructure)\/((?:(?!\/(?:domain|application|infrastructure)\/).)+)$/))) return { layer: m[1], rest: m[2], lang: 'java' };
                if (f.endsWith('.py') && !/(^|\/)tests?\//.test(f) && (m = f.match(/(?:^|\/)(domain|application|infrastructure)\/(.+)$/))) return { layer: m[1], rest: m[2], lang: 'py' };
                return null;
              };
              const AT_ROOT_OK = /^(__init__\.py|DependencyInjection\.cs|\w*ServiceCollectionExtensions\.cs|\w*DbContext\.cs|GlobalUsings\.cs|AssemblyInfo\.cs|I\w*Marker\.cs|package-info\.java)$/;
              const featureOf = rest => {
                const parts = rest.split('/');
                if (/^features$/i.test(parts[0])) parts.shift();
                return parts.length > 1 ? parts[0] : null;
              };
              const problems = [];
              const located = added.map(f => ({ f, at: locate(f) })).filter(x => x.at);
              if (!located.length) { console.log('no new source file in domain, application or infrastructure'); process.exit(1); }
              for (const { f, at } of located) {
                const feature = featureOf(at.rest);
                if (!feature) { if (!AT_ROOT_OK.test(path.basename(f))) problems.push(f + ': at the root of the ' + at.layer + ' layer, not in a feature folder'); continue; }
                if (TECHNICAL.test(feature)) problems.push(f + ': in a technical folder (' + feature + '), not a feature folder');
                // An application feature never reaches into another application feature; shared/ is for both.
                if (at.layer !== 'application' || SHARED.test(feature)) continue;
                const text = fs.readFileSync(f, 'utf8');
                const refs = at.lang === 'cs' ? [...text.matchAll(/\.Application\.(?:Features\.)?(\w+)\b/g)].map(m => m[1])
                  : at.lang === 'java' ? [...text.matchAll(/^\s*import\s+(?:static\s+)?[\w.]*\.application\.(\w+)\./gm)].map(m => m[1])
                  : [...text.matchAll(/^\s*(?:from|import)\s+[\w.]*\.application\.(\w+)/gm), ...text.matchAll(/^\s*from\s+\.\.(\w+)/gm)].map(m => m[1]);
                const root = f.slice(0, f.length - at.rest.length);
                const siblings = new Set(fs.readdirSync(root, { withFileTypes: true }).filter(e => e.isDirectory()).map(e => e.name.toLowerCase()));
                if (fs.existsSync(root + 'Features')) for (const e of fs.readdirSync(root + 'Features', { withFileTypes: true })) if (e.isDirectory()) siblings.add(e.name.toLowerCase());
                for (const other of new Set(refs)) {
                  if (!siblings.has(other.toLowerCase()) || other.toLowerCase() === feature.toLowerCase() || SHARED.test(other)) continue;
                  problems.push(f + ': application feature ' + feature + ' imports application feature ' + other);
                }
              }
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log(located.length + ' new layer files, each in a feature folder; no application feature imports another');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: The solution builds
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; dotnet build PaymentAuthorization.slnx >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 4m
      - type: run-command
        name: Every test in the solution is green
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; dotnet test PaymentAuthorization.slnx >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        name: Creating a contact returns nothing and receives the new id
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const all = walk('.').map(f => f.split(path.sep).join('/'));
              const sources = all.filter(f => f.endsWith('.cs') && !f.startsWith('tests/'))
                .map(f => ({ file: f, text: fs.readFileSync(f, 'utf8') }));
              const inLayer = layer => sources.filter(s => new RegExp(('\\.' + (layer) + '/')).test(s.file));
              const methods = s => [...s.text.matchAll(/public\s+(?:async\s+|static\s+|virtual\s+|override\s+)*([\w<>\[\], ?.]+?)\s+(\w+)\s*\(([^)]*)\)/g)]
                .map(m => ({ ret: m[1].trim(), name: m[2], params: m[3], cls: (s.text.match(/\b(?:class|record)\s+(\w+)/) || [])[1] || '' }))
                .filter(m => !/\b(class|record|struct|interface|new|return)\b/.test(m.ret));

              const creates = inLayer('Application').flatMap(methods)
                .filter(m => /^(Create|Add|Register)/.test(m.name) || (/^(Handle|Execute|Invoke)(Async)?$/.test(m.name) && /^(Create|Add|Register)/.test(m.cls)));
              if (!creates.length) { console.log('no create entry point in Application'); process.exit(1); }
              const records = Object.fromEntries(sources.flatMap(s => [...s.text.matchAll(/record\s+(?:class\s+)?(\w+)\s*\(([^)]*)\)/g)].map(m => [m[1], m[2]])));
              const carriesId = m => /\b\w*Id\b|\bid\b/.test(m.params)
                || [...m.params.matchAll(/([A-Z]\w+)\s+\w+/g)].some(t => /\b\w*Id\b/.test(records[t[1]] || ''));
              const bad = creates.filter(m => !/^(Task|ValueTask|void)$/.test(m.ret) || !carriesId(m)).map(m => ((m.cls) + '.' + (m.name) + '(' + (m.params.trim()) + ') returns ' + (m.ret)));
              if (bad.length) { console.log(bad.join('\n')); process.exit(1); }
              console.log('create returns nothing and receives the new id');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: Fetching a contact returns a read model, not the domain object
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const all = walk('.').map(f => f.split(path.sep).join('/'));
              const sources = all.filter(f => f.endsWith('.cs') && !f.startsWith('tests/'))
                .map(f => ({ file: f, text: fs.readFileSync(f, 'utf8') }));
              const inLayer = layer => sources.filter(s => new RegExp(('\\.' + (layer) + '/')).test(s.file));
              const methods = s => [...s.text.matchAll(/public\s+(?:async\s+|static\s+|virtual\s+|override\s+)*([\w<>\[\], ?.]+?)\s+(\w+)\s*\(([^)]*)\)/g)]
                .map(m => ({ ret: m[1].trim(), name: m[2], params: m[3], cls: (s.text.match(/\b(?:class|record)\s+(\w+)/) || [])[1] || '' }))
                .filter(m => !/\b(class|record|struct|interface|new|return)\b/.test(m.ret));

              const domainTypes = new Set(inLayer('Domain').flatMap(s => [...s.text.matchAll(/\b(?:class|record|struct|enum)\s+(\w+)/g)].map(m => m[1])));
              const queries = inLayer('Application').flatMap(methods)
                .filter(m => /^(Get|Find|View|Consult|Load)/.test(m.name) || (/^(Handle|Execute|Invoke)(Async)?$/.test(m.name) && /^(Get|Find|View|Consult|Load)/.test(m.cls)));
              if (!queries.length) { console.log('no query entry point in Application'); process.exit(1); }
              const bad = queries.filter(m => !/ViewModel\b/.test(m.ret) || m.ret.match(/\w+/g).some(t => domainTypes.has(t))).map(m => ((m.cls) + '.' + (m.name) + ' returns ' + (m.ret)));
              if (bad.length) { console.log(bad.join('\n')); process.exit(1); }
              console.log('queries return a *ViewModel, never a domain type');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: Contacts without rules stay plain data, not an aggregate
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const all = walk('.').map(f => f.split(path.sep).join('/'));
              const sources = all.filter(f => f.endsWith('.cs') && !f.startsWith('tests/'))
                .map(f => ({ file: f, text: fs.readFileSync(f, 'utf8') }));
              const inLayer = layer => sources.filter(s => new RegExp(('\\.' + (layer) + '/')).test(s.file));
              const methods = s => [...s.text.matchAll(/public\s+(?:async\s+|static\s+|virtual\s+|override\s+)*([\w<>\[\], ?.]+?)\s+(\w+)\s*\(([^)]*)\)/g)]
                .map(m => ({ ret: m[1].trim(), name: m[2], params: m[3], cls: (s.text.match(/\b(?:class|record)\s+(\w+)/) || [])[1] || '' }))
                .filter(m => !/\b(class|record|struct|interface|new|return)\b/.test(m.ret));

              const contact = sources.find(s => /\b(class|record)\s+Contact\b/.test(s.text));
              if (!contact) { console.log('no Contact type'); process.exit(1); }
              const def = contact.text.slice(contact.text.search(/\b(class|record)\s+Contact\b/));
              const problems = [];
              if (/\b(class|record)\s+Contact\b[^{;]*:\s*[^{;]*\b(AggregateRoot|Entity)\b/.test(def)) problems.push('Contact derives from an aggregate or entity base');
              if (/\b(AddDomainEvent|RaiseDomainEvent|DomainEvents)\b/.test(def)) problems.push('Contact raises domain events');
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log('Contact is plain data, no aggregate machinery');
          expected_exit_code: 0
          timeout: 1m
      - type: diff-not-contains
        name: No command or query bus for two use cases
        config:
          pattern: '(?m)^\+.*\b(ICommandBus|IQueryBus|IMediator|MediatR)\b'
      - type: prompt
        config:
          scoring: scale_1_10
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
            - clean-architecture-dotnet
    rubric:
      - Lets the endpoint choose the new contact's id and hand it to the use case, which returns nothing.
      - Returns a read model built for the caller from the fetch, never the stored object itself.
      - Adds no rule about contacts that the request did not state.

  # Deterministic decider. Baseline probes: a public constructor and a raw Guid
  # id 4/4; the "only the owner may cancel" check sat in the use case 2/2.
  - name: '.NET: customers see and cancel only their own orders'
    prompt: |
      Add order consultation and cancellation for customers, with minimal APIs:
      GET /orders/:id returns an order and POST /orders/:id/cancel cancels it. A
      customer may only see and cancel their own orders; an order can only be
      cancelled while it is pending. Authentication is already handled upstream:
      each request carries the authenticated customer id in the X-Customer-Id
      header. Create whatever order model you need and keep orders in memory.
      Production code only, no tests.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      files:
        - src: fixtures/payment/.gitignore
          dest: .gitignore
        - src: fixtures/payment/Directory.Build.props
          dest: Directory.Build.props
        - src: fixtures/payment/Directory.Packages.props
          dest: Directory.Packages.props
        - src: fixtures/payment/PaymentAuthorization.slnx
          dest: PaymentAuthorization.slnx
        - src: fixtures/payment/src/PaymentAuthorization.Domain/PaymentAuthorization.Domain.csproj
          dest: src/PaymentAuthorization.Domain/PaymentAuthorization.Domain.csproj
        - src: fixtures/payment/src/PaymentAuthorization.Domain/Shared/Money.cs
          dest: src/PaymentAuthorization.Domain/Shared/Money.cs
        - src: fixtures/payment/src/PaymentAuthorization.Domain/Authorization/AuthorizationOutcome.cs
          dest: src/PaymentAuthorization.Domain/Authorization/AuthorizationOutcome.cs
        - src: fixtures/payment/src/PaymentAuthorization.Application/PaymentAuthorization.Application.csproj
          dest: src/PaymentAuthorization.Application/PaymentAuthorization.Application.csproj
        - src: fixtures/payment/src/PaymentAuthorization.Application/Authorization/IPaymentGateway.cs
          dest: src/PaymentAuthorization.Application/Authorization/IPaymentGateway.cs
        - src: fixtures/payment/src/PaymentAuthorization.Application/Authorization/IReceiptStore.cs
          dest: src/PaymentAuthorization.Application/Authorization/IReceiptStore.cs
        - src: fixtures/payment/src/PaymentAuthorization.Application/Authorization/AuthorizePayment.cs
          dest: src/PaymentAuthorization.Application/Authorization/AuthorizePayment.cs
        - src: fixtures/payment/src/PaymentAuthorization.Infrastructure/PaymentAuthorization.Infrastructure.csproj
          dest: src/PaymentAuthorization.Infrastructure/PaymentAuthorization.Infrastructure.csproj
        - src: fixtures/payment/src/PaymentAuthorization.Infrastructure/Authorization/HttpPaymentGateway.cs
          dest: src/PaymentAuthorization.Infrastructure/Authorization/HttpPaymentGateway.cs
        - src: fixtures/payment/src/PaymentAuthorization.Infrastructure/Authorization/FileSystemReceiptStore.cs
          dest: src/PaymentAuthorization.Infrastructure/Authorization/FileSystemReceiptStore.cs
        - src: fixtures/payment/tests/PaymentAuthorization.UnitTest/PaymentAuthorization.UnitTest.csproj
          dest: tests/PaymentAuthorization.UnitTest/PaymentAuthorization.UnitTest.csproj
        - src: fixtures/payment/tests/PaymentAuthorization.UnitTest/AuthorizePayment/AuthorizePaymentTests.cs
          dest: tests/PaymentAuthorization.UnitTest/AuthorizePayment/AuthorizePaymentTests.cs
        - src: fixtures/payment/tests/PaymentAuthorization.IntegrationTest/PaymentAuthorization.IntegrationTest.csproj
          dest: tests/PaymentAuthorization.IntegrationTest/PaymentAuthorization.IntegrationTest.csproj
        - src: fixtures/payment/tests/PaymentAuthorization.IntegrationTest/ReceiptStore/FileSystemReceiptStoreTests.cs
          dest: tests/PaymentAuthorization.IntegrationTest/ReceiptStore/FileSystemReceiptStoreTests.cs
      commands:
        - 'dotnet restore PaymentAuthorization.slnx'
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "test: payment authorization walking skeleton"'
    graders:
      - *feature-folders
      - type: run-command
        name: The solution builds
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; dotnet build PaymentAuthorization.slnx >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 4m
      - type: run-command
        name: Every test in the solution is green
        config:
          command: bash
          args:
            - -c
            - 'log="$(mktemp)"; dotnet test PaymentAuthorization.slnx >"$log" 2>&1 && exit 0; tail -n 40 "$log"; exit 1'
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        name: An order is built by a factory and identified by a typed id
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p);
                }
                return acc;
              };
              const all = walk('.').map(f => f.split(path.sep).join('/'));
              const sources = all.filter(f => f.endsWith('.cs') && !f.startsWith('tests/'))
                .map(f => ({ file: f, text: fs.readFileSync(f, 'utf8') }));
              const inLayer = layer => sources.filter(s => new RegExp(('\\.' + (layer) + '/')).test(s.file));
              const methods = s => [...s.text.matchAll(/public\s+(?:async\s+|static\s+|virtual\s+|override\s+)*([\w<>\[\], ?.]+?)\s+(\w+)\s*\(([^)]*)\)/g)]
                .map(m => ({ ret: m[1].trim(), name: m[2], params: m[3], cls: (s.text.match(/\b(?:class|record)\s+(\w+)/) || [])[1] || '' }))
                .filter(m => !/\b(class|record|struct|interface|new|return)\b/.test(m.ret));

              const order = inLayer('Domain').find(s => /\bclass\s+Order\b/.test(s.text));
              if (!order) { console.log('no Order class in Domain'); process.exit(1); }
              const problems = [];
              if (!/private\s+Order\s*\(/.test(order.text)) problems.push('Order has no private constructor');
              if (!/static\s+Order\s+\w+\s*\(/.test(order.text)) problems.push('Order has no static factory');
              if (/public\s+Order\s*\(/.test(order.text) || /class\s+Order\s*\(/.test(order.text)) problems.push('Order has a public constructor');
              if (!inLayer('Domain').some(s => /\brecord\s+(struct\s+)?OrderId\b|\b(class|struct)\s+OrderId\b/.test(s.text))) problems.push('no OrderId type in Domain');
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log('Order is built by a factory over a private constructor and identified by OrderId');
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: Who may cancel is an aggregate rule, who may read is a use-case check
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path');
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'node_modules'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
