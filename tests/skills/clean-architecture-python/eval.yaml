      - type: run-command
        name: Creating a contact returns nothing and receives the new id
        config:
          command: python3
          args:
            - -c
            - |
              import ast, pathlib, re, sys
              SKIP = {'.git', '.venv', 'venv', 'env', 'node_modules', '__pycache__', 'build', 'dist', '.tox', 'site-packages'}
              CORE = ('domain', 'application', 'infrastructure')
              def is_test(p):
                  return any(part in ('tests', 'test') or part.startswith('test_') or part == 'conftest.py' for part in p.parts)
              def modules():
                  out = []
                  for p in sorted(pathlib.Path('.').rglob('*.py')):
                      if SKIP & set(p.parts) or is_test(p):
                          continue
                      try:
                          out.append((p, ast.parse(p.read_text(encoding='utf-8')), p.read_text(encoding='utf-8')))
                      except (SyntaxError, UnicodeDecodeError):
                          pass
                  return out
              def layer_of(parts):
                  for part in parts:
                      name = part[:-3] if part.endswith('.py') else part
                      if name in CORE:
                          return name
                  return None
              def in_layer(mods, name):
                  return [m for m in mods if layer_of(m[0].parts) == name]
              def classes(tree):
                  return [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
              def base_names(cls):
                  names = [ast.unparse(b).split('.')[-1].split('[')[0] for b in cls.bases]
                  names += [ast.unparse(k.value).split('.')[-1] for k in cls.keywords if k.arg == 'metaclass']
                  return names
              def is_abstract(cls):
                  if {'Protocol', 'ABC', 'ABCMeta'} & set(base_names(cls)):
                      return True
                  return any(isinstance(d, (ast.Name, ast.Attribute)) and ast.unparse(d).endswith('abstractmethod')
                             for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)) for d in f.decorator_list)
              def methods(cls):
                  return [f for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef))]
              def params(fn):
                  a = fn.args
                  return [x for x in a.posonlyargs + a.args + a.kwonlyargs if x.arg not in ('self', 'cls')]
              mods = modules()
              fields = {}
              for _, tree, _ in mods:
                  for c in classes(tree):
                      names = [s.target.id for s in c.body if isinstance(s, ast.AnnAssign) and isinstance(s.target, ast.Name)]
                      init = next((f for f in methods(c) if f.name == '__init__'), None)
                      names += [a.arg for a in params(init)] if init else []
                      fields[c.name] = names
              ID = re.compile(r'^(id|\w+_id)$')
              def carries_id(fn):
                  for a in params(fn):
                      ann = ast.unparse(a.annotation) if a.annotation else ''
                      if ID.match(a.arg) or re.search(r'Id\b', ann) or any(ID.match(f) for t in re.findall(r'\w+', ann) for f in fields.get(t, [])):
                          return True
                  return False
              def returns_value(fn):
                  if fn.returns is not None:
                      return ast.unparse(fn.returns) not in ('None', "'None'")
                  return any(isinstance(r, ast.Return) and r.value is not None and not (isinstance(r.value, ast.Constant) and r.value.value is None) for r in ast.walk(fn))
              creates = []
              for _, tree, _ in in_layer(mods, 'application'):
                  for c in classes(tree):
                      if is_abstract(c):
                          continue
                      for f in methods(c):
                          if re.match(r'(create|add|register)', f.name) or (f.name in ('execute', 'handle', '__call__', 'run', 'invoke') and re.match(r'(Create|Add|Register)', c.name)):
                              creates.append((c.name, f))
              if not creates:
                  print('no create entry point in application'); sys.exit(1)
              bad = [f'{c}.{f.name}({", ".join(a.arg for a in params(f))}) -> {ast.unparse(f.returns) if f.returns else "?"}' for c, f in creates if returns_value(f) or not carries_id(f)]
              if bad:
                  print('\n'.join(bad)); sys.exit(1)
              print('create returns nothing and receives the new id')
          expected_exit_code: 0
          timeout: 1m
