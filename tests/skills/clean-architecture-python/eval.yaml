              def is_test(p):
                  return any(part in ('tests', 'test') or part.startswith('test_') or part == 'conftest.py' for part in p.parts)
              def modules():
                  out = []
                  for p in sorted(pathlib.Path('.').rglob('*.py')):
                      if SKIP & set(p.parts) or is_test(p):
                          continue
                      try:
                          out.append((p, ast.parse(p.read_text(encoding='utf-8')), p.read_text(encoding='utf-8')))
                      except (SyntaxError, UnicodeDecodeError):
                          pass
                  return out
              def layer_of(parts):
                  for part in parts:
                      name = part[:-3] if part.endswith('.py') else part
                      if name in CORE:
                          return name
                  return None
              def in_layer(mods, name):
                  return [m for m in mods if layer_of(m[0].parts) == name]
              def classes(tree):
                  return [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
              def base_names(cls):
                  names = [ast.unparse(b).split('.')[-1].split('[')[0] for b in cls.bases]
                  names += [ast.unparse(k.value).split('.')[-1] for k in cls.keywords if k.arg == 'metaclass']
                  return names
              def is_abstract(cls):
                  if {'Protocol', 'ABC', 'ABCMeta'} & set(base_names(cls)):
                      return True
                  return any(isinstance(d, (ast.Name, ast.Attribute)) and ast.unparse(d).endswith('abstractmethod')
                             for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)) for d in f.decorator_list)
              def methods(cls):
                  return [f for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef))]
              def params(fn):
                  a = fn.args
                  return [x for x in a.posonlyargs + a.args + a.kwonlyargs if x.arg not in ('self', 'cls')]
              mods = modules()
              order = next((c for _, tree, _ in in_layer(mods, 'domain') for c in classes(tree) if c.name == 'Order'), None)
              cancel = next((f for f in methods(order) if f.name == 'cancel'), None) if order else None
              if cancel is None or not params(cancel):
                  print('Order.cancel takes no caller: who may cancel is not an aggregate rule'); sys.exit(1)
              OWN = r'is_owned_by|owned_by|belongs_to|owner|customer_id\s*(==|!=)|(==|!=)\s*\w*\.?customer_id'
              readers = [ast.unparse(c) for _, tree, _ in in_layer(mods, 'application') for c in classes(tree)
                         if not is_abstract(c) and re.match(r'(Get|Find|View|Consult|Load|Read|Fetch)', c.name)]
              readers += [ast.unparse(f) for _, tree, _ in in_layer(mods, 'application') for c in classes(tree) if not is_abstract(c)
                          for f in methods(c) if re.match(r'(get|find|view|consult|load|read|fetch)', f.name)]
              if not any(re.search(OWN, r) for r in readers):
                  print('the read use case does not check who may see the order'); sys.exit(1)
              def routes(tree):
                  return any(isinstance(d, ast.Call) and isinstance(d.func, ast.Attribute) and d.func.attr in ('get', 'post', 'put', 'patch', 'delete')
                             for f in ast.walk(tree) if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)) for d in f.decorator_list)
              leak = [str(p) for p, tree, text in mods if routes(tree) and re.search(r'is_owned_by|owned_by|\.customer_id\s*(==|!=)|(==|!=)\s*\w+\.customer_id|owner_id\s*(==|!=)', text)]
              if leak:
                  print('endpoint checks ownership itself: ' + ', '.join(leak)); sys.exit(1)
              print('read restriction in the use case, change restriction in the aggregate')
          expected_exit_code: 0
          timeout: 1m
      - *judge
      - type: skill-invocation
        name: The skill under test is loaded
        config:
          required:
