              def params(fn):
                  a = fn.args
                  return [x for x in a.posonlyargs + a.args + a.kwonlyargs if x.arg not in ('self', 'cls')]
              mods = modules()
              def defined(layer):
                  names = set()
                  for _, tree, _ in in_layer(mods, layer):
                      names |= {c.name for c in classes(tree)}
                      names |= {t.id for n in ast.walk(tree) if isinstance(n, ast.Assign) for t in n.targets if isinstance(t, ast.Name)}
                  return names
              domain_types, app_types = defined('domain'), defined('application')
              queries = []
              for _, tree, _ in in_layer(mods, 'application'):
