name: clean-architecture-python
description: |
  Verifies that a Python / FastAPI service is laid out as Clean Architecture and
  stays that way: one package per layer with imports pointing inward, checked by
  an import-linter contract; use cases as plain classes with no interface in
  front of them and no port or adapter vocabulary; a framework-free core;
  commands that return nothing, queries that return a read model, aggregates
  built by a factory, and access rules split between use case and aggregate.
  Graders are Python AST checks, so they run wherever python3 does. The
  existing project carries its own import-linter contract, checked by its test
  suite. Probes without the skill (Sonnet, 2 runs per case) extended the layered
  project correctly for refunds, but on an empty repository wrote flat modules
  (service.py, models.py, once ports.py / adapters.py) with no import contract;
  their contacts use case returned the id or the entity, and their orders had no
  factory, no typed id and a cancel that ignored the caller. The greenfield
  stimuli and the three existing-project deciders carry the verdict; refunds is
  a regression guard.
  Feature folders: the fixture is laid out by feature inside each layer
  (authorization, shared) and its import-linter independence contract forbids
  one application feature importing another. Probes wrote greenfield modules at
  the layer root 0/4 without the skill and 0/4 with its former "modules by
  feature" line, 4/4 once it asked for a sub-package per feature.
type: capability
defaults:
  timeout: 4m
  runs: 4
  # Pinned to Sonnet: the probes that sized these stimuli ran on Sonnet, and the
  # verdict must stay comparable if DEFAULT_MODEL moves. MODEL in the environment
  # still overrides it for the compare-models matrix.
  model: claude-sonnet-5.5
scoring:
  threshold: 1

stimuli:
  # Deterministic decider. Empty repository: nothing to imitate, so the layout is
  # the agent's own call. The prompt names no architecture style. The install
  # sentinel keeps a project that does not install or import from scoring as a
  # good layout.
  - name: 'Python greenfield: a library loan service with persistence'
    prompt: |
      Start a new Python 3.12 service with FastAPI, packaged with a pyproject.toml.
      Its first feature: a library member borrows a book through POST /loans
      (body: member_id, isbn). A member may hold at most 3 loans at a time; a book
      already on loan cannot be borrowed. Loans are stored in PostgreSQL through
      SQLAlchemy 2.

      Write the production code for this first feature and the build files. No
      tests for now.
    constraints:
      max_duration: 14m
      max_agent_duration: 10m
    environment:
      commands:
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git commit --quiet --allow-empty -m "chore: empty repository"'
    graders:
      - &feature-folders
        type: run-command
        name: Each new layer file sits in a feature folder; no application feature imports another
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('fs'), path = require('path'), { execSync } = require('child_process');
              const sh = c => { try { return execSync(c, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }); } catch { return null; } };
              const walk = (d, acc = []) => {
                for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                  if (['.git', 'bin', 'obj', 'target', 'node_modules', '.venv', '__pycache__'].includes(e.name)) continue;
                  const p = path.join(d, e.name);
                  e.isDirectory() ? walk(p, acc) : acc.push(p.split(path.sep).join('/'));
                }
                return acc;
              };
              // Files the agent added: new tracked files since HEAD plus untracked ones. No HEAD: everything.
              const added = sh('git rev-parse --verify -q HEAD') === null
                ? walk('.').map(f => f.replace(/^\.\//, ''))
                : [...(sh('git diff --name-only --diff-filter=AR HEAD') || '').split('\n'), ...(sh('git ls-files --others --exclude-standard') || '').split('\n')].filter(Boolean);
              const TECHNICAL = /^(ports?|adapters?|services?|repositor(y|ies)|persistence|models?|entit(y|ies)|dtos?|use_?cases?|commands?|quer(y|ies)|handlers?|controllers?|endpoints?|routers?|interfaces?|abstractions?|contracts?|gateways?|clients?|http|web|rest|api|jpa|db|database|events?|exceptions?|errors?|value_?objects?|aggregates?|mappers?|impl|inbound|outbound|in|out|core|internal)$/i;
              const SHARED = /^(shared|common)$/i;
              // Map a source file to { layer, rest } where rest is its path below the layer root.
              const locate = f => {
                let m;
                if (f.endsWith('.cs') && (m = f.match(/(?:^|\/)[\w.]+\.(Domain|Application|Infrastructure)\/(.+)$/))) return { layer: m[1].toLowerCase(), rest: m[2], lang: 'cs' };
                if (f.endsWith('.java') && f.includes('/src/main/java/') && (m = f.match(/\/(domain|application|infrastructure)\/((?:(?!\/(?:domain|application|infrastructure)\/).)+)$/))) return { layer: m[1], rest: m[2], lang: 'java' };
                if (f.endsWith('.py') && !/(^|\/)tests?\//.test(f) && (m = f.match(/(?:^|\/)(domain|application|infrastructure)\/(.+)$/))) return { layer: m[1], rest: m[2], lang: 'py' };
                return null;
              };
              const AT_ROOT_OK = /^(__init__\.py|DependencyInjection\.cs|\w*ServiceCollectionExtensions\.cs|\w*DbContext\.cs|GlobalUsings\.cs|AssemblyInfo\.cs|I\w*Marker\.cs|package-info\.java)$/;
              const featureOf = rest => {
                const parts = rest.split('/');
                if (/^features$/i.test(parts[0])) parts.shift();
                return parts.length > 1 ? parts[0] : null;
              };
              const problems = [];
              const located = added.map(f => ({ f, at: locate(f) })).filter(x => x.at);
              if (!located.length) { console.log('no new source file in domain, application or infrastructure'); process.exit(1); }
              for (const { f, at } of located) {
                const feature = featureOf(at.rest);
                if (!feature) { if (!AT_ROOT_OK.test(path.basename(f))) problems.push(f + ': at the root of the ' + at.layer + ' layer, not in a feature folder'); continue; }
                if (TECHNICAL.test(feature)) problems.push(f + ': in a technical folder (' + feature + '), not a feature folder');
                // An application feature never reaches into another application feature; shared/ is for both.
                if (at.layer !== 'application' || SHARED.test(feature)) continue;
                const text = fs.readFileSync(f, 'utf8');
                const refs = at.lang === 'cs' ? [...text.matchAll(/\.Application\.(?:Features\.)?(\w+)\b/g)].map(m => m[1])
                  : at.lang === 'java' ? [...text.matchAll(/^\s*import\s+(?:static\s+)?[\w.]*\.application\.(\w+)\./gm)].map(m => m[1])
                  : [...text.matchAll(/^\s*(?:from|import)\s+[\w.]*\.application\.(\w+)/gm), ...text.matchAll(/^\s*from\s+\.\.(\w+)/gm)].map(m => m[1]);
                const root = f.slice(0, f.length - at.rest.length);
                const siblings = new Set(fs.readdirSync(root, { withFileTypes: true }).filter(e => e.isDirectory()).map(e => e.name.toLowerCase()));
                if (fs.existsSync(root + 'Features')) for (const e of fs.readdirSync(root + 'Features', { withFileTypes: true })) if (e.isDirectory()) siblings.add(e.name.toLowerCase());
                for (const other of new Set(refs)) {
                  if (!siblings.has(other.toLowerCase()) || other.toLowerCase() === feature.toLowerCase() || SHARED.test(other)) continue;
                  problems.push(f + ': application feature ' + feature + ' imports application feature ' + other);
                }
              }
              if (problems.length) { console.log(problems.join('\n')); process.exit(1); }
              console.log(located.length + ' new layer files, each in a feature folder; no application feature imports another');
          expected_exit_code: 0
          timeout: 1m
      - &install-sentinel
        type: run-command
        name: 'Sentinel: the generated project installs and imports'
        config:
          command: bash
          args:
            - -c
            - |
              log="$(mktemp)"; venv="$(mktemp -d)"
              python3 -m venv "$venv" >"$log" 2>&1 || { tail -n 20 "$log"; exit 1; }
              if [ -f pyproject.toml ]; then "$venv/bin/pip" install -q . >>"$log" 2>&1 || { tail -n 40 "$log"; exit 1; }
              elif [ -f requirements.txt ]; then "$venv/bin/pip" install -q -r requirements.txt >>"$log" 2>&1 || { tail -n 40 "$log"; exit 1; }
              else echo 'no pyproject.toml or requirements.txt'; exit 1; fi
              PYTHONPATH="src:." "$venv/bin/python" - <<'PY'
              import importlib, pathlib, sys
              failures = []
              for p in sorted(pathlib.Path('.').rglob('*.py')):
                  parts = p.parts
                  if set(parts) & {'.git', '.venv', 'venv', 'build', 'dist', 'alembic', 'migrations'} or p.name in ('setup.py', 'noxfile.py'):
                      continue
                  if any(x in ('tests', 'test') or x.startswith('test_') or x == 'conftest.py' for x in parts):
                      continue
                  rel = parts[1:] if parts[0] == 'src' else parts
                  name = '.'.join(rel)[:-3].removesuffix('.__init__')
                  try:
                      importlib.import_module(name)
                  except Exception as e:
                      if type(e).__name__ in ('OperationalError', 'InterfaceError', 'ConnectionRefusedError'):
                          continue
                      failures.append(f'{name}: {type(e).__name__}: {e}')
              if failures:
                  print('\n'.join(failures[:20])); sys.exit(1)
              print('the project installs and every module imports')
              PY
          expected_exit_code: 0
          timeout: 6m
      - &layers
        type: run-command
        name: Each layer is a package of its own and imports point inward only
        config:
          command: python3
          args:
            - -c
            - |
              import ast, pathlib, re, sys
              SKIP = {'.git', '.venv', 'venv', 'env', 'node_modules', '__pycache__', 'build', 'dist', '.tox', 'site-packages'}
              CORE = ('domain', 'application', 'infrastructure')
              def is_test(p):
                  return any(part in ('tests', 'test') or part.startswith('test_') or part == 'conftest.py' for part in p.parts)
              def modules():
                  out = []
                  for p in sorted(pathlib.Path('.').rglob('*.py')):
                      if SKIP & set(p.parts) or is_test(p):
                          continue
                      try:
                          out.append((p, ast.parse(p.read_text(encoding='utf-8')), p.read_text(encoding='utf-8')))
                      except (SyntaxError, UnicodeDecodeError):
                          pass
                  return out
              def layer_of(parts):
                  for part in parts:
                      name = part[:-3] if part.endswith('.py') else part
                      if name in CORE:
                          return name
                  return None
              def in_layer(mods, name):
                  return [m for m in mods if layer_of(m[0].parts) == name]
              def classes(tree):
                  return [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
              def base_names(cls):
                  names = [ast.unparse(b).split('.')[-1].split('[')[0] for b in cls.bases]
                  names += [ast.unparse(k.value).split('.')[-1] for k in cls.keywords if k.arg == 'metaclass']
                  return names
              def is_abstract(cls):
                  if {'Protocol', 'ABC', 'ABCMeta'} & set(base_names(cls)):
                      return True
                  return any(isinstance(d, (ast.Name, ast.Attribute)) and ast.unparse(d).endswith('abstractmethod')
                             for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)) for d in f.decorator_list)
              def methods(cls):
                  return [f for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef))]
              def params(fn):
                  a = fn.args
                  return [x for x in a.posonlyargs + a.args + a.kwonlyargs if x.arg not in ('self', 'cls')]
              mods = modules()
              roots = {(m[0].parts[1] if m[0].parts[0] == 'src' and len(m[0].parts) > 1 else m[0].parts[0]).removesuffix('.py') for m in mods}
              def dotted(p):
                  parts = list(p.parts[1:] if p.parts[0] == 'src' else p.parts)
                  parts[-1] = parts[-1].removesuffix('.py')
                  return parts[:-1] if parts[-1] == '__init__' else parts
              def imports(p, tree):
                  here = dotted(p)
                  pkg = here if p.name == '__init__.py' else here[:-1]
                  for n in ast.walk(tree):
                      if isinstance(n, ast.Import):
                          for a in n.names:
                              yield a.name.split('.')
                      elif isinstance(n, ast.ImportFrom):
                          base = (pkg[:len(pkg) - n.level + 1] if n.level else []) + (n.module.split('.') if n.module else [])
                          if n.module:
                              yield base
                          else:
                              for a in n.names:
                                  yield base + [a.name]
              def routes(tree):
                  for f in ast.walk(tree):
                      if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          for d in f.decorator_list:
                              if isinstance(d, ast.Call) and isinstance(d.func, ast.Attribute) and d.func.attr in ('get', 'post', 'put', 'patch', 'delete', 'api_route'):
                                  return True
                  return False
              domain = in_layer(mods, 'domain')
              if not domain:
                  print('no domain package'); sys.exit(1)
              context = domain[0][0].parts[:domain[0][0].parts.index(next(x for x in domain[0][0].parts if x.removesuffix('.py') == 'domain'))]
              entry = set()
              for p, tree, _ in mods:
                  if routes(tree):
                      rest = p.parts[len(context):] if p.parts[:len(context)] == context else ()
                      if len(rest) < 2:
                          print(f'{p}: HTTP endpoints have no package of their own'); sys.exit(1)
                      entry.add(rest[0])
              if not entry:
                  print('no HTTP endpoint found'); sys.exit(1)
              if entry & set(CORE):
                  print('HTTP endpoints sit in ' + ', '.join(sorted(entry & set(CORE)))); sys.exit(1)
              rank = {'domain': 0, 'application': 1, 'infrastructure': 2, **{e: 3 for e in entry}}
              missing = [l for l in ('domain', 'application', 'infrastructure') if not in_layer(mods, l)]
              if missing:
                  print('no package of its own for: ' + ', '.join(missing)); sys.exit(1)
              def layer(segments):
                  return next((s for s in segments if s in rank), None)
              wrong = []
              for p, tree, _ in mods:
                  own = layer([x.removesuffix('.py') for x in p.parts[len(context):]]) if p.parts[:len(context)] == context else None
                  if own is None:
                      continue
                  for target in imports(p, tree):
                      if target and target[0] in roots:
                          other = layer(target)
                          if other is not None and rank[other] > rank[own]:
                              wrong.append(f'{p} ({own}) imports {".".join(target)} ({other})')
              if wrong:
                  print('\n'.join(sorted(set(wrong))[:20])); sys.exit(1)
              print('one package per layer, imports point inward only')
          expected_exit_code: 0
          timeout: 1m
      - &import-contract
        type: run-command
        name: The build rejects an import that points outward
        config:
          command: python3
          args:
            - -c
            - |
              import ast, pathlib, re, sys
              SKIP = {'.git', '.venv', 'venv', 'env', 'node_modules', '__pycache__', 'build', 'dist', '.tox', 'site-packages'}
              CORE = ('domain', 'application', 'infrastructure')
              def is_test(p):
                  return any(part in ('tests', 'test') or part.startswith('test_') or part == 'conftest.py' for part in p.parts)
              def modules():
                  out = []
                  for p in sorted(pathlib.Path('.').rglob('*.py')):
                      if SKIP & set(p.parts) or is_test(p):
                          continue
                      try:
                          out.append((p, ast.parse(p.read_text(encoding='utf-8')), p.read_text(encoding='utf-8')))
                      except (SyntaxError, UnicodeDecodeError):
                          pass
                  return out
              def layer_of(parts):
                  for part in parts:
                      name = part[:-3] if part.endswith('.py') else part
                      if name in CORE:
                          return name
                  return None
              def in_layer(mods, name):
                  return [m for m in mods if layer_of(m[0].parts) == name]
              def classes(tree):
                  return [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
              def base_names(cls):
                  names = [ast.unparse(b).split('.')[-1].split('[')[0] for b in cls.bases]
                  names += [ast.unparse(k.value).split('.')[-1] for k in cls.keywords if k.arg == 'metaclass']
                  return names
              def is_abstract(cls):
                  if {'Protocol', 'ABC', 'ABCMeta'} & set(base_names(cls)):
                      return True
                  return any(isinstance(d, (ast.Name, ast.Attribute)) and ast.unparse(d).endswith('abstractmethod')
                             for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)) for d in f.decorator_list)
              def methods(cls):
                  return [f for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef))]
              def params(fn):
                  a = fn.args
                  return [x for x in a.posonlyargs + a.args + a.kwonlyargs if x.arg not in ('self', 'cls')]
              import tomllib, configparser
              contracts = []
              if pathlib.Path('pyproject.toml').exists():
                  data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
                  contracts += data.get('tool', {}).get('importlinter', {}).get('contracts', [])
              for ini in ('.importlinter', 'setup.cfg', 'tox.ini'):
                  if pathlib.Path(ini).exists():
                      cp = configparser.ConfigParser()
                      cp.read(ini, encoding='utf-8')
                      for s in cp.sections():
                          if s.startswith('importlinter:contract'):
                              c = dict(cp[s])
                              c['layers'] = [x.strip() for x in c.get('layers', '').splitlines() if x.strip()]
                              contracts.append(c)
              def last(name):
                  return name.replace('(', '').replace(')', '').strip().split('.')[-1]
              for c in contracts:
                  if c.get('type') != 'layers':
                      continue
                  order = [last(x) for x in c.get('layers', [])]
                  core = [x for x in order if x in ('domain', 'application', 'infrastructure')]
                  if core == ['infrastructure', 'application', 'domain'] and order.index('infrastructure') > 0:
                      print('import-linter layers contract: ' + ' > '.join(order)); sys.exit(0)
              print('no import-linter layers contract putting an entry layer above infrastructure > application > domain')
              sys.exit(1)
          expected_exit_code: 0
          timeout: 1m
      - &no-use-case-interface
        type: run-command
        name: A use case is not hidden behind an interface implemented in application
        config:
          command: python3
          args:
            - -c
            - |
              import ast, pathlib, re, sys
              SKIP = {'.git', '.venv', 'venv', 'env', 'node_modules', '__pycache__', 'build', 'dist', '.tox', 'site-packages'}
              CORE = ('domain', 'application', 'infrastructure')
              def is_test(p):
                  return any(part in ('tests', 'test') or part.startswith('test_') or part == 'conftest.py' for part in p.parts)
              def modules():
                  out = []
                  for p in sorted(pathlib.Path('.').rglob('*.py')):
                      if SKIP & set(p.parts) or is_test(p):
                          continue
                      try:
                          out.append((p, ast.parse(p.read_text(encoding='utf-8')), p.read_text(encoding='utf-8')))
                      except (SyntaxError, UnicodeDecodeError):
                          pass
                  return out
              def layer_of(parts):
                  for part in parts:
                      name = part[:-3] if part.endswith('.py') else part
                      if name in CORE:
                          return name
                  return None
              def in_layer(mods, name):
                  return [m for m in mods if layer_of(m[0].parts) == name]
              def classes(tree):
                  return [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
              def base_names(cls):
                  names = [ast.unparse(b).split('.')[-1].split('[')[0] for b in cls.bases]
                  names += [ast.unparse(k.value).split('.')[-1] for k in cls.keywords if k.arg == 'metaclass']
                  return names
              def is_abstract(cls):
                  if {'Protocol', 'ABC', 'ABCMeta'} & set(base_names(cls)):
                      return True
                  return any(isinstance(d, (ast.Name, ast.Attribute)) and ast.unparse(d).endswith('abstractmethod')
                             for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)) for d in f.decorator_list)
              def methods(cls):
                  return [f for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef))]
              def params(fn):
                  a = fn.args
                  return [x for x in a.posonlyargs + a.args + a.kwonlyargs if x.arg not in ('self', 'cls')]
              app = in_layer(modules(), 'application')
              if not app:
                  print('no application package'); sys.exit(1)
              cls = [c for _, tree, _ in app for c in classes(tree)]
              abstract = {c.name for c in cls if is_abstract(c)}
              bad = [f'{c.name} implements {b} inside the application layer' for c in cls if not is_abstract(c) for b in base_names(c) if b in abstract]
              bad += [f'{n} is an interface in front of a use case' for n in abstract if re.search(r'(UseCase|Service|Interactor|Handler|InputBoundary)$', n)]
              bad += [f'{c.name} is an implementation class' for c in cls if re.search(r'Impl(ementation)?$', c.name)]
              if bad:
                  print('\n'.join(sorted(set(bad)))); sys.exit(1)
              print('no application interface is implemented inside application')
          expected_exit_code: 0
          timeout: 1m
      - &no-port-vocabulary
        type: run-command
        name: No port or adapter package, and no port vocabulary in the code
        config:
          command: python3
          args:
            - -c
            - |
              import ast, pathlib, re, sys
              SKIP = {'.git', '.venv', 'venv', 'env', 'node_modules', '__pycache__', 'build', 'dist', '.tox', 'site-packages'}
              CORE = ('domain', 'application', 'infrastructure')
              def is_test(p):
                  return any(part in ('tests', 'test') or part.startswith('test_') or part == 'conftest.py' for part in p.parts)
              def modules():
                  out = []
                  for p in sorted(pathlib.Path('.').rglob('*.py')):
                      if SKIP & set(p.parts) or is_test(p):
                          continue
                      try:
                          out.append((p, ast.parse(p.read_text(encoding='utf-8')), p.read_text(encoding='utf-8')))
                      except (SyntaxError, UnicodeDecodeError):
                          pass
                  return out
              def layer_of(parts):
                  for part in parts:
                      name = part[:-3] if part.endswith('.py') else part
                      if name in CORE:
                          return name
                  return None
              def in_layer(mods, name):
                  return [m for m in mods if layer_of(m[0].parts) == name]
              def classes(tree):
                  return [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]
              def base_names(cls):
                  names = [ast.unparse(b).split('.')[-1].split('[')[0] for b in cls.bases]
                  names += [ast.unparse(k.value).split('.')[-1] for k in cls.keywords if k.arg == 'metaclass']
                  return names
              def is_abstract(cls):
                  if {'Protocol', 'ABC', 'ABCMeta'} & set(base_names(cls)):
                      return True
                  return any(isinstance(d, (ast.Name, ast.Attribute)) and ast.unparse(d).endswith('abstractmethod')
                             for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef)) for d in f.decorator_list)
              def methods(cls):
                  return [f for f in cls.body if isinstance(f, (ast.FunctionDef, ast.AsyncFunctionDef))]
              def params(fn):
                  a = fn.args
                  return [x for x in a.posonlyargs + a.args + a.kwonlyargs if x.arg not in ('self', 'cls')]
              hits = []
              for p in sorted(pathlib.Path('.').rglob('*')):
                  if SKIP & set(p.parts):
                      continue
                  stem = p.name.removesuffix('.py').lower()
                  if (p.is_dir() or p.suffix == '.py') and (stem in ('port', 'ports', 'adapter', 'adapters') or re.search(r'_(port|ports|adapter|adapters)$', stem)):
                      hits.append(f'{p}: port/adapter module')
                  if p.suffix == '.py':
                      text = p.read_text(encoding='utf-8', errors='ignore')
                      for i, line in enumerate(text.splitlines(), 1):
                          if re.search(r'\bclass\s+(\w*[a-z])?Port\b', line) or re.search(r'\b(input|output|inbound|outbound|driving|driven|primary|secondary)\s+ports?\b|\bports?\s+(and|&)\s+adapters?\b|hexagonal', line, re.I):
                              hits.append(f'{p}:{i}: {line.strip()[:100]}')
              if hits:
                  print('\n'.join(hits[:20])); sys.exit(1)
              print('no port or adapter vocabulary')
          expected_exit_code: 0
          timeout: 1m
      - &framework-free-core
        type: run-command
        name: Domain and application import no framework
        config:
          command: python3
