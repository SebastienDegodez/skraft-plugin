name: test-design-mandates
description: |
  Verifies 5 mandatory test design rules guide pre-code coverage planning,
  ensuring boundaries, layer assignment, domain test extraction gates work correctly.
type: capability
defaults:
  timeout: 4m
  runs: 2
scoring:
  threshold: 1

stimuli:
  - name: Apply Mandate 1 — Layer Boundary Enforcement
    turns:
      - |
        Product approved: "submitting a valid refund stores it as Pending and returns its id".
        I need to write an acceptance test. What boundary do I enter through, and
        where should I observe the outcome?
      - |
        Correct. Now explain why I should NOT instantiate domain classes directly in this test.
    graders:
      - type: prompt
    rubric:
      - Names entry boundary as RefundHandler use case / interactor (or equivalent application entry point)
      - Identifies output observation via repository contract (IRefundRepository)
      - Distinguishes from direct domain object instantiation
      - Explains that direct domain instantiation creates Tested But Unwired (TBU) defects
      - Identifies that entry through the use case proves wiring, not just the isolated class
      - Connects boundary enforcement to detecting production failures (untested composition)

  - name: Apply Mandate 4 — Domain Test Extraction Gate (a)
    turns:
      - |
        My acceptance test covers a discount calculation: prices < 100 get 10%, >= 100 get 15%.
        Both branches (< 100 and >= 100) are reached by two acceptance scenarios.
        Should I write a dedicated domain test for this rule?
      - |
        Why or why not? Apply the two extraction gates from Mandate 4.
    graders:
      - type: prompt
    rubric:
      - "Identifies branch unreachability gate (a): both branches < 100 AND >= 100 are reachable via AC → gate (a) CLOSED"
      - "Identifies combinatorial economy gate (b): only 2 cases, well under 10–15 scenario threshold → gate (b) CLOSED"
      - "Concludes: both gates closed → no domain test extraction authorized"
      - 'Records decision: "M4 negative — saturated by AC"'

  - name: Apply Mandate 2 — Business Language Abstraction (3 layers)
    turns:
      - |
        I wrote a Gherkin step: "Given the EligibilityApplicationService is instantiated".
        Is this correct? If not, rewrite it using the 3-layer abstraction from Mandate 2.
      - |
        Now show how the step method should implement that Gherkin line without leaking technical vocabulary upward.
    graders:
      - type: prompt
    rubric:
      - Rejects "EligibilityApplicationService is instantiated" as a technical detail
      - Rewrites using business term (e.g. "Given a driver with a clean record")
      - Explains Gherkin layer must express pure business, not technical wiring
      - Step method calls eligibilityUseCase.Handle(command) with builder factory
      - Does not hardcode primitives or DTOs directly in the step
      - Uses builder pattern (e.g. DriverBuilder.withCleanRecord) to separate concerns
      - Maintains strict abstraction boundary between Gherkin (pure business) and Step (technical bridge)

  - name: Apply Mandate 3 — User Journey Completeness
    turns:
      - |
        I wrote an acceptance test with Given (setup) and When (action), but no Then (outcome).
        Is this test complete? If not, what's missing?
      - |
        Now give an example of a complete three-part journey for a refund request.
    graders:
      - type: prompt
    rubric:
      - Identifies test is incomplete without observable outcome
      - Explains Then must assert on something a user can observe (not internal state)
      - Distinguishes observable outcome (persisted refund returned with id) from internal state (private field value)
      - "Given: refund request in valid state (submitted form, valid amounts)"
      - "When: submitting refund through the API/use case"
      - "Then: refund appears as Pending and id is returned (observable business outcome)"

  - name: Build and validate Coverage Matrix
    turns:
      - |
        Design test coverage for a three-tier loyalty discount:
        - Gold: 95% payable
        - Silver: 97% payable
        - Invalid tier: rejection
        
        Include two price boundaries: < 100 and >= 100 for each tier.
        Create a coverage matrix with scenario, use case boundary, layer, and extraction reason.
        Apply all 5 mandates.
      - |
        Explain which rows need domain tests and why (or why not).
    graders:
      - type: prompt
    rubric:
      - Creates separate scenario rows for Gold, Silver, and Invalid tier (distinct business outcomes)
      - Consolidates price boundaries into parametrized acceptance tests (not separate scenarios)
      - Names use case entry boundary (CalculatePayableTotal or equivalent)
      - Assigns Application layer for each tier scenario
      - Provides extraction reason ("—" if no domain test needed, or "branch_unreachable_via_AC" / "combinatorial_economy")
      - "Total: 3 primary scenarios (one per tier)"
      - Each tier is covered by AC, both branches (< 100 and >= 100) are reachable → no domain test (Gate a/b closed)
      - Explains that 3 acceptance scenarios + parametrization covers the complete rule
      - "May mention: if combinatorial size exploded (e.g., 15 tiers with many price boundaries), domain test would emerge as economical"
