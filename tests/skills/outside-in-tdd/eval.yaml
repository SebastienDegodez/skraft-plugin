name: outside-in-tdd
description: Evaluates whether a feature is driven from an observable business behaviour at the system boundary, with the internal design emerging from failing tests.
type: capability
defaults:
  timeout: 3m
  runs: 3
stimuli:
  - name: Drive a business rule from the outside
    prompt: |
      We have an existing .NET checkout service and xUnit test project. The approved
      business scenario is: "Given an existing Gold customer's order, when checkout
      calculates the payable total, then the returned total includes a 5% loyalty
      discount." The checkout application boundary is the only entry point named by
      the product team; internal types and interfaces are not decided yet.

      Prepare the first implementation slice. Show the first meaningful test to write,
      identify what observable result it checks, and explain what should happen next
      when that test fails. Stop before writing production code or tests for other
      loyalty tiers.
    graders:
      - type: prompt
    rubric:
      - Defines one first slice around the approved business scenario instead of expanding into a tier matrix or unrelated error case.
      - Enters through the checkout application boundary and asserts the payable total in business terms.
      - Leaves internal classes, policies, and interfaces undecided until the test exposes what is needed.
      - Describes a real failing behavioral or compilation test and the next implementation step, not a placeholder assertion or a completed production design.

  - name: Do not test the internals first
    prompt: |
      We need one new checkout behavior: an order with no lines is rejected with a
      business error. I want to start by writing unit tests for the private helper
      methods I plan to add inside the domain service, then build up from there.

      Tell me how to start this slice and what the first test should observe.
    graders:
      - type: prompt
    rubric:
      - Rejects private-helper tests as the starting point and redirects the work to the observable rejection behavior.
      - Names an application or use-case boundary as the entry point and states the business outcome to assert.
      - Explains the coupling cost without refusing the request or inventing internal types before the first failure.
      - Gives a concrete next step for this one behavior rather than a generic testing lecture.

  - name: A read-only question needs no test cycle
    prompt: |
      In our checkout service there is a regular expression `^\d{2}-[A-Z]{3}-\d{4}$`
      applied to the promotion code field. What does it accept? I am only trying to
      understand it, I am not changing anything.
    tags:
      intent: non-activation
    graders:
      - type: prompt
    rubric:
      - Answers what the pattern accepts.
      - Does not propose a development cycle, a work breakdown, or new tests for a question that changes nothing.
      - Stays proportionate to a read-only request.
