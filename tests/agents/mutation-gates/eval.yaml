name: mutation-gates
version: 0.1.0
description: >-
  Verifies that the real SKRAFT Software Engineer, sent back by the engine's mutation gate,
  answers what the gate reported and nothing more: it scaffolds missing Stryker configs once at
  the repository root with the mandatory 100/80 bars (canonical Clean Architecture and an
  explicit-scope BFF without invented projects), kills a real surviving mutant with a test,
  suppresses or removes an equivalent one with its reason, and never launches a mutation run or
  writes gate evidence, which the engine owns.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 10m
  model: standard
  runs: 1
scoring:
  threshold: 0.9
# Reworked in V2 lot 6. The suite used to select the orchestrator and grade the
# delivery chain it dispatched for running core then boundary mutation and
# depositing dated evidence. The orchestrator is now a launcher, the engine runs
# every gate and keeps its evidence, and runs no boundary mutation gate. Each
# stimulus now selects the software-engineer with the brief the engine sends
# after its mutation gate failed (pass 2), and keeps the decision it used to
# grade, owned by the engineer:
#   - canonical configuration: kept (root configs, 100/80, canonical scopes);
#   - BFF configuration: kept (explicit scopes, no invented projects);
#   - core below the bar: replaced by "a real core survivor takes a killing test";
#   - boundary below the bar: replaced by "an equivalent core survivor is
#     suppressed with its reason or removed, never tested or excluded".
# Running the gates and writing their evidence is inverted on every stimulus:
# the toolchain double records any mutation run the agent launches.
stimuli:
  - name: A canonical solution without mutation configs gets them once at the root
    prompt: |
      ## Skraft dispatch: software-engineer (DELIVER)
      - Story: order-discount
      - Feature scope: orders
      - Pass: 2, after the gates sent the work back
      - Attempt: 1 of 3
      - Skills (read each before you start):
      - mocking-microcks-dotnet
      - Read first:
      - .copilot-tracking/skraft-plans/orders/features/order-discount.feature
      - .copilot-tracking/skraft-plans/orders/details/2026-08-28/impl-plan-order-discount.md
      - Fill each output in place; keep the path, create no other copy:
      - .copilot-tracking/skraft-plans/orders/changes/2026-08-28/change-log.md
      - Write your result as JSON to .copilot-tracking/skraft-plans/orders/results/deliver-2-1.json: {"status": "done" | "blocked", "summary": "<what you did, or why you cannot go on>"}
      - Change nothing outside these paths of the working copy; the engine refuses the step otherwise:
      - .copilot-tracking/skraft-plans/orders
      - src
      - tests
      - ./* (the files right in the root of orders)
      - Components:
      - orders: . (dotnet), mocking: microcks, contract testing: off, tests: dotnet test --nologo
      - Commit each TDD cycle: `test(<story>): …` with the failing test, then `feat(<story>): …` or `fix(<story>): …` with the code that makes it pass,
        then `refactor(<story>): …` if needed. Tests that pass from the start (coverage) go with the code they cover, or in a `refactor` commit;
        lint and format fixes in a `style` commit. The engine runs the tests at every test commit and refuses one whose tests pass,
        a feat or fix commit with no test commit since the last feat or fix (on a pass the gates sent back, their failure counts as that test),
        and any commit that is not `type(scope): subject`. A refused commit stays refused until you rewrite it.

      The gates failed on pass 1:
      - orders/mutation: exited 2 (evidence: .copilot-tracking/skraft-plans/orders/gates/orders/mutation-1.log)
    tags:
      agent: software-engineer
      scenario: canonical-clean-architecture-config
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    constraints:
      max_duration: 10m
    environment:
      env:
        PATH: ".eval-bin:$PATH"
        SKRAFT_FAKE_CORE_SCORE: "100"
        SKRAFT_FAKE_BOUNDARY_SCORE: "80"
      files:
        - src: fixtures/canonical-ready/.gitignore
          dest: .gitignore
        - src: fixtures/canonical-ready/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/canonical-ready/Orders.slnx
          dest: Orders.slnx
        - src: fixtures/canonical-ready/src/Orders.Domain/Orders.Domain.csproj
          dest: src/Orders.Domain/Orders.Domain.csproj
        - src: fixtures/canonical-ready/src/Orders.Domain/DiscountPolicy.cs
          dest: src/Orders.Domain/DiscountPolicy.cs
        - src: fixtures/canonical-ready/src/Orders.Application/Orders.Application.csproj
          dest: src/Orders.Application/Orders.Application.csproj
        - src: fixtures/canonical-ready/src/Orders.Application/QuoteOrder.cs
          dest: src/Orders.Application/QuoteOrder.cs
        - src: fixtures/canonical-ready/src/Orders.Infrastructure/Orders.Infrastructure.csproj
          dest: src/Orders.Infrastructure/Orders.Infrastructure.csproj
        - src: fixtures/canonical-ready/src/Orders.Infrastructure/OrderReceiptStore.cs
          dest: src/Orders.Infrastructure/OrderReceiptStore.cs
        - src: fixtures/canonical-ready/src/Orders.API/Orders.API.csproj
          dest: src/Orders.API/Orders.API.csproj
        - src: fixtures/canonical-ready/src/Orders.API/Program.cs
          dest: src/Orders.API/Program.cs
        - src: fixtures/canonical-ready/tests/Orders.UnitTests/Orders.UnitTests.csproj
          dest: tests/Orders.UnitTests/Orders.UnitTests.csproj
        - src: fixtures/canonical-ready/tests/Orders.UnitTests/QuoteOrderTests.cs
          dest: tests/Orders.UnitTests/QuoteOrderTests.cs
        - src: fixtures/canonical-ready/tests/Orders.IntegrationTests/Orders.IntegrationTests.csproj
          dest: tests/Orders.IntegrationTests/Orders.IntegrationTests.csproj
        - src: fixtures/canonical-ready/tests/Orders.IntegrationTests/ReceiptStoreTests.cs
          dest: tests/Orders.IntegrationTests/ReceiptStoreTests.cs
        - src: fixtures/canonical-ready/.copilot-tracking/skraft-plans/orders/features/order-discount.feature
          dest: .copilot-tracking/skraft-plans/orders/features/order-discount.feature
        - src: fixtures/canonical-ready/.copilot-tracking/skraft-plans/orders/details/2026-08-28/impl-plan-order-discount.md
          dest: .copilot-tracking/skraft-plans/orders/details/2026-08-28/impl-plan-order-discount.md
        - src: fixtures/toolchain/.eval-bin/dotnet
          dest: .eval-bin/dotnet
        - src: fixtures/toolchain/.eval/verify-mutation-gates.mjs
          dest: .eval/verify-mutation-gates.mjs
        - src: fixtures/gate-feedback/orders-missing-config.log
          dest: .copilot-tracking/skraft-plans/orders/gates/orders/mutation-1.log
      commands: &baseline-setup
        - 'chmod +x .eval-bin/dotnet'
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Evaluation"'
        - 'git add .'
        - 'git commit --quiet -m "test: mutation gate fixture baseline"'
        - 'git tag eval-baseline'
    graders:
      - type: completed
      - type: skill-invocation
        name: The stack's gate skill is loaded for the failing gate
        config:
          required:
            - quality-gates-dotnet
      - type: program
        name: Root configs carry the 100/80 bars and canonical scopes; no run, no evidence
        config:
          program: node
          args: [.eval/verify-mutation-gates.mjs, config, canonical]
          timeout: 30s
      - type: program
        name: Sentinel - fixture and build infrastructure survived the trial
        config:
          program: node
          args: [.eval/verify-mutation-gates.mjs, config, canonical]
          env:
            SKRAFT_VERIFY_SENTINEL: "1"
          timeout: 30s

