        - src: fixtures/shared/.copilot-tracking/skraft-plans/pricing/details/2026-08-14/event-model-discount.md
          dest: .copilot-tracking/skraft-plans/pricing/details/2026-08-14/event-model-discount.md
        - src: fixtures/shared/.copilot-tracking/skraft-plans/pricing/details/2026-08-14/diagrams-discount.md
          dest: .copilot-tracking/skraft-plans/pricing/details/2026-08-14/diagrams-discount.md
        - src: fixtures/shared/.copilot-tracking/skraft-plans/pricing/details/2026-08-14/contracts-discount.md
