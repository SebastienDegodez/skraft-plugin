name: solution-architect-throughput
version: 0.1.0
description: >-
  Throughput benchmark of the real SKRAFT Solution Architect on the fourteen-criteria .NET
  `discount` story the other throughput suites deliver: RESEARCH is approved, DESIGN starts.
  Run at two refs through eng/bench-agent-ab.sh. The graders only say a design exists, the
  ratified decision and the research are left alone and no code is written; they take no side
  on how many decisions of record the design holds. The benchmark reads cost and time.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 45m
  model: claude-sonnet-5.5
  runs: 3
scoring:
  threshold: 0.9
stimuli:
  - name: Fourteen-criteria pricing story becomes a design
    prompt: |
      I want to design the `discount` story of the Checkout Pricing project. The story, its
      acceptance criteria and the research are approved; nothing is designed or built for it.
      Complete the design pass.
    tags:
      agent: solution-architect
      scenario: fourteen-criteria-dotnet-design
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/s14/.copilot-tracking/skraft-plans/pricing/details/2026-08-07/structural-scan.json
          dest: .copilot-tracking/skraft-plans/pricing/details/2026-08-07/structural-scan.json
        - src: fixtures/s14/.copilot-tracking/skraft-plans/pricing/plans/2026-08-07/ac.md
          dest: .copilot-tracking/skraft-plans/pricing/plans/2026-08-07/ac.md
        - src: fixtures/s14/.copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
          dest: .copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
        - src: fixtures/s14/.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md
          dest: .copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md
        - src: fixtures/s14/.copilot-tracking/skraft-plans/pricing/state.json
          dest: .copilot-tracking/skraft-plans/pricing/state.json
        - src: fixtures/s14/.gitignore
          dest: .gitignore
        - src: fixtures/s14/CheckoutPricing.slnx
          dest: CheckoutPricing.slnx
        - src: fixtures/s14/Directory.Build.props
          dest: Directory.Build.props
        - src: fixtures/s14/Directory.Packages.props
          dest: Directory.Packages.props
        - src: fixtures/s14/README.md
          dest: README.md
        - src: fixtures/s14/docs/adr/adr-001-integer-cent-money.md
          dest: docs/adr/adr-001-integer-cent-money.md
        - src: fixtures/s14/docs/adr/decisions-index.md
          dest: docs/adr/decisions-index.md
        - src: fixtures/s14/docs/adr/supersessions.md
          dest: docs/adr/supersessions.md
        - src: fixtures/s14/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/s14/src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
          dest: src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
        - src: fixtures/s14/src/CheckoutPricing.Api/Program.cs
          dest: src/CheckoutPricing.Api/Program.cs
        - src: fixtures/s14/src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
          dest: src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
        - src: fixtures/s14/src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
          dest: src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
        - src: fixtures/s14/src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
          dest: src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
        - src: fixtures/s14/src/CheckoutPricing.Domain/LoyaltyTier.cs
          dest: src/CheckoutPricing.Domain/LoyaltyTier.cs
        - src: fixtures/s14/src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
          dest: src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
        - src: fixtures/s14/src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
          dest: src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
        - src: fixtures/s14/tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
          dest: tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
        - src: fixtures/s14/tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
          dest: tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
        - src: fixtures/s14/tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
          dest: tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
      commands:
        - 'git init --quiet --object-format=sha1'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "chore: approved RESEARCH fixture"'
    graders:
      - type: completed
      - type: output-not-matches
        name: No mandatory skill is reported as unavailable
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
      - type: diff-contains
        name: Design artefacts land in the DESIGN artefact location
        config:
          pattern: '\.copilot-tracking/skraft-plans/pricing/details/\d{4}-\d{2}-\d{2}/'
      - type: run-command
        name: No production or test code is written during design
        config:
          command: bash
          args:
            - '-lc'
            - '[ -z "$(git status --porcelain -- src tests)" ]'
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: The already-ratified money decision is left alone
        config:
          command: git
          args:
            - 'diff'
            - '--quiet'
            - '--'
            - 'docs/adr/adr-001-integer-cent-money.md'
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: The approved research is left alone
        config:
          command: git
          args:
            - 'diff'
            - '--quiet'
            - '--'
            - '.copilot-tracking/skraft-plans/pricing/research'
          expected_exit_code: 0
          timeout: 30s
