name: skraft-orchestrator-agent
description: Verifies that Vally selects the exact SKRAFT Orchestrator, loads its required skills, and blocks safely when no refined story is available.
version: 0.1.0
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 2m
  model: gpt-5.6-luna
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  - name: Missing refined story blocks orchestration
    prompt: |
      Run the engineering pipeline for this repository. No refined story or approved
      product input is available in the evaluation workspace. Report the missing
      precondition in the structured handoff format and stop without changing files.
    tags:
      agent: skraft-orchestrator
      scenario: missing-preconditions
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/empty-workspace/README.md
          dest: README.md
    graders:
      - type: completed
      - type: output-matches
        config:
          pattern: '(?s)"status"\s*:\s*"blocked"'
      - type: output-matches
        config:
          pattern: '(?s)"type"\s*:\s*"clarification_needed"'
      - type: skill-invocation
        config:
          required:
            - skraft-difficulty-routing
            - adversarial-review-lenses
      - type: output-not-matches
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
      - type: diff-empty