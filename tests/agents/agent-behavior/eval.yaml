name: skraft-orchestrator-agent
description: >-
  Harness conformance suite. Verifies that Vally selects the exact SKRAFT Orchestrator, that it
  refuses to start without a refined story, and that a resume with no active pipeline asks for
  the slug instead of picking one from disk — without dispatching a phase agent itself.
version: 0.1.0
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 4m
  model: economy
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  # The orchestrator's OWN contract, and only that. It consumes a refined story
  # from the product layer; with none present it says so and points at the
  # skraft-backlog plugin. It loads no skill here on purpose — there is nothing to
  # route — so a `skill-invocation` grader on this stimulus would assert a
  # behaviour the agent does not have. The launcher loads no skill on the second
  # stimulus either: the engine dispatches the phase agents that do.
  - name: Missing refined story blocks orchestration
    prompt: |
      Run the engineering pipeline for this repository. No refined story or approved
      product input is available in the evaluation workspace. Report the missing
      precondition and stop without changing files.
    tags:
      agent: skraft-orchestrator
      scenario: missing-preconditions
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/empty-workspace/README.md
          dest: README.md
    graders:
      - type: completed
      - type: output-matches
        name: The run is reported as blocked on a missing precondition
        config:
          pattern: '(?i)\b(blocked|not started|did not start|cannot\s+(?:run|start|proceed|resume|continue)|unable to\s+(?:run|start|proceed))\b'
      - type: output-matches
        name: The developer is routed to the product layer that owns the input
        config:
          pattern: '(?i)(skraft[\s_-]*backlog|backlog[\s_-]*planner)'
      # Narration is cheap; a dispatch is not. Nothing may be handed to a
      # specialist when the pipeline has no story to give it.
      - type: custom-metrics
        name: No phase is dispatched without a story
        config:
          assertions:
            - metric: subagentDispatchCount
              equals: 0
      - type: output-not-matches
        name: Skills are staged, so nothing reports them as missing
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
      - type: diff-empty

  # Replaced in V2 lot 6. This stimulus graded the orchestrator refusing to
  # resume a phase whose recorded inputs (`state.json`, the DISTILL artefacts)
  # were gone. The orchestrator is a launcher now: the engine owns the recorded
  # state and refuses a step whose inputs are missing. The nearest decision the
  # launcher still owns on a resume is which pipeline to resume: without a slug
  # it resumes the working copy's active pipeline (`.active-slug`), and with
  # none it asks the human, never picking a folder it finds on disk.
  - name: A resume with no active pipeline asks for the slug instead of guessing one
    prompt: |
      Continue the engineering pipeline for the Checkout Pricing project through its current
      phase. Its records live under `.copilot-tracking/` in this workspace — read nothing
      outside this workspace.
    tags:
      agent: skraft-orchestrator
      subagents: [software-engineer]
      scenario: resume-without-active-pipeline
      # Write access is granted precisely because the stimulus claims nothing is
      # written: `diff-empty` below is only evidence when the agent could have
      # written and did not.
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/no-active-pipeline/README.md
          dest: README.md
        - src: fixtures/no-active-pipeline/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/no-active-pipeline/.copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
          dest: .copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
    graders:
      - type: completed
      - type: output-matches
        name: The human is asked which pipeline to resume
        config:
          pattern: '(?i)\bslug\b'
      # The launcher never dispatches a phase agent; the engine does.
      - type: custom-metrics
        name: No phase agent is dispatched by the launcher
        config:
          assertions:
            - metric: subagentDispatchCount
              equals: 0
      - type: output-not-matches
        name: Skills are staged, so nothing reports them as missing
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
      - type: diff-empty
