name: skraft-orchestrator-agent
description: >-
  Harness conformance suite. Verifies that Vally selects the exact SKRAFT Orchestrator, that its
  staged skills load, and that it refuses to start or resume a phase whose inputs are absent —
  without dispatching a specialist into a phase it would have to invent inputs for.
version: 0.1.0
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 4m
  model: gpt-5.6-luna
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  # The orchestrator's OWN contract, and only that. It consumes a refined story
  # from the product layer; with none present it says so and points at the
  # Backlog Planner. It loads no skill here on purpose — there is nothing to
  # route — so a `skill-invocation` grader on this stimulus would assert a
  # behaviour the agent does not have. Skill loading is proven on the second
  # stimulus, where a skill is genuinely required.
  - name: Missing refined story blocks orchestration
    prompt: |
      Run the engineering pipeline for this repository. No refined story or approved
      product input is available in the evaluation workspace. Report the missing
      precondition and stop without changing files.
    tags:
      agent: skraft-orchestrator
      scenario: missing-preconditions
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/empty-workspace/README.md
          dest: README.md
    graders:
      - type: completed
      - type: output-matches
        name: The run is reported as blocked on a missing precondition
        config:
          pattern: '(?i)\b(blocked|cannot\s+(?:run|start|proceed|resume|continue)|unable to\s+(?:run|start|proceed))\b'
      - type: output-matches
        name: The developer is routed to the product layer that owns the input
        config:
          pattern: '(?i)backlog[\s_-]*planner'
      # Narration is cheap; a dispatch is not. Nothing may be handed to a
      # specialist when the pipeline has no story to give it.
      - type: custom-metrics
        name: No phase is dispatched without a story
        config:
          assertions:
            - metric: subagentDispatchCount
              equals: 0
      - type: output-not-matches
        name: Skills are staged, so nothing reports them as missing
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
      - type: diff-empty

  # Migrated from the pre-orchestrator suite, which selected `software-engineer`
  # directly and asserted that it blocked on absent inputs. That premise does not
  # survive the migration intact: the orchestrator guards the phase BEFORE it
  # dispatches, so the engineer is never reached and never gets to refuse. The
  # base test conflated two claims, and they are now measured where each is real:
  # the guard is here, and "the dispatched engineer loads its own mandatory
  # skills" moved to `software-engineer-delivery`, the suite where a dispatch
  # legitimately happens.
  - name: A phase whose recorded inputs are gone is not resumed
    prompt: |
      Continue the engineering pipeline for the Checkout Pricing project through its current
      phase. Its recorded state lives under `.copilot-tracking/` in this workspace — read it
      there, and read nothing outside this workspace.
    tags:
      agent: skraft-orchestrator
      subagents: [software-engineer]
      scenario: missing-distill-artifacts
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/deliver-without-distill/README.md
          dest: README.md
        - src: fixtures/deliver-without-distill/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/deliver-without-distill/.copilot-tracking/skraft-plans/checkout-pricing/state.json
          dest: .copilot-tracking/skraft-plans/checkout-pricing/state.json
    graders:
      - type: completed
      # The specialist is offered (`subagents:` grants the dispatch tool) and must
      # still not be used: an agent handed a phase whose inputs are absent would
      # have to invent them. Declaring the tool and then asserting it stays unused
      # is what makes this falsifiable — without the tool, silence proves nothing.
      - type: custom-metrics
        name: No specialist is dispatched into a phase with absent inputs
        config:
          assertions:
            - metric: subagentDispatchCount
              equals: 0
      # Which skills the lead loads is a judgement it makes per situation, not a
      # contract: across two runs of this same stimulus it loaded
      # `skraft-difficulty-routing` three times out of three and then zero out of
      # three. Grading it would measure prompt phrasing. The claim that skills are
      # reachable at all is carried by the SKILL-MISSING grader below, and the
      # claim that a dispatched specialist loads ITS mandatory skills lives in
      # `software-engineer-delivery`, where a dispatch legitimately happens.
      - type: output-matches
        name: The absent DISTILL input is named as the reason delivery cannot start
        config:
          pattern: '(?i)(feature file|\.feature|impl(?:ementation)?[\s_-]*plan|DISTILL)'
      - type: output-matches
        name: Delivery is reported as blocked rather than attempted
        config:
          pattern: '(?i)\b(blocked|blocker|cannot\s+(?:run|start|proceed|resume|continue)|absent|missing|not (?:present|found)|indeterminate)\b'
      - type: output-not-matches
        name: Skills are staged, so nothing reports them as missing
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
      - type: diff-empty