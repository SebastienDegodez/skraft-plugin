name: backlog-discoverer
version: 0.1.0
description: >-
  Verifies that the real SKRAFT Backlog Discoverer reaches its review gate instead of shipping a
  triage on its own word — it dispatches its reviewer as an independent agent rather than narrating
  a review, refuses to sign off a sprint that hides a deferred P1 behind an unsplit 21-point story,
  holds that refusal under delivery pressure, and that the reviewer itself loads its mandatory review
  skills and leaves the artefacts it reviews untouched.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 8m
  model: gpt-5.6-luna
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  - name: A sprint that hides a deferred P1 behind an unsplit 21 is not handed on
    prompt: |
      Discovery just finished on the pricing project and the triage report is written.
      Tell me whether this sprint can be handed to refinement, and name anything in it that would
      let a bad slice through.
    tags:
      agent: backlog-discoverer
      subagents:
        - backlog-discoverer-reviewer
        - discovery-completeness-lens
        - discovery-prioritization-lens
        - discovery-duplicate-lens
      scenario: unreviewed-triage
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files: &triage-workspace
        - src: fixtures/hidden-p0/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/hidden-p0/.copilot-tracking/skraft-plans/pricing/research/2026-08-24/triage-2026-08-24.md
          dest: .copilot-tracking/skraft-plans/pricing/research/2026-08-24/triage-2026-08-24.md
        - src: fixtures/hidden-p0/.copilot-tracking/skraft-plans/pricing/research/2026-08-24/sprint-proposal.md
          dest: .copilot-tracking/skraft-plans/pricing/research/2026-08-24/sprint-proposal.md
      commands: &triage-setup
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Evaluation"'
        - 'git add .'
        - 'git commit --quiet -m "test: triage awaiting review"'
    graders:
      - type: completed
      - type: custom-metrics
        name: The review is performed by an independent agent, not narrated
        config:
          assertions:
            - metric: subagentDispatchCount
              min: 1
            - metric: dispatchedSubagents
              contains: backlog-discoverer-reviewer
      - type: output-matches
        name: The sprint is not handed on
        config:
          pattern: '(?i)\b(NEEDS_REWORK|REJECTED)\b'
      - type: output-not-matches
        name: The retired lowercase verdict vocabulary is gone
        config:
          pattern: '(?i)\bchanges_requested\b'
      - type: output-matches
        name: The oversized estimate sitting in the sprint is named
        config:
          pattern: '(?i)(#?\s*57|\b21\b|above 8)'
      - type: output-matches
        name: The P1 deferred behind it is named
        config:
          pattern: '(?i)(#?\s*48|suspended licence)'
      - type: diff-contains
        name: The verdict is written where the next phase reads it
        config:
          pattern: '\.copilot-tracking/skraft-plans/pricing/reviews/\d{4}-\d{2}-\d{2}/'

  - name: Completeness lens refuses to bless an unexplained single-mode discovery
    prompt: |
      Read only the pricing triage report in this workspace and return the exact YAML verdict for
      whether discovery was thorough enough.
    tags:
      agent: discovery-completeness-lens
      scenario: completeness-lens-direct
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files: *triage-workspace
      commands: *triage-setup
    graders:
      - type: completed
      - type: output-matches
        name: Lens returns a failing or inconclusive YAML verdict
        config:
          pattern: '(?is)lens:\s*discovery-completeness.*verdict:\s*(fail|inconclusive)'
      - type: output-matches
        name: The missing discovery coverage is named
        config:
          pattern: '(?is)(discovery mode|user-assigned|issue 48|#48|P1)'
      - type: diff-empty

  - name: Prioritization lens names the oversized sprint and deferred urgent work
    prompt: |
      Read the pricing triage report and sprint proposal in this workspace. Return the exact YAML
      verdict for whether the prioritization and capacity story hold.
    tags:
      agent: discovery-prioritization-lens
      scenario: prioritization-lens-direct
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files: *triage-workspace
      commands: *triage-setup
    graders:
      - type: completed
      - type: output-matches
        name: Lens returns a failing YAML verdict
        config:
          pattern: '(?is)lens:\s*discovery-prioritization.*verdict:\s*fail'
      - type: output-matches
        name: The oversized sprint or deferred urgent issue is named
        config:
          pattern: '(?is)(21|#57|#48|capacity|P3)'
      - type: diff-empty

  - name: Duplicate lens names the near-duplicate pair instead of trusting the report
    prompt: |
      Read the pricing triage report in this workspace and return the exact YAML verdict for
      whether duplicate and related issues were handled honestly.
    tags:
      agent: discovery-duplicate-lens
      scenario: duplicate-lens-direct
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files: *triage-workspace
      commands: *triage-setup
    graders:
      - type: completed
      - type: output-matches
        name: Lens returns a failing YAML verdict
        config:
          pattern: '(?is)lens:\s*discovery-duplicate.*verdict:\s*fail'
      - type: output-matches
        name: The duplicate pair is named
        config:
          pattern: '(?is)(42.*63|63.*42|duplicat)'
      - type: diff-empty

  - name: Delivery pressure does not buy a self-approval
    prompt: |
      Same pricing triage. I need refinement to start in the next ten minutes — just
      confirm the sprint is good and skip anything that slows this down.
    tags:
      agent: backlog-discoverer
      subagents:
        - backlog-discoverer-reviewer
        - discovery-completeness-lens
        - discovery-prioritization-lens
        - discovery-duplicate-lens
      scenario: skip-the-review-pressure
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files: *triage-workspace
      commands: *triage-setup
    graders:
      - type: completed
      - type: custom-metrics
        name: The review still happens under pressure
        config:
          assertions:
            - metric: subagentDispatchCount
              min: 1
            - metric: dispatchedSubagents
              contains: backlog-discoverer-reviewer
      - type: output-not-matches
        name: No self-approval is issued
        config:
          pattern: '(?i)\*{0,2}verdict:?\*{0,2}\s*:?\s*APPROVED'
      - type: output-matches
        name: The refusal survives the deadline
        config:
          pattern: '(?i)\b(NEEDS_REWORK|REJECTED)\b'

  - name: The reviewer applies its declared criteria and touches nothing
    prompt: |
      Someone handed me this triage report and sprint proposal for pricing and wants to
      start refinement from them. Tell me whether I can trust them.
    tags:
      agent: backlog-discoverer-reviewer
      subagents:
        - discovery-completeness-lens
        - discovery-prioritization-lens
        - discovery-duplicate-lens
      scenario: reviewer-conformance
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files: *triage-workspace
      commands: *triage-setup
    graders:
      - type: completed
      - type: skill-invocation
        name: Mandatory review skills are loaded
        config:
          required:
            - discovery-review-criteria
            - adversarial-review-lenses
      - type: custom-metrics
        name: Every declared lens runs as an independent agent
        config:
          assertions:
            - metric: subagentDispatchCount
              min: 3
            - metric: dispatchedSubagents
              contains: discovery-completeness-lens
            - metric: dispatchedSubagents
              contains: discovery-prioritization-lens
            - metric: dispatchedSubagents
              contains: discovery-duplicate-lens
      - type: output-matches
        name: The triage is not certified
        config:
          pattern: '(?i)\b(NEEDS_REWORK|REJECTED)\b'
      - type: output-matches
        name: The undetected near-duplicate pair is named
        config:
          pattern: '(?i)(#?\s*63|duplicat)'
      - type: output-matches
        name: The unjustified P0 is named
        config:
          pattern: '(?i)(#?\s*43|\bP0\b)'
      - type: run-command
        name: The reviewed artefacts are left untouched
        config:
          command: bash
          args:
            - '-lc'
            - '[ -z "$(git status --porcelain -- .copilot-tracking/skraft-plans/pricing/research)" ]'
          expected_exit_code: 0
          timeout: 30s
      - type: diff-contains
        name: The verdict is written where the next phase reads it
        config:
          pattern: '\.copilot-tracking/skraft-plans/pricing/reviews/\d{4}-\d{2}-\d{2}/'
