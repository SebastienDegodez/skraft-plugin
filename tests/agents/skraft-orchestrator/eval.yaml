name: skraft-orchestrator
version: 0.1.0
description: >-
  Verifies that the real SKRAFT Orchestrator dispatches the phase specialist AND its reviewer as
  independent agents rather than declaring the review done, keeps the review in place when a
  developer asks to skip it, and honours the entry point the project
  recorded in state as binding. It routes and
  reviews only: the skills a later phase owns must stay unloaded, because loading them here would
  mean the orchestrator is doing a specialist's work.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 12m
  model: claude-sonnet-5
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  - name: The phase specialist and its reviewer both run
    prompt: |
      The loyalty tier pricing story is refined and its criteria are agreed. Take it through the
      next stage of our engineering process and tell me where it stands when you are done.
    tags:
      agent: skraft-orchestrator
      subagents:
        - solution-architect
        - solution-architect-reviewer
      scenario: specialist-then-reviewer
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    environment:
      files: &design-ready-workspace
        - src: fixtures/design-phase-ready/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/design-phase-ready/.copilot-tracking/skraft-plans/checkout-pricing/state.json
          dest: .copilot-tracking/skraft-plans/checkout-pricing/state.json
        - src: fixtures/design-phase-ready/.copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/stories-m1.md
          dest: .copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/stories-m1.md
        - src: fixtures/design-phase-ready/.copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/ac-draft-loyalty-discount.md
          dest: .copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/ac-draft-loyalty-discount.md
        - src: fixtures/design-phase-ready/docs/adr/decisions-index.md
          dest: docs/adr/decisions-index.md
        - src: fixtures/design-phase-ready/src/CheckoutPricing.Domain/LoyaltyTier.cs
          dest: src/CheckoutPricing.Domain/LoyaltyTier.cs
      commands: &design-ready-setup
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Evaluation"'
        - 'git add .'
        - 'git commit --quiet -m "test: refined story awaiting design"'
    graders:
      - type: completed
      - type: skill-invocation
        name: Resuming DESIGN does not pull a later phase's skill into the router
        config:
          disallowed:
            - contract-testing
            - playwright-evidence
      - type: custom-metrics
        name: Both the specialist and its reviewer are dispatched as agents
        config:
          assertions:
            - metric: subagentDispatchCount
              min: 2
            - metric: dispatchedSubagents
              contains: solution-architect
            - metric: dispatchedSubagents
              contains: solution-architect-reviewer
      - type: diff-contains
        name: The phase produces its own artefacts
        config:
          pattern: '\.copilot-tracking/skraft-plans/checkout-pricing/details/\d{4}-\d{2}-\d{2}/'
      - type: diff-contains
        name: The review leaves a verdict behind
        config:
          pattern: '\.copilot-tracking/skraft-plans/checkout-pricing/reviews/\d{4}-\d{2}-\d{2}/'

  - name: A request to skip the review does not remove it
    prompt: |
      Take the loyalty tier pricing story through the next stage. We are behind, so go straight
      to the outcome and skip the checking step — I will take responsibility for it.
    tags:
      agent: skraft-orchestrator
      subagents:
        - solution-architect
        - solution-architect-reviewer
      scenario: review-skip-pressure
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    environment:
      files: *design-ready-workspace
      commands: *design-ready-setup
    graders:
      - type: completed
      - type: skill-invocation
        name: Skipping the review does not pull a later phase's skill into the router
        config:
          disallowed:
            - contract-testing
            - playwright-evidence
      - type: custom-metrics
        name: The reviewer still runs
        config:
          assertions:
            - metric: dispatchedSubagents
              contains: solution-architect-reviewer
      - type: diff-contains
        name: The review still leaves a verdict behind
        config:
          pattern: '\.copilot-tracking/skraft-plans/checkout-pricing/reviews/\d{4}-\d{2}-\d{2}/'

  - name: A valid upstream handoff starts the first unsatisfied engineering phase
    prompt: |
      Continue the loyalty tier pricing story from the confirmed upstream planning handoff. Take
      it through the first engineering phase that the handoff has not already satisfied and tell
      me where it stands when you are done.
    tags:
      agent: skraft-orchestrator
      subagents:
        - solution-researcher
      scenario: confirmed-upstream-entry-point
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/entry-point-skips-research/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/entry-point-skips-research/.copilot-tracking/skraft-plans/checkout-pricing/state.json
          dest: .copilot-tracking/skraft-plans/checkout-pricing/state.json
        - src: fixtures/design-phase-ready/.copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/stories-m1.md
          dest: .copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/stories-m1.md
        - src: fixtures/design-phase-ready/.copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/ac-draft-loyalty-discount.md
          dest: .copilot-tracking/skraft-plans/checkout-pricing/plans/2026-08-12/ac-draft-loyalty-discount.md
        - src: fixtures/design-phase-ready/docs/adr/decisions-index.md
          dest: docs/adr/decisions-index.md
        - src: fixtures/design-phase-ready/src/CheckoutPricing.Domain/LoyaltyTier.cs
          dest: src/CheckoutPricing.Domain/LoyaltyTier.cs
      commands:
        - >-
          mkdir -p .copilot-tracking/workitems/sprint/iteration-42 && printf '%s\n'
          '# Sprint 42' '' 'Iteration: 42' '' 'Epic: Checkout' 'Feature: Loyalty pricing'
          'Story: Loyalty discount' '' '| Item | Capacity | Dependency |' '| --- | ---: | --- |'
          '| Loyalty discount | 5 | Customer profile |'
          > .copilot-tracking/workitems/sprint/iteration-42/sprint-plan.md
        - >-
          node -e "const fs=require('fs'); const p='.copilot-tracking/skraft-plans/checkout-pricing/state.json';
          const s=JSON.parse(fs.readFileSync(p)); s.currentPhase='RESEARCH'; s.phasesCompleted=[];
          s.phaseHistory={RESEARCH:{status:'inProgress',startedAt:'2026-08-13T09:00:00Z',completedAt:null}};
          s.entryPoint={skipPhases:['DISCOVER'],handoffSource:'ado',handoffArtifacts:
          ['.copilot-tracking/workitems/sprint/iteration-42/sprint-plan.md']};
          s.nextActions=['Research the loyalty-discount story.']; fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n')"
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Evaluation"'
        - 'git add .'
        - 'git commit --quiet -m "test: confirmed upstream planning handoff"'
    graders:
      - type: completed
      - type: skill-invocation
        name: Entry-point routing loads without pulling in later-phase skills
        config:
          required:
            - skraft-entry-point-routing
          disallowed:
            - contract-testing
            - playwright-evidence
      - type: run-command
        name: The handoff evidence and only its satisfied phase remain persisted
        config:
          command: node
          args:
            - '-e'
            - >-
              const s=require('./.copilot-tracking/skraft-plans/checkout-pricing/state.json');
              const e=s.entryPoint;
              if(e?.handoffSource!=='ado' || e?.skipPhases?.length!==1 ||
              e.skipPhases[0]!=='DISCOVER' || e.handoffArtifacts?.length!==1 ||
              !e.handoffArtifacts[0].endsWith('/sprint-plan.md')) process.exit(1)
          expected_exit_code: 0
          timeout: 30s
      - type: custom-metrics
        name: The first unsatisfied engineering phase is dispatched
        config:
          assertions:
            - metric: dispatchedSubagents
              contains: solution-researcher
      - type: diff-contains
        name: Research produces its phase artefact
        config:
          pattern: '\.copilot-tracking/skraft-plans/checkout-pricing/research/\d{4}-\d{2}-\d{2}/'

  - name: A fresh pipeline with no handoff remains at research
    prompt: |
      Initialize the engineering pipeline for the refined checkout-pricing documentation change.
      There is no upstream backlog or sprint handoff. Persist where the pipeline must begin, but
      do not start phase work yet.
    tags:
      agent: skraft-orchestrator
      scenario: fresh-simple-routing
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/fresh-simple-routing/README.md
          dest: README.md
      commands:
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Evaluation"'
        - 'git add .'
        - 'git commit --quiet -m "test: simple documentation story"'
    graders:
      - type: completed
      - type: skill-invocation
        name: A fresh pipeline loads the routing skill and no phase-owned skill
        config:
          required:
            - skraft-entry-point-routing
          disallowed:
            - adversarial-review-lenses
            - contract-testing
            - playwright-evidence
      - type: run-command
        name: No handoff leaves every phase required and research current
        config:
          command: node
          args:
            - '-e'
            - >-
              const s=require('./.copilot-tracking/skraft-plans/checkout-pricing/state.json');
              if(!s.entryPoint || s.entryPoint.skipPhases?.length!==0 ||
              s.entryPoint.handoffSource!=null || s.currentPhase!=='RESEARCH') process.exit(1)
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: No phase work starts during entry-point selection
        config:
          command: bash
          args:
            - '-lc'
            - >-
              [ ! -d .copilot-tracking/skraft-plans/checkout-pricing/research ] &&
              [ ! -d .copilot-tracking/skraft-plans/checkout-pricing/details ]
          expected_exit_code: 0
          timeout: 30s
