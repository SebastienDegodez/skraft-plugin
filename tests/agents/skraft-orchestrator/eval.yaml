name: skraft-orchestrator
version: 0.1.0
description: >-
  Verifies that the real SKRAFT Orchestrator opens a fresh pipeline at research without starting
  phase work. It routes only: the skills a later phase owns must stay unloaded, because loading
  them here would mean the orchestrator is doing a specialist's work. Reviews are no longer its
  job: the engine runs each review node's lenses and computes the verdict.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 12m
  model: claude-sonnet-5.5
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  - name: A fresh pipeline with no handoff remains at research
    prompt: |
      Initialize the engineering pipeline for the refined pricing documentation change.
      There is no upstream backlog or sprint handoff. Persist where the pipeline must begin, but
      do not start phase work yet.
    tags:
      agent: skraft-orchestrator
      scenario: fresh-simple-routing
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/fresh-simple-routing/README.md
          dest: README.md
      commands:
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Evaluation"'
        - 'git add .'
        - 'git commit --quiet -m "test: simple documentation story"'
    graders:
      - type: completed
      - type: skill-invocation
        name: A fresh pipeline loads no phase-owned skill
        config:
          disallowed:
            - adversarial-review-lenses
            - contract-testing
            - playwright-evidence
      - type: run-command
        name: The pipeline is persisted at research
        config:
          command: node
          args:
            - '-e'
            - >-
              const s=require('./.copilot-tracking/skraft-plans/pricing/state.json');
              if(s.currentPhase!=='RESEARCH') process.exit(1)
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: No phase work starts during initialization
        config:
          command: bash
          args:
            - '-lc'
            - >-
              [ ! -d .copilot-tracking/skraft-plans/pricing/research ] &&
              [ ! -d .copilot-tracking/skraft-plans/pricing/details ]
          expected_exit_code: 0
          timeout: 30s
