name: skraft-orchestrator
version: 0.1.0
description: >-
  Verifies that the real SKRAFT Orchestrator, a launcher, hands a fresh pipeline to the skraft
  engine without starting phase work or writing pipeline state itself. The skills a later phase
  owns must stay unloaded, because loading them here would mean the orchestrator is doing a
  specialist's work. Reviews, gates and the pipeline state are no longer its job: the engine
  runs them and records the state.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 12m
  model: standard
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  - name: A fresh pipeline with no handoff remains at research
    prompt: |
      Initialize the engineering pipeline for the refined pricing documentation change.
      There is no upstream backlog or sprint handoff. Persist where the pipeline must begin, but
      do not start phase work yet.
    tags:
      agent: skraft-orchestrator
      scenario: fresh-simple-routing
      permissions: workspace-write
      cost: low
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/fresh-simple-routing/README.md
          dest: README.md
      commands:
        - 'git init --quiet'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Evaluation"'
        - 'git add .'
        - 'git commit --quiet -m "test: simple documentation story"'
    graders:
      - type: completed
      - type: skill-invocation
        name: A fresh pipeline loads no phase-owned skill
        config:
          disallowed:
            - adversarial-review-lenses
            - contract-testing
            - playwright-evidence
      # Inverted in V2 lot 6: the engine records where the pipeline begins; the
      # launcher never writes under `.copilot-tracking/`, even when asked to persist.
      - type: diff-not-contains
        name: The launcher writes no pipeline state itself
        config:
          pattern: '(?m)^diff --git a/\.copilot-tracking/'
      - type: output-matches
        name: The start is handed to the skraft engine
        config:
          pattern: '(?i)(run_pipeline|skraft-pipeline|/skraft\b|skraft engine)'
      - type: run-command
        name: No phase work starts during initialization
        config:
          command: bash
          args:
            - '-lc'
            - >-
              [ ! -d .copilot-tracking/skraft-plans/pricing/research ] &&
              [ ! -d .copilot-tracking/skraft-plans/pricing/details ]
          expected_exit_code: 0
          timeout: 30s
