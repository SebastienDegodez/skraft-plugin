name: solution-researcher-throughput
version: 0.1.0
description: >-
  Throughput benchmark of the real SKRAFT Solution Researcher on the fourteen-criteria .NET
  `discount` story of software-engineer-throughput, three phases earlier: the criteria are
  agreed, RESEARCH starts. One stimulus on the existing solution, one on a repository with no
  code. Run at two refs through eng/bench-agent-ab.sh, which hands each arm the research
  template of its own ref. The graders only say the investigation exists, cites what it read
  and changed nothing else; a result that blocks on a product question counts as a result. The
  benchmark reads cost and time.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 30m
  model: standard
  runs: 3
scoring:
  threshold: 0.9
stimuli:
  - name: Fourteen-criteria pricing story is researched on the existing solution
    prompt: |
      I want to research the `discount` story of the Checkout Pricing project before anyone
      designs it. The story and its acceptance criteria are agreed; nothing is researched, designed or built for it.
      Leave the investigation the designer will start from.

      For this run, fill `.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md`
      in place. Write the run result JSON to
      `.copilot-tracking/skraft-plans/pricing/results/research-1-1.json`.
    tags:
      agent: solution-researcher
      scenario: fourteen-criteria-dotnet-research
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/s14/.copilot-tracking/skraft-plans/pricing/plans/2026-08-07/ac-draft-discount.md
          dest: .copilot-tracking/skraft-plans/pricing/plans/2026-08-07/ac-draft-discount.md
        - src: fixtures/s14/.copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
          dest: .copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
        - src: fixtures/s14/.gitignore
          dest: .gitignore
        - src: fixtures/s14/CheckoutPricing.slnx
          dest: CheckoutPricing.slnx
        - src: fixtures/s14/Directory.Build.props
          dest: Directory.Build.props
        - src: fixtures/s14/Directory.Packages.props
          dest: Directory.Packages.props
        - src: fixtures/s14/README.md
          dest: README.md
        - src: fixtures/s14/docs/adr/adr-001-integer-cent-money.md
          dest: docs/adr/adr-001-integer-cent-money.md
        - src: fixtures/s14/docs/adr/decisions-index.md
          dest: docs/adr/decisions-index.md
        - src: fixtures/s14/docs/adr/supersessions.md
          dest: docs/adr/supersessions.md
        - src: fixtures/s14/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/s14/src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
          dest: src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
        - src: fixtures/s14/src/CheckoutPricing.Api/Program.cs
          dest: src/CheckoutPricing.Api/Program.cs
        - src: fixtures/s14/src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
          dest: src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
        - src: fixtures/s14/src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
          dest: src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
        - src: fixtures/s14/src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
          dest: src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
        - src: fixtures/s14/src/CheckoutPricing.Domain/LoyaltyTier.cs
          dest: src/CheckoutPricing.Domain/LoyaltyTier.cs
        - src: fixtures/s14/src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
          dest: src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
        - src: fixtures/s14/src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
          dest: src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
        - src: fixtures/s14/tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
          dest: tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
        - src: fixtures/s14/tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
          dest: tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
        - src: fixtures/s14/tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
          dest: tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
        - src: fixtures/s14/research.template.md
          dest: .copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md
      commands:
        - 'git init --quiet --object-format=sha1'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "chore: refined discount story"'
        - 'mkdir -p .copilot-tracking/skraft-plans/pricing/results'
    graders:
      - type: completed
      - type: diff-contains
        name: Investigation lands in the RESEARCH artefact location
        config:
          pattern: '\.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research\.md'
      - type: file-not-matches
        name: The research document contains no unfilled template markers
        config:
          path: '.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md'
          pattern: '\{\{[^}]+\}\}'
      - type: file-matches
        name: The run result records a completed or a blocked investigation
        config:
          path: '.copilot-tracking/skraft-plans/pricing/results/research-1-1.json'
          pattern: '(?s)"status"\s*:\s*"(?:done|blocked)".*"summary"\s*:\s*".+"'
      - type: run-command
        name: Findings cite the source files that were investigated
        config:
          command: grep
          args:
            - '-E'
            - '-q'
            - '#file:src/CheckoutPricing\.(Domain|Application)/[A-Za-z]+\.cs'
            - '.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md'
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: Production and test sources stay untouched
        config:
          command: bash
          args:
            - '-lc'
            - '[ -z "$(git status --porcelain -- src tests)" ]'
          expected_exit_code: 0
          timeout: 30s
      - type: run-command
        name: No decision of record is taken during investigation
        config:
          command: bash
          args:
            - '-lc'
            - '[ -z "$(git status --porcelain -- docs/adr)" ]'
          expected_exit_code: 0
          timeout: 30s

  - name: Fourteen-criteria pricing story is researched on a repository with no code
    prompt: |
      I want to research the `discount` story of the Checkout Pricing project before anyone
      designs it. The story and its acceptance criteria are agreed; the repository holds no code yet.
      Leave the investigation the designer will start from.

      For this run, fill `.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md`
      in place. Write the run result JSON to
      `.copilot-tracking/skraft-plans/pricing/results/research-1-1.json`.
    tags:
      agent: solution-researcher
      scenario: fourteen-criteria-greenfield-research
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    environment:
      files:
        - src: fixtures/new/.copilot-tracking/skraft-plans/pricing/plans/2026-08-07/ac-draft-discount.md
          dest: .copilot-tracking/skraft-plans/pricing/plans/2026-08-07/ac-draft-discount.md
        - src: fixtures/new/.copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
          dest: .copilot-tracking/skraft-plans/pricing/plans/2026-08-07/stories-m1.md
        - src: fixtures/new/README.md
          dest: README.md
        - src: fixtures/new/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/new/research.template.md
          dest: .copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md
      commands:
        - 'git init --quiet --object-format=sha1'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        - 'git add .'
        - 'git commit --quiet -m "chore: refined discount story, no code"'
        - 'mkdir -p .copilot-tracking/skraft-plans/pricing/results'
    graders:
      - type: completed
      - type: diff-contains
        name: Investigation lands in the RESEARCH artefact location
        config:
          pattern: '\.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research\.md'
      - type: file-not-matches
        name: The research document contains no unfilled template markers
        config:
          path: '.copilot-tracking/skraft-plans/pricing/research/2026-08-07/discount-research.md'
          pattern: '\{\{[^}]+\}\}'
      - type: file-matches
        name: The run result records a completed or a blocked investigation
        config:
          path: '.copilot-tracking/skraft-plans/pricing/results/research-1-1.json'
          pattern: '(?s)"status"\s*:\s*"(?:done|blocked)".*"summary"\s*:\s*".+"'
      - type: run-command
        name: No source, test or design document is written during investigation
        config:
          command: bash
          args:
            - '-lc'
            - '[ -z "$(git status --porcelain -- src tests docs)" ]'
          expected_exit_code: 0
          timeout: 30s
