name: software-engineer-delivery
version: 0.1.0
description: Verifies that the real SKRAFT Software Engineer drives an approved .NET Clean Architecture behavior through the human RED checkpoint to GREEN, preserves layer boundaries and the outer test, and deposits stack-specific quality evidence.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 15m
  model: claude-sonnet-5
  runs: 3
scoring:
  # 0.9, not 1.0. A trial that misses one grader and a trial that misses six
  # score identically at 1.0, which erases the difference between an arm that
  # nearly did the work and one that did not start it. The paired verdict never
  # used this threshold - it compares continuous grader scores - so this changes
  # what is reported as a pass, not what is measured.
  threshold: 0.9
stimuli:
  - name: Approved .NET loyalty discount reaches GREEN with Clean Architecture evidence
    turns:
      - I want to develop the `discount` feature for the Checkout Pricing project.
      - The test is correct, continue. Complete the feature.
    tags:
      agent: software-engineer
      scenario: approved-dotnet-delivery
      permissions: workspace-write
      cost: medium
    supported_executors:
      - skraft-agent-runner
    constraints:
      max_turns: 2
      max_duration: 15m
    environment:
      files:
        - src: fixtures/approved-red/.gitignore
          dest: .gitignore
        - src: fixtures/approved-red/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/approved-red/CheckoutPricing.slnx
          dest: CheckoutPricing.slnx
        - src: fixtures/approved-red/Directory.Build.props
          dest: Directory.Build.props
        - src: fixtures/approved-red/Directory.Packages.props
          dest: Directory.Packages.props
        - src: fixtures/approved-red/src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
          dest: src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
        - src: fixtures/approved-red/src/CheckoutPricing.Domain/LoyaltyTier.cs
          dest: src/CheckoutPricing.Domain/LoyaltyTier.cs
        - src: fixtures/approved-red/src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
          dest: src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
        - src: fixtures/approved-red/src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
          dest: src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
        - src: fixtures/approved-red/src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
          dest: src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
        - src: fixtures/approved-red/src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
          dest: src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
        - src: fixtures/approved-red/src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
          dest: src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
        - src: fixtures/approved-red/src/CheckoutPricing.Api/Program.cs
          dest: src/CheckoutPricing.Api/Program.cs
        - src: fixtures/approved-red/tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
          dest: tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
        - src: fixtures/approved-red/tests/CheckoutPricing.UnitTest/LoyaltyDiscount/DiscountTests.cs
          dest: tests/CheckoutPricing.UnitTest/LoyaltyDiscount/DiscountTests.cs
        - src: fixtures/approved-red/tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
          dest: tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
        - src: fixtures/approved-red/tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
          dest: tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
        - src: fixtures/approved-red/.copilot-tracking/skraft-plans/pricing/features/discount.feature
          dest: .copilot-tracking/skraft-plans/pricing/features/discount.feature
        - src: fixtures/approved-red/.copilot-tracking/skraft-plans/pricing/details/2026-08-07/impl.md
          dest: .copilot-tracking/skraft-plans/pricing/details/2026-08-07/impl.md
        - src: fixtures/approved-red/.copilot-tracking/skraft-plans/pricing/state.json
          dest: .copilot-tracking/skraft-plans/pricing/state.json
      commands:
        - 'dotnet restore CheckoutPricing.slnx'
        - 'git init --quiet --object-format=sha1'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        # Seed only environment.files, never injected skills/harness or restore outputs.
        - >-
          git -c core.autocrlf=false -c core.attributesFile=/dev/null add --chmod=-x --
          .gitignore skraft-config.json CheckoutPricing.slnx Directory.Build.props Directory.Packages.props
          src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
          src/CheckoutPricing.Domain/LoyaltyTier.cs
          src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
          src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
          src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
          src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
          src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
          src/CheckoutPricing.Api/Program.cs
          tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
          tests/CheckoutPricing.UnitTest/LoyaltyDiscount/DiscountTests.cs
          tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
          tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
          .copilot-tracking/skraft-plans/pricing/features/discount.feature
          .copilot-tracking/skraft-plans/pricing/details/2026-08-07/impl.md
          .copilot-tracking/skraft-plans/pricing/state.json
        - 'git commit --quiet -m "test: approved DISTILL fixture"'
    graders:
      - type: completed
      - type: output-matches
        name: RED checkpoint reported before implementation
        turn: 0
        config:
          pattern: '(?is)(red|failing test).*(validat|approv)|(?:validat|approv).*(red|failing test)'
      - type: run-command
        name: Complete repository test suite is GREEN
        config:
          command: dotnet
          args:
            - test
            - CheckoutPricing.slnx
            - --no-restore
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: Solution build and analyzers are GREEN
        config:
          command: dotnet
          args:
            - build
            - CheckoutPricing.slnx
            - --no-restore
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        name: Clean Architecture dependency tests are GREEN
        config:
          command: dotnet
          args:
            - test
            - tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
            - --no-restore
            - --filter
            - FullyQualifiedName~Architecture
          expected_exit_code: 0
          timeout: 1m
      - type: diff-contains
        name: Production behavior changed
        config:
          pattern: 'src/CheckoutPricing\.(?:Domain|Application)/.*\.cs'
      - type: diff-not-contains
        name: Approved outer acceptance test stayed intact
        config:
          pattern: '(?m)^diff --git a/tests/CheckoutPricing\.UnitTest/LoyaltyDiscount/DiscountTests\.cs '
      - type: diff-contains
        name: Parameterized inner Domain test was added
        config:
          pattern: 'tests/CheckoutPricing\.UnitTest/.*\.cs'
      - type: skill-invocation
        config:
          required:
            - outside-in-tdd
            - craft-discipline
            - clean-architecture-testing
            - mutation-testing
            - quality-gates-evidence-contract
            - quality-gates-dotnet
      - type: run-command
        name: New Git commits use signed feature-scoped messages without invented issues
        config:
          command: node
          args:
            - -e
            - |
              const { execFileSync } = require("node:child_process");
              const assert = require("node:assert/strict");
              const git = (...args) => execFileSync("git", ["--no-replace-objects", ...args], { encoding: "utf8", timeout: 5000 }).trimEnd();
              const roots = git("rev-list", "--max-parents=0", "HEAD").split("\n");
              assert.equal(roots.length, 1, "Expected single fixture root");
              const seed = roots[0];
              assert.equal(git("show", "-s", "--format=%s", seed), "test: approved DISTILL fixture", "Unexpected seed subject");
              // Generated offline: copy the 20 canonical environment.files to their dest paths
              // in a fresh SHA-1 repo, run the explicit setup add above, then git write-tree.
              // Independently verified with hash-object --stdin on each full source file,
              // update-index --cacheinfo 100644 <blob> <dest>, then write-tree in a fresh index.
              // Pins names, modes and full contents; no commit timestamps or writable baseline.
              const expectedSeedTree = "abc2457ea8494e6d8330679049de47de632718d8";
              assert.equal(git("rev-parse", seed + "^{tree}"), expectedSeedTree, "Unexpected initial fixture tree");
              const commits = git("rev-list", seed + "..HEAD").split("\n").filter(Boolean);
              assert.ok(commits.length, "Delivery must create commits after seed");
              for (const sha of commits) {
                assert.ok(git("diff-tree", "--root", "-m", "--no-commit-id", "--name-only", "-r", sha), sha + ": empty commit");
                const message = git("show", "-s", "--format=%B", sha);
                const blocks = message.split(/\n\n+/);
                assert.match(blocks[0], /^(?:feat|fix|chore|refactor|test|docs|build|perf|style|ci)\(discount\)!?: [^\s\n][^\n]*$/, sha + ": feature subject");
                assert.doesNotMatch(message, /#\d+\b|\bGH-\d+\b|https?:\/\/\S+\/issues\/\d+|^\s*Refs:|\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?[ \t]+(?:\S*#|https?:\/\/)/im, sha + ": no issue supplied; omit references and closure");
                const committer = git("show", "-s", "--format=%cn <%ce>", sha);
                const trailers = execFileSync("git", ["interpret-trailers", "--parse"], { input: message, encoding: "utf8", timeout: 5000 }).trimEnd().split("\n");
                assert.ok(trailers.includes("Signed-off-by: " + committer), sha + ": missing committer sign-off");
              }
              console.log("Verified " + commits.length + " new commits after fixture root " + seed);
          expected_exit_code: 0
          timeout: 1m
      - type: file-exists
        name: Quality-gate evidence contract exists
        config:
          path: '.copilot-tracking/skraft-plans/pricing/evidence/2026-08-07/qg.json'
      - type: file-contains
        name: Evidence identifies the .NET adapter
        config:
          path: '.copilot-tracking/skraft-plans/pricing/evidence/2026-08-07/qg.json'
          value: '"tech_adapter": "quality-gates-dotnet"'
      - type: output-not-matches
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
