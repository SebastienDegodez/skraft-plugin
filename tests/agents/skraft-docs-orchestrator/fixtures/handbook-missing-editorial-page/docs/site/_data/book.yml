# book.yml — structure contract for the evaluation handbook.
#
# A deliberately small book: one part, one generated section. Small enough to
# reason about, real enough that scripts/scan-drift.mjs reads it the same way it
# reads the shipped one.
meta:
  title_fr: "SKRAFT — le livre"
  title_en: "SKRAFT — the book"
  langs: [fr, en]

sources:
  workers: "plugins/skraft-framework/com.github.copilot/agents/workers/*/*.agent.md"

parts:
  - id: reference
    sidebar_position: 1
    title_fr: "Référence"
    title_en: "Reference"
    diataxis_mode: reference
    sections:
      - id: workers
        title_fr: "Workers"
        title_en: "Workers"
        generate:
          from: workers
          slug_from: basename
          start_position: 1
          path_fr: "fr/reference/workers/{slug}.md"
          path_en: "en/reference/workers/{slug}.md"

  - id: accueil
    sidebar_position: 0
    title_fr: "Accueil"
    title_en: "Home"
    diataxis_mode: explanation
    pages:
      - id: for-executives
        type: editorial
        label_fr: "Pour les décideurs"
        label_en: "For executives"
        fr: "fr/for-executives.md"
        en: "en/for-executives.md"
        sidebar_position: 1
        purpose_fr: "Ce que SKRAFT change pour une direction technique : ce qui est garanti, ce qui ne l'est pas, et à quel prix."
        purpose_en: "What SKRAFT changes for an engineering leadership: what is guaranteed, what is not, and at what cost."
