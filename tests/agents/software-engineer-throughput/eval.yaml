        - Components:
        - checkout-pricing: . (dotnet), mocking: microcks, contract testing: off, bdd: on, tests: dotnet test CheckoutPricing.slnx --no-restore --filter "Scenario!=S5"
        - Reference no issue in a commit.
        - Scenario: 4 of 5 — "S4 - The WELCOME5 promo code takes 5.00 EUR off after the loyalty discount" (component checkout-pricing)
        - Acceptance tests DISTILL committed, which you never change (a wrong one: stop blocked, naming it):
        - "test(pricing): s4 WELCOME5 promo code": tests/CheckoutPricing.UnitTest/LoyaltyDiscount/PromoCodeTests.cs
        - Make it pass with outside-in TDD, unit tests included, and commit nothing until it passes; change no file of another component than checkout-pricing.
        - Once it passes, commit once, in bash (never PowerShell), naming each file you changed:
