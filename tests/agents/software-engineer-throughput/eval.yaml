              const dir = "tests/CheckoutPricing.UnitTest/ZzOracle";
              const file = dir + "/OracleTests.cs";
              const oracle = `using CheckoutPricing.Application;
              using CheckoutPricing.Domain;
              namespace CheckoutPricing.UnitTest.ZzOracle;
              public sealed class OracleTests
              {
                  [Theory]
                  [InlineData(10_000, LoyaltyTier.Bronze, null, 500)]
                  [InlineData(10_000, LoyaltyTier.Silver, null, 1_000)]
                  [InlineData(10_000, LoyaltyTier.Gold, null, 1_500)]
