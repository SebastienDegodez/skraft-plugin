name: software-engineer-throughput
version: 0.1.0
description: >-
  Throughput benchmark of the real SKRAFT Software Engineer on a fourteen-scenario .NET story
  over three use cases, dispatched one scenario per turn with the engine's DELIVER brief, every
  acceptance test committed by DISTILL, two scenarios already covered by earlier ones. Run at
  two refs through eng/bench-agent-ab.sh to compare cost, time and quality of two versions of
  the agent; a hidden oracle checks every example of the feature whatever tests the agent wrote.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 240m
  model: standard
  runs: 3
scoring:
  threshold: 0.9
stimuli:
  # One session for the fourteen scenario passes: the engine starts a fresh session per pass,
  # the executor cannot. Both arms run the same way, so the comparison holds; the cold start
  # of each pass is not measured.
  - name: Fourteen-scenario .NET pricing story reaches GREEN one scenario per pass
    turns:
      - |
        ## Skraft dispatch: software-engineer (DELIVER)
        - Story: discount
        - Feature scope: pricing
        - Attempt: 1 of 3
        - Skills (read each before you start):
        - mocking-microcks-dotnet
        - Read first:
        - docs/features/pricing/discount.feature
        - .copilot-tracking/skraft-plans/pricing/details/2026-08-07/impl.md
        - Fill each output in place; keep the path, create no other copy:
        - .copilot-tracking/skraft-plans/pricing/changes/2026-08-07/change-log.md
        - Write your result as JSON to .copilot-tracking/skraft-plans/pricing/results/deliver-1-1.json: {"status": "done" | "blocked", "summary": "<what you did, or why you cannot go on>"}
        - Change nothing outside these paths of the working copy; the engine refuses the step otherwise:
        - .copilot-tracking/skraft-plans/pricing
        - src
        - tests
        - ./* (the files right in the root of checkout-pricing)
        - Components:
        - checkout-pricing: . (dotnet), mocking: microcks, contract testing: off, bdd: on, tests: dotnet test CheckoutPricing.slnx --no-restore --filter "Scenario!=S2&Scenario!=S3&Scenario!=S4&Scenario!=S5&Scenario!=S6&Scenario!=S7&Scenario!=S8&Scenario!=S9&Scenario!=S10&Scenario!=S11&Scenario!=S12&Scenario!=S13&Scenario!=S14"
        - Reference no issue in a commit.
        - Scenario: 1 of 14 — "S1 - Member receives the loyalty discount of their tier" (component checkout-pricing)
        - Acceptance tests DISTILL committed, which you never change (a wrong one: stop blocked, naming it):
        - "test: approved DISTILL fixture": tests/CheckoutPricing.UnitTest/LoyaltyDiscount/DiscountTests.cs
        - Make it pass with outside-in TDD, unit tests included, and commit nothing until it passes; change no file of another component than checkout-pricing.
        - Once it passes, commit once, in bash (never PowerShell), naming each file you changed:
          dotnet test CheckoutPricing.slnx --no-restore --filter "Scenario!=S2&Scenario!=S3&Scenario!=S4&Scenario!=S5&Scenario!=S6&Scenario!=S7&Scenario!=S8&Scenario!=S9&Scenario!=S10&Scenario!=S11&Scenario!=S12&Scenario!=S13&Scenario!=S14" && git add <each file you changed> && git commit -s -m "feat(pricing): s1 tier loyalty discount"
