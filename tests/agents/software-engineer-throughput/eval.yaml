name: software-engineer-throughput
version: 0.1.0
description: >-
  Throughput benchmark of the real SKRAFT Software Engineer on a five-scenario .NET story
  (about 25 inner TDD cycles). Run at two refs through eng/bench-agent-ab.sh to compare
  cost, time and quality of two versions of the agent; a hidden oracle checks every
  example of the feature whatever tests the agent wrote.
type: capability
defaults:
  executor: skraft-agent-runner
  timeout: 90m
  model: claude-sonnet-5.5
  runs: 3
scoring:
  threshold: 0.9
stimuli:
  - name: Five-scenario .NET pricing story reaches GREEN
    turns:
      - I want to develop the `discount` feature for the Checkout Pricing project.
      - The test is correct, continue. Complete the feature.
    tags:
      agent: software-engineer
      scenario: five-scenario-dotnet-delivery
      permissions: workspace-write
      cost: high
    supported_executors:
      - skraft-agent-runner
    constraints:
      max_turns: 2
      max_duration: 90m
    environment:
      files:
        - src: fixtures/five-scenarios/.gitignore
          dest: .gitignore
        - src: fixtures/five-scenarios/skraft-config.json
          dest: skraft-config.json
        - src: fixtures/five-scenarios/CheckoutPricing.slnx
          dest: CheckoutPricing.slnx
        - src: fixtures/five-scenarios/Directory.Build.props
          dest: Directory.Build.props
        - src: fixtures/five-scenarios/Directory.Packages.props
          dest: Directory.Packages.props
        - src: fixtures/five-scenarios/src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
          dest: src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
        - src: fixtures/five-scenarios/src/CheckoutPricing.Domain/LoyaltyTier.cs
          dest: src/CheckoutPricing.Domain/LoyaltyTier.cs
        - src: fixtures/five-scenarios/src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
          dest: src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
        - src: fixtures/five-scenarios/src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
          dest: src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
        - src: fixtures/five-scenarios/src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
          dest: src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
        - src: fixtures/five-scenarios/src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
          dest: src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
        - src: fixtures/five-scenarios/src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
          dest: src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
        - src: fixtures/five-scenarios/src/CheckoutPricing.Api/Program.cs
          dest: src/CheckoutPricing.Api/Program.cs
        - src: fixtures/five-scenarios/tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
          dest: tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
        - src: fixtures/five-scenarios/tests/CheckoutPricing.UnitTest/LoyaltyDiscount/DiscountTests.cs
          dest: tests/CheckoutPricing.UnitTest/LoyaltyDiscount/DiscountTests.cs
        - src: fixtures/five-scenarios/tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
          dest: tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
        - src: fixtures/five-scenarios/tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
          dest: tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
        - src: fixtures/five-scenarios/.copilot-tracking/skraft-plans/pricing/features/discount.feature
          dest: .copilot-tracking/skraft-plans/pricing/features/discount.feature
        - src: fixtures/five-scenarios/.copilot-tracking/skraft-plans/pricing/details/2026-08-07/impl.md
          dest: .copilot-tracking/skraft-plans/pricing/details/2026-08-07/impl.md
        - src: fixtures/five-scenarios/.copilot-tracking/skraft-plans/pricing/state.json
          dest: .copilot-tracking/skraft-plans/pricing/state.json
      commands:
        - 'dotnet restore CheckoutPricing.slnx'
        - 'git init --quiet --object-format=sha1'
        - 'git config user.email eval@example.invalid'
        - 'git config user.name "SKRAFT Eval"'
        # Seed only environment.files, never injected skills/harness or restore outputs.
        - >-
          git -c core.autocrlf=false -c core.attributesFile=/dev/null add --chmod=-x --
          .gitignore skraft-config.json CheckoutPricing.slnx Directory.Build.props Directory.Packages.props
          src/CheckoutPricing.Domain/CheckoutPricing.Domain.csproj
          src/CheckoutPricing.Domain/LoyaltyTier.cs
          src/CheckoutPricing.Application/CheckoutPricing.Application.csproj
          src/CheckoutPricing.Application/CalculateLoyaltyDiscount.cs
          src/CheckoutPricing.Infrastructure/CheckoutPricing.Infrastructure.csproj
          src/CheckoutPricing.Infrastructure/InfrastructureMarker.cs
          src/CheckoutPricing.Api/CheckoutPricing.Api.csproj
          src/CheckoutPricing.Api/Program.cs
          tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj
          tests/CheckoutPricing.UnitTest/LoyaltyDiscount/DiscountTests.cs
          tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
          tests/CheckoutPricing.IntegrationTest/Architecture/ArchitectureTests.cs
          .copilot-tracking/skraft-plans/pricing/features/discount.feature
          .copilot-tracking/skraft-plans/pricing/details/2026-08-07/impl.md
          .copilot-tracking/skraft-plans/pricing/state.json
        - 'git commit --quiet -m "test: approved DISTILL fixture"'
    graders:
      - type: completed
      - type: run-command
        name: Hidden oracle accepts every example of the feature
        config:
          command: node
          args:
            - -e
            - |
              const { execFileSync } = require("node:child_process");
              const { mkdirSync, writeFileSync, rmSync } = require("node:fs");
              const dir = "tests/CheckoutPricing.UnitTest/ZzOracle";
              const file = dir + "/OracleTests.cs";
              const oracle = `using CheckoutPricing.Application;
              using CheckoutPricing.Domain;
              namespace CheckoutPricing.UnitTest.ZzOracle;
              public sealed class OracleTests
              {
                  [Theory]
                  [InlineData(10_000, LoyaltyTier.Bronze, null, 500)]
                  [InlineData(10_000, LoyaltyTier.Silver, null, 1_000)]
                  [InlineData(10_000, LoyaltyTier.Gold, null, 1_500)]
                  [InlineData(20_000, LoyaltyTier.Gold, null, 2_000)]
                  [InlineData(30_000, LoyaltyTier.Silver, null, 2_000)]
                  [InlineData(12_000, LoyaltyTier.Gold, null, 1_800)]
                  [InlineData(2_999, LoyaltyTier.Gold, null, 0)]
                  [InlineData(3_000, LoyaltyTier.Gold, null, 450)]
                  [InlineData(10_000, LoyaltyTier.Silver, "WELCOME5", 1_500)]
                  [InlineData(20_000, LoyaltyTier.Gold, "WELCOME5", 2_500)]
                  [InlineData(2_000, LoyaltyTier.Bronze, "WELCOME5", 500)]
                  [InlineData(10_000, LoyaltyTier.Silver, "SUMMER", 1_000)]
                  [InlineData(7, LoyaltyTier.Gold, null, 0)]
                  [InlineData(400, LoyaltyTier.Bronze, "WELCOME5", 400)]
                  public void Discount(int subtotal, LoyaltyTier tier, string? code, int discount)
                  {
                      var quote = new CalculateLoyaltyDiscount().Handle(new CalculateLoyaltyDiscountQuery(subtotal, tier, code));
                      Assert.Equal(new LoyaltyDiscountQuote(subtotal, discount, subtotal - discount, tier), quote);
                  }

                  [Theory]
                  [InlineData(4_999, LoyaltyTier.Bronze, 490)]
                  [InlineData(5_000, LoyaltyTier.Bronze, 0)]
                  [InlineData(4_999, LoyaltyTier.Silver, 490)]
                  [InlineData(1_000, LoyaltyTier.Gold, 0)]
                  public void Shipping(int total, LoyaltyTier tier, int fee) =>
                      Assert.Equal(fee, new CalculateShippingFee().Handle(new CalculateShippingFeeQuery(total, tier)));
              }
              `;
              mkdirSync(dir, { recursive: true });
              writeFileSync(file, oracle);
              try {
                execFileSync("dotnet", ["test", "tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj", "--no-restore", "--filter", "FullyQualifiedName~ZzOracle"], { stdio: "inherit", timeout: 170000 });
              } finally {
                rmSync(dir, { recursive: true, force: true });
              }
          expected_exit_code: 0
          timeout: 3m
      - type: run-command
        name: Complete repository test suite is GREEN
        config:
          command: dotnet
          args:
            - test
            - CheckoutPricing.slnx
            - --no-restore
          expected_exit_code: 0
          timeout: 3m
      - type: run-command
        name: Clean Architecture dependency tests are GREEN
        config:
          command: dotnet
          args:
            - test
            - tests/CheckoutPricing.IntegrationTest/CheckoutPricing.IntegrationTest.csproj
            - --no-restore
            - --filter
            - FullyQualifiedName~Architecture
          expected_exit_code: 0
          timeout: 2m
      - type: diff-not-contains
        name: Approved S1 acceptance test stayed intact
        config:
          pattern: '(?m)^diff --git a/tests/CheckoutPricing\.UnitTest/LoyaltyDiscount/DiscountTests\.cs '
      - type: run-command
        name: Every scenario has its own red test commit before its green
        config:
          command: node
          args:
            - -e
            - |
              const { execFileSync } = require("node:child_process");
              const assert = require("node:assert/strict");
              const git = (...args) => execFileSync("git", ["--no-replace-objects", ...args], { encoding: "utf8", timeout: 5000 }).trimEnd();
              const seed = git("rev-list", "--max-parents=0", "HEAD");
              const subjects = git("log", "--reverse", "--format=%s", seed + "..HEAD").split("\n").filter(Boolean);
              const tests = subjects.filter((subject) => /^test\(/.test(subject)).length;
              const features = subjects.filter((subject) => /^feat\(/.test(subject)).length;
              assert.ok(tests >= 4, "expected a test commit for S2..S5, got " + tests);
              assert.ok(features >= 5, "expected a feat commit per scenario, got " + features);
              console.log(subjects.join("\n"));
          expected_exit_code: 0
          timeout: 1m
      - type: skill-invocation
        name: The Java, Python and React Clean Architecture skills stayed out of a .NET solution
        config:
          disallowed:
            - clean-architecture-java
            - clean-architecture-python
            - clean-architecture-react
      - type: output-not-matches
        config:
          pattern: '(?i)(?:\[SKILL MISSING\]|skills? could not be loaded|skill directory not present)'
