                  [InlineData(2_000, LoyaltyTier.Bronze, "WELCOME5", 500)]
                  [InlineData(20_000, LoyaltyTier.Gold, "WELCOME5", 2_500)]
                  [InlineData(30_000, LoyaltyTier.Silver, "WELCOME5", 2_500)]
                  [InlineData(10_000, LoyaltyTier.Silver, "welcome5", 1_500)]
                  [InlineData(10_000, LoyaltyTier.Silver, "Welcome5", 1_500)]
                  [InlineData(10_000, LoyaltyTier.Silver, "SUMMER10", 1_900)]
                  [InlineData(30_000, LoyaltyTier.Bronze, "SUMMER10", 3_000)]
                  [InlineData(2_000, LoyaltyTier.Gold, "SUMMER10", 200)]
                  [InlineData(10_000, LoyaltyTier.Silver, "SPRING", 1_000)]
                  [InlineData(10_000, LoyaltyTier.Platinum, null, 2_000)]
                  [InlineData(5_000, LoyaltyTier.Platinum, null, 1_000)]
                  [InlineData(20_000, LoyaltyTier.Platinum, null, 2_000)]
                  [InlineData(400, LoyaltyTier.Bronze, "WELCOME5", 400)]
                  [InlineData(300, LoyaltyTier.Gold, "WELCOME5", 300)]
                  [InlineData(7, LoyaltyTier.Gold, null, 0)]
                  [InlineData(4_321, LoyaltyTier.Silver, "SUMMER10", 820)]
                  public void Discount(int subtotal, LoyaltyTier tier, string? code, int discount) =>
                      Assert.Equal(
                          new LoyaltyDiscountQuote(subtotal, discount, subtotal - discount, tier),
                          new CalculateLoyaltyDiscount().Handle(new CalculateLoyaltyDiscountQuery(subtotal, tier, code)));

                  [Theory]
                  [InlineData(4_999, LoyaltyTier.Bronze, false, 490)]
                  [InlineData(5_000, LoyaltyTier.Bronze, false, 0)]
                  [InlineData(4_999, LoyaltyTier.Silver, false, 490)]
                  [InlineData(1_000, LoyaltyTier.Gold, false, 0)]
                  [InlineData(1_000, LoyaltyTier.Platinum, false, 0)]
                  [InlineData(10_000, LoyaltyTier.Bronze, true, 990)]
                  [InlineData(1_000, LoyaltyTier.Gold, true, 990)]
                  [InlineData(1_000, LoyaltyTier.Platinum, true, 0)]
                  public void Shipping(int payable, LoyaltyTier tier, bool express, int fee) =>
                      Assert.Equal(fee, new CalculateShippingFee().Handle(new CalculateShippingFeeQuery(payable, tier, express)));

                  [Theory]
                  [InlineData(10_000, LoyaltyTier.Silver, "WELCOME5", false, 8_500, 0, 8_500)]
                  [InlineData(5_000, LoyaltyTier.Bronze, null, false, 4_750, 490, 5_240)]
                  [InlineData(20_000, LoyaltyTier.Platinum, "SUMMER10", true, 16_500, 0, 16_500)]
                  [InlineData(2_000, LoyaltyTier.Gold, null, true, 2_000, 990, 2_990)]
                  public void Checkout(int subtotal, LoyaltyTier tier, string? code, bool express, int payable, int shipping, int total) =>
                      Assert.Equal(
                          new CheckoutQuote(payable, shipping, total),
                          new QuoteCheckout().Handle(new QuoteCheckoutQuery(subtotal, tier, code, express)));
              }
              `;
              mkdirSync(dir, { recursive: true });
              writeFileSync(file, oracle);
              try {
                execFileSync("dotnet", ["test", "tests/CheckoutPricing.UnitTest/CheckoutPricing.UnitTest.csproj", "--no-restore", "--filter", "FullyQualifiedName~ZzOracle"], { stdio: "inherit", timeout: 170000 });
              } finally {
