apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: "Promotions API - 1.0.0"
spec:
  examples:
    getActivePromotion:
      "Happy hour 15% active":
        response:
          code: 200
          headers:
            Content-Type: "application/json"
          body: |
            {
              "code": "HAPPYHOUR",
              "rate": 0.15,
              "active": true
            }
