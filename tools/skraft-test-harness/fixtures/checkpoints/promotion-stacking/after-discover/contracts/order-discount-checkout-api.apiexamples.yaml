apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: "Order Discount Checkout API - 1.0.0"
spec:
  examples:
    checkout:
      "Gold checkout":
        request:
          parameters:
            orderId: "a1111111-1111-1111-1111-111111111111"
            tier: "Gold"
        response:
          code: 200
          headers:
            Content-Type: "application/json"
          body: |
            {
              "orderId": "a1111111-1111-1111-1111-111111111111",
              "payableTotal": 95.0
            }

      "Order not found":
        request:
          parameters:
            orderId: "b2222222-2222-2222-2222-222222222222"
            tier: "Gold"
        response:
          code: 404
          headers:
            Content-Type: "application/problem+json"
          body: |
            {
              "title": "Order not found",
              "status": 404,
              "detail": "Order 'b2222222-2222-2222-2222-222222222222' was not found."
            }
