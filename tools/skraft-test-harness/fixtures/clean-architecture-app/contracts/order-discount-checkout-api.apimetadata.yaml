apiVersion: mocks.microcks.io/v1alpha1
kind: APIMetadata
metadata:
  name: "Order Discount Checkout API - 1.0.0"
spec:
  operations:
    - name: "POST /orders/{orderId}/checkout"
      dispatcher: JS
      dispatcherRules: |
        function dispatch(request) {
          if (request.params.orderId === "a1111111-1111-1111-1111-111111111111") {
            return "Gold checkout";
          }
          return "Order not found";
        }
