openapi: 3.1.0
info:
  title: Order Discount Checkout API
  version: 1.0.0
  description: Applies the loyalty-tier discount to an order and returns the payable total.
paths:
  /orders/{orderId}/checkout:
    post:
      operationId: checkout
      summary: Apply the loyalty discount and return the payable total.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Identifier of an existing order.
          schema:
            type: string
            format: uuid
        - name: tier
          in: query
          required: true
          description: Loyalty tier of the customer.
          schema:
            type: string
            enum: [Green, Gold, Platinum]
      responses:
        "200":
          description: The order's payable total after the tier discount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "404":
          description: No order exists for the supplied identifier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    CheckoutResult:
      type: object
      required: [orderId, payableTotal]
      properties:
        orderId:
          type: string
          format: uuid
        payableTotal:
          type: number
          format: double
    ProblemDetails:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
