# book.yml — CONTRAT DE STRUCTURE DU LIVRE SKRAFT (source de verite unique)
#
# Ce manifeste est lu par :
#   - docs/website/sidebars.mjs (via src/book/sidebars-from-book.mjs) : une sidebar
#     Docusaurus par partie Diataxis, une categorie par section, un doc par page ;
#   - docs/website/scripts/book-translations.mjs : les libelles FR de ces sidebars
#     (i18n/fr/docusaurus-plugin-content-docs/current.json, verifie par --check) ;
#   - scripts/scan-drift.mjs et scripts/lint-nav.mjs (via scripts/lib/book.mjs) :
#     detection deterministe des ecarts contrat <-> fichiers <-> sources ;
#   - les workflows gh-aw skraft-docs-sync et skraft-docs-gaps, qui reparent
#     les ecarts que scan-drift signale, par une pull request relue par un humain.
#
# Regles dures :
#   1. Diataxis strict : une page = un seul mode, celui de sa partie
#      (`diataxis_mode` : tutorial | how-to | reference | explanation). Une page
#      de reference decrit, elle n'explique pas le pourquoi : elle renvoie a la
#      page d'explication. Une page d'explication ne donne pas de marche a suivre.
#   2. Toute page listee ici existe en EN (docs/website/docs/<doc>.md) ET en FR
#      (docs/website/i18n/fr/docusaurus-plugin-content-docs/current/<doc>.md),
#      avec la meme structure de titres. `.mdx` seulement quand la page contient
#      du JSX (lint-nav : NAV-MDX-NO-JSX).
#   3. Une page porte un seul identifiant `doc` : son chemin anglais, sans
#      extension (ex. `reference/glossary`). Les fichiers FR et EN ont donc le meme
#      chemin relatif et le meme nom, par construction.
#   4. Une affirmation attribuee a un auteur cite sa source depuis
#      `data/citations.yml` (auteur, ouvrage, annee) ; scripts/check-citations.mjs
#      refuse une cle inconnue. Une page sans affirmation attribuee ne porte pas
#      de citation.
#   5. Tout fait sur le produit est verifie dans le code du plugin. Un chiffre non
#      sourcable depuis le code est formule qualitativement, jamais invente.
#   6. Toute page de la partie `reference` respecte `reference_template` ; les
#      autres parties respectent `editorial_template`.
#   7. Tout pattern / gate present dans `sources` est couvert par une page
#      `derived`. Agents, skills, workers et lentilles sont couverts exactement
#      une fois par le catalogue dashboard (section `ownership: dashboard`).
#
# Navigation : une partie Diataxis porte `slug` (la route de sa page d'index
# generee) ; une section porte `intro_fr`/`intro_en` (une phrase, la description
# de sa page d'index generee, route `<slug de la partie>/<id>`). Une section ne
# porte `slug` que si cette route est deja celle d'un doc (lint-nav :
# NAV-SLUG-COLLISION).
#
# `type` : derived   (regenerable depuis `source` par skraft-docs-sync)
#        | editorial (redigee et relue par un humain ; un workflow ne la cree
#                     que si elle manque, et ne la reecrit que pour un ecart
#                     signale par scan-drift : lien casse, recit d'orchestration
#                     perime, parite FR/EN)
#        | dashboard (rendue depuis les donnees du catalogue).

meta:
  title_fr: "SKRAFT — le livre"
  title_en: "SKRAFT — the book"
  langs: [fr, en]

  # Design : une sidebar Docusaurus par partie Diataxis (les quatre portes de la
  # navbar), theme classique, mesure du contenu ~72 caracteres.
  design:
    layout: docusaurus-docs       # docs Docusaurus, sidebars derivees de `parts`
    sidebar_grouped_by: parts     # une sidebar par partie, une categorie par section
    theme: docusaurus-classic
    content_measure: 72ch
    artifacts:
      sidebars: "docs/website/sidebars.mjs"
      sidebars_generator: "docs/website/src/book/sidebars-from-book.mjs"
      translations: "docs/website/scripts/book-translations.mjs"
      stylesheet: "docs/website/src/css/custom.css"

  # Admonitions colorees, rendues depuis des fences `:::type ... :::` ou des
  # blockquotes. A utiliser pour signaler risques et notes.
  admonitions: [note, info, tip, caution, warning, danger]

  # GABARIT DES PAGES DE LA PARTIE `reference` (Diataxis : decrire, pas expliquer).
  # Seuls le titre et l'accroche sont requis ; le contenu factuel s'organise en
  # sections propres (synopsis, tableaux, schemas). Le pourquoi vit dans la page
  # d'explication liee, en une ligne de renvoi.
  reference_template:
    frontmatter:
      required: [title, description]
      optional: [persona, sidebar_position]
    blocks:
      - id: title
        required: true
        fr: "# Titre"
        en: "# Title"
      - id: intro-callout
        required: true
        fr: "Ce que la page decrit, en une phrase (blockquote)"
        en: "What the page describes, in one sentence (blockquote)"
      - id: explanation-link
        required: false
        fr: "Une ligne de renvoi vers la page d'explication qui donne le pourquoi"
        en: "One line pointing to the explanation page that gives the why"
      - id: facts
        required: false
        fr: "Sections factuelles : synopsis, tableaux, schemas, valeurs exactes"
        en: "Factual sections: synopsis, tables, diagrams, exact values"
      - id: see-also
        required: false
        fr: "## Voir aussi (liens internes)"
        en: "## See also (internal links)"
      - id: sources
        required: false   # seulement quand la page cite une source (regle 4)
        fr: "## Sources — depuis citations.yml (auteur, ouvrage, annee)"
        en: "## Sources — from citations.yml (author, work, year)"

  # GABARIT DES AUTRES PARTIES (tutoriel, guide pratique, explication, accueil).
  # Le corps suit le mode Diataxis de la partie, et lui seul.
  editorial_template:
    frontmatter:
      required: [title, description]
      optional: [persona, sidebar_position]
    blocks:
      - id: title
        fr: "# Titre"
        en: "# Title"
      - id: intro-callout
        fr: "Accroche en une phrase (blockquote), ou le but pour un guide"
        en: "One-sentence hook (blockquote), or the goal for a how-to"
      - id: body
        fr: "tutorial : parcours guide qui marche a coup sur ; how-to : but, prerequis, etapes, depannage ; explanation : pourquoi -> comment, jargon defini en ligne"
        en: "tutorial: a guided path that always works; how-to: goal, prerequisites, steps, troubleshooting; explanation: why -> how, jargon defined inline"
      - id: sources
        fr: "## Sources (si une affirmation est attribuee, regle 4)"
        en: "## Sources (if a claim is attributed, rule 4)"

# Sources derivables : les descripteurs et skills des plugins sous plugins/.
sources:
  # Un arbre physique ; le scanner classe par identite et dedoublonne les chemins.
  agents: "plugins/*/com.github.copilot/agents/*.agent.md"
  # Lentilles de revue adverse et conditionnelles.
  lenses: "plugins/*/com.github.copilot/agents/*-lens.agent.md"
  # Le scanner conserve les deux fidelity lenses dans leur famille worker.
  workers: "plugins/*/com.github.copilot/agents/*.agent.md"
  skills: "plugins/*/skills/*/SKILL.md"
  gates: "plugins/*/skills/*-review-criteria/SKILL.md"
  patterns: "plugins/*/skills/architecture-patterns/SKILL.md"
  citations: "docs/website/data/citations.yml"

# parts — une partie par mode Diataxis (plus l'accueil), dans l'ordre de la
# navbar ; une partie peut se decouper en `sections` (menu a 3 niveaux).
# Chaque page porte label_fr/label_en (libelle de la sidebar : EN dans
# sidebars.mjs, FR dans current.json) ; type/source/purpose servent a
# scan-drift et aux workflows.
parts:
  # ----------------------------------------------------------------- ACCUEIL
  - id: accueil
    icon: "fa-solid fa-house"
    sidebar_position: 0
    title_fr: "Accueil"
    title_en: "Home"
    intro_fr: "Le point d'entree du handbook : ce que SKRAFT apporte et par ou commencer."
    intro_en: "The handbook entry point: what SKRAFT brings and where to start."
    pages:
      - id: home
        type: editorial
        label_fr: "Accueil"
        label_en: "Home"
        doc: index
        purpose_fr: "Page d'accueil : pitch, promesse, routage Diataxis par role."
        purpose_en: "Landing page: pitch, promise, Diataxis routing by role."

  # --------------------------------------------------------------- TUTORIELS
  - id: tutorials
    icon: "fa-solid fa-graduation-cap"
    diataxis_mode: tutorial
    slug: /tutorials
    sidebar_position: 1
    title_fr: "Tutoriels — apprendre"
    title_en: "Tutorials — learn"
    intro_fr: "Des parcours guides ou vous executez : un premier run sous Claude Code, puis sous Copilot CLI, et un premier depot existant transforme en backlog."
    intro_en: "Guided paths where you do things: a first run under Claude Code, then under Copilot CLI, and a first existing repository turned into a backlog."
    pages:
      - id: getting-started
        type: editorial
        label_fr: "Premiers pas"
        label_en: "First steps"
        doc: tutorials/getting-started
        purpose_fr: "Sous Claude Code : installer le plugin, ecrire skraft-config.json, verifier avec doctor, mener une story jusqu'a la description de sa pull request, sur un petit depot."
        purpose_en: "Under Claude Code: install the plugin, write skraft-config.json, check with doctor, run one story to its pull request description, on a small repository."
      - id: first-run-copilot
        type: editorial
        label_fr: "Premier run sous Copilot CLI"
        label_en: "First run under Copilot CLI"
        doc: tutorials/first-run-copilot
        purpose_fr: "Sous GitHub Copilot CLI : lancer une story avec l'agent orchestrateur, repondre dans le chat, suivre le run dans /workflows et le canvas skraft-pipeline, lire skraft report."
        purpose_en: "Under GitHub Copilot CLI: start a story with the orchestrator agent, answer in the chat, follow the run in /workflows and the skraft-pipeline canvas, read skraft report."
      - id: first-brownfield
        type: editorial
        label_fr: "Premier dépôt existant"
        label_en: "First existing repository"
        doc: tutorials/first-brownfield
        purpose_fr: "Faire decrire un code existant par brownfield-analyst, decouper son PRD avec skraft-prd-backlog et relire les stories dans le canvas skraft backlog."
        purpose_en: "Have brownfield-analyst describe existing code, cut its PRD with skraft-prd-backlog and review the stories in the skraft backlog canvas."

  # ----------------------------------------------------------- GUIDES PRATIQUES
  - id: how-to
    icon: "fa-solid fa-screwdriver-wrench"
    diataxis_mode: how-to
    slug: /how-to
    sidebar_position: 2
    title_fr: "Guides pratiques — faire"
    title_en: "How-to guides — do"
    intro_fr: "Resoudre une tache precise : installer le plugin, configurer les composants, lancer les gates, reprendre un run, repondre a une question, choisir les modeles, ajouter une lentille, adapter le workflow, ajouter un agent du depot, revoir une pull request, publier la pull request, migrer depuis la v1, passer d'un PRD au backlog, raffiner une issue, caracteriser puis refactorer un existant, evaluer un skill, proposer un pattern."
    intro_en: "Solve a precise task: install the plugin, configure components, run the gates, resume a run, answer a question, choose the models, add a lens, adapt the workflow, add a repository agent, review a pull request, publish the pull request, migrate from v1, go from a PRD to a backlog, refine an issue, characterize then refactor existing code, evaluate a skill, propose a pattern."
    sections:
      - id: set-up
        title_fr: "Mettre en place"
        title_en: "Set up"
        intro_fr: "Installer skraft, décrire les composants du dépôt, choisir les modèles, migrer depuis la v1."
        intro_en: "Install skraft, describe the repository's components, choose the models, migrate from v1."
        sidebar_position: 1
        pages:
          - id: install-on-a-host
            type: editorial
            label_fr: "Installer skraft sur un hôte"
            label_en: "Install skraft on a host"
            doc: how-to/install-on-a-host
            purpose_fr: "Installer le plugin dans Claude Code, Copilot CLI ou VS Code, puis verifier que l'hote le voit et que la ligne de commande repond."
            purpose_en: "Install the plugin in Claude Code, Copilot CLI or VS Code, then check that the host sees it and that the command line answers."
          - id: configure-components
            type: editorial
            label_fr: "Configurer les composants"
            label_en: "Configure components"
            doc: how-to/configure-components
            purpose_fr: "Detecter les composants, remplacer une commande, ajouter un depot voisin, choisir la base et le mocking, verifier avec doctor."
            purpose_en: "Detect components, replace a command, add a neighbour repository, choose the base and the mocking, check with doctor."
          - id: choose-models
            type: editorial
            label_fr: "Choisir les modèles des agents"
            label_en: "Choose the agents' models"
            doc: how-to/choose-models
            purpose_fr: "Affecter une famille de modele a chaque agent, un modele et un niveau a chaque famille par hote, et verifier avec doctor."
            purpose_en: "Assign a model family to each agent, a model and an effort to each family per host, and check with doctor."
          - id: migrate-from-v1
            type: editorial
            label_fr: "Migrer une copie de travail de la v1"
            label_en: "Migrate a working copy from v1"
            doc: how-to/migrate-from-v1
            purpose_fr: "Convertir la configuration et les runs v1 en cours avec skraft migrate, verifier a blanc, reprendre un run migre, lever les refus."
            purpose_en: "Convert the v1 configuration and runs in progress with skraft migrate, check with a dry run, resume a migrated run, lift the refusals."
      - id: run-a-story
        title_fr: "Mener une story"
        title_en: "Run a story"
        intro_fr: "Lancer les gates, reprendre un run, répondre à ses questions, publier sa pull request."
        intro_en: "Run the gates, resume a run, answer its questions, publish its pull request."
        sidebar_position: 2
        pages:
          - id: run-gates
            type: editorial
            label_fr: "Lancer les gates"
            label_en: "Run the gates"
            doc: how-to/run-gates
            purpose_fr: "Lancer les gates des composants modifies ou de tous, lire leurs preuves, traiter un echec environment ou deterministic."
            purpose_en: "Run the gates of the changed components or of all, read their evidence, handle an environment or deterministic failure."
          - id: resume-a-run
            type: editorial
            label_fr: "Reprendre un run"
            label_en: "Resume a run"
            doc: how-to/resume-a-run
            purpose_fr: "Reprendre apres une interruption, changer de pipeline actif, et lever les refus et blocages courants."
            purpose_en: "Resume after an interruption, switch the active pipeline, and lift the common refusals and blocks."
          - id: answer-a-question
            type: editorial
            label_fr: "Répondre à une question du run"
            label_en: "Answer a run's question"
            doc: how-to/answer-a-question
            purpose_fr: "Repondre a la question qu'un run attend depuis Claude Code (/skraft decide), Copilot (dialogue, skraft_decide) ou un terminal, et ce que devient un refus."
            purpose_en: "Answer the question a run waits on from Claude Code (/skraft decide), Copilot (dialog, skraft_decide) or a terminal, and what becomes of a refusal."
          - id: publish-pull-request
            type: editorial
            label_fr: "Publier la pull request"
            label_en: "Publish the pull request"
            doc: how-to/publish-pull-request
            purpose_fr: "Consentir, preparer gh, laisser le run ouvrir sa pull request ou la publier avec skraft publish, suivre l'issue."
            purpose_en: "Consent, set up gh, let the run open its pull request or publish it with skraft publish, follow the issue."
          - id: attach-screenshots
            type: editorial
            label_fr: "Joindre les captures"
            label_en: "Attach screenshots"
            doc: how-to/attach-screenshots
            purpose_fr: "Declarer la commande e2e d'un frontend et laisser le run joindre ses captures claires et sombres a la pull request."
            purpose_en: "Declare a front end's e2e command and let the run attach its light and dark screenshots to the pull request."
      - id: review
        title_fr: "Revoir"
        title_en: "Review"
        intro_fr: "Faire revoir une pull request et ajouter une lentille à une revue."
        intro_en: "Have a pull request reviewed and add a lens to a review."
        sidebar_position: 3
        pages:
          - id: review-a-pull-request
            type: editorial
            label_fr: "Revoir une pull request avec skraft"
            label_en: "Review a pull request with skraft"
            doc: how-to/review-a-pull-request
            purpose_fr: "Faire passer une pull request par la revue DELIVER sans run, lire le verdict, le garder dans un commentaire."
            purpose_en: "Put a pull request through the DELIVER review with no run, read the verdict, keep it in a comment."
          - id: customise-review
            type: editorial
            label_fr: "Ajouter une lentille à une revue"
            label_en: "Add a lens to a review"
            doc: how-to/customise-review
            purpose_fr: "Ajouter une lentille du depot a la revue de conception ou a la revue DELIVER et verifier le workflow."
            purpose_en: "Add a repository lens to the design review or to the DELIVER review and check the workflow."
      - id: adapt-the-workflow
        title_fr: "Adapter le workflow"
        title_en: "Adapt the workflow"
        intro_fr: "Copier le workflow dans le dépôt et y ajouter un agent du dépôt."
        intro_en: "Copy the workflow into the repository and add a repository agent to it."
        sidebar_position: 4
        pages:
          - id: eject-workflow
            type: editorial
            label_fr: "Copier et adapter le workflow"
            label_en: "Copy and adapt the workflow"
            doc: how-to/eject-workflow
            purpose_fr: "Copier le workflow dans .skraft/, sauter une gate verrouillee avec sa raison, valider avec check, comparer avec diff, le mettre a jour apres une montee de version."
            purpose_en: "Copy the workflow into .skraft/, skip a locked gate with its reason, validate with check, compare with diff, update it after a plugin upgrade."
          - id: add-repository-agent
            type: editorial
            label_fr: "Ajouter un agent du dépôt au pipeline"
            label_en: "Add a repository agent to the pipeline"
            doc: how-to/add-repository-agent
            purpose_fr: "Ecrire un agent du depot, l'ajouter comme noeud du workflow ejecte avec ses sorties et ses chemins d'ecriture, et verifier."
            purpose_en: "Write a repository agent, add it as a node of the ejected workflow with its outputs and write paths, and check."
      - id: backlog
        title_fr: "Backlog"
        title_en: "Backlog"
        intro_fr: "Passer d'un PRD à un backlog GitHub, puis raffiner une issue."
        intro_en: "Go from a PRD to a GitHub backlog, then refine an issue."
        sidebar_position: 5
        pages:
          - id: prd-to-backlog
            type: editorial
            label_fr: "Transformer un PRD en backlog GitHub"
            label_en: "Turn a PRD into a GitHub backlog"
            doc: how-to/prd-to-backlog
            purpose_fr: "Lancer skraft-prd-backlog sur un PRD, repondre au cadrage, approuver la carte des stories, valider le handoff et publier."
            purpose_en: "Run skraft-prd-backlog on a PRD, answer the framing, approve the story map, validate the handoff and publish."
          - id: refine-backlog
            type: editorial
            label_fr: "Raffiner une issue du backlog"
            label_en: "Refine a backlog issue"
            doc: how-to/refine-backlog
            purpose_fr: "Obtenir la proposition de raffinement d'une issue avec /skraft-refine, ou a chaque nouvelle issue avec le workflow gh-aw skraft-refine."
            purpose_en: "Get an issue's refinement proposal with /skraft-refine, or on every new issue with the skraft-refine gh-aw workflow."
      - id: existing-code
        title_fr: "Code existant"
        title_en: "Existing code"
        intro_fr: "Poser un filet de caractérisation, puis refactorer sous ce filet."
        intro_en: "Put a characterization net in place, then refactor under it."
        sidebar_position: 6
        pages:
          - id: characterize-legacy
            type: editorial
            label_fr: "Poser un filet de caractérisation"
            label_en: "Put a characterization net"
            doc: how-to/characterize-legacy
            purpose_fr: "Faire ecrire le contrat et les tests de caracterisation d'un service existant par brownfield-harness-builder, puis lire le verdict."
            purpose_en: "Have brownfield-harness-builder write an existing service's contract and characterization tests, then read the verdict."
          - id: refactor-legacy
            type: editorial
            label_fr: "Refactorer un code existant sous filet"
            label_en: "Refactor existing code under a net"
            doc: how-to/refactor-legacy
            purpose_fr: "Lancer brownfield-refactorer, choisir Mikado ou Strangler Fig et suivre la boucle feuille par feuille ou tranche par tranche."
            purpose_en: "Start brownfield-refactorer, choose Mikado or Strangler Fig and follow the loop leaf by leaf or slice by slice."
      - id: contribute
        title_fr: "Contribuer"
        title_en: "Contribute"
        intro_fr: "Évaluer un skill et proposer un pattern."
        intro_en: "Evaluate a skill and propose a pattern."
        sidebar_position: 7
        pages:
          - id: evaluate-a-skill
            type: editorial
            label_fr: "Évaluer un skill"
            label_en: "Evaluate a skill"
            doc: how-to/evaluate-a-skill
            purpose_fr: "Ecrire la spec d'evaluation, la valider, lancer la comparaison baseline/skill, lire le verdict et le consulter."
            purpose_en: "Write the evaluation spec, validate it, run the baseline/skill comparison, read the verdict and look it up."
          - id: contributing
            type: editorial
            label_fr: "Proposer un pattern"
            label_en: "Propose a pattern"
            doc: how-to/contributing
            purpose_fr: "Proposer un pattern selon genesis (probleme, solution, reference) et corriger une page du handbook en FR et EN."
            purpose_en: "Propose a pattern the genesis way (problem, solution, reference) and fix a handbook page in FR and EN."

  # -------------------------------------------------------------- EXPLICATION
  - id: explanation
    icon: "fa-solid fa-lightbulb"
    diataxis_mode: explanation
    slug: /explanation
    sidebar_position: 3
    title_fr: "Explication — comprendre"
    title_en: "Explanation — understand"
    intro_fr: "Le pourquoi : choisir un parcours, suivre le flux d'artefacts, puis comprendre les mécanismes qui le protègent."
    intro_en: "The why: choose a journey, follow the artifact flow, then understand the mechanisms that protect it."
