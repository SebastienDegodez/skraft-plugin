# nav.yml — barre de navigation (rendue a plat par _layouts/default.html)
#
# Ordre aligne sur la narration du livre (docs/site/_data/book.yml) :
#   vision -> decideurs -> pratique -> catalogue -> contribuer.
#
# Seules les pages EXISTANTES figurent ici. Les pages declarees dans book.yml
# mais pas encore creees (hve-vs-skraft, traces, glossaire, catalogue/*) seront
# ajoutees par le workflow skraft-docs-sync quand elles existeront (il est
# autorise a modifier ce fichier).

# --- Vision -------------------------------------------------------------
- path_fr: "/fr/"
  path_en: "/en/"
  title_fr: "Accueil"
  title_en: "Home"

# --- Pour les decideurs -------------------------------------------------
- path_fr: "/fr/pour-decideurs"
