# nav.yml — barre de navigation du haut (rendue a plat par les layouts)
#
# Modele handbook (aligne sur learning-path-copilot) : on ne garde que les
# PORTES d'entree. Tout le catalogue (agents, skills, gates, lens, patterns,
# citations, contribuer, customisation) vit desormais dans la SIDEBAR gauche
# pilotee par _data/book.yml + _layouts/doc.html — il ne remonte PAS ici.
#
# Ordre : handbook -> decideurs -> demarrer.
# La marque "SKRAFT" et le toggle de langue sont rendus en dur par le layout.

# --- Le handbook (entree dans le livre) ---------------------------------
- path_fr: "/fr/explanation/pipeline/"
  path_en: "/en/explanation/pipeline/"
  title_fr: "Le handbook"
  title_en: "The handbook"
  icon: "fa-solid fa-book-open"

# --- Porte decideurs ----------------------------------------------------
- path_fr: "/fr/explanation/for-executives"
  path_en: "/en/explanation/for-executives"
  title_fr: "Pour décideurs"
  title_en: "For executives"
  icon: "fa-solid fa-chart-line"

# --- Porte praticien ----------------------------------------------------
- path_fr: "/fr/tutorials/getting-started"
  path_en: "/en/tutorials/getting-started"
  title_fr: "Démarrer"
  title_en: "Get started"
  icon: "fa-solid fa-rocket"
