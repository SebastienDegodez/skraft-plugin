        label_en: "Clean Architecture"
        fr: "fr/clean-architecture.md"
        en: "en/clean-architecture.md"
        purpose_fr: "Les couches et les frontieres qui guident la phase DELIVER."
        purpose_en: "The layers and boundaries guiding the DELIVER phase."

  # ------------------------------------------------------------- LE CATALOGUE
  # TOUT y est. Chaque page DERIVED suit le gabarit de page (catalogue_template).
  - id: catalogue
    title_fr: "Le catalogue"
    title_en: "The catalogue"
    intro_fr: "Tout SKRAFT : agents, skills, gates, lens, patterns, citations. Chaque entree explique le POURQUOI avec sa reference (auteur, ouvrage, annee)."
    intro_en: "All of SKRAFT: agents, skills, gates, lenses, patterns, citations. Each entry explains the WHY with its reference (author, work, year)."
    enforce_catalogue_template: true
    pages:
      - id: agents
        type: derived
        label_fr: "Agents"
        label_en: "Agents"
        fr: "fr/reference/agents/index.md"
        en: "en/reference/agents/index.md"
        source: "plugins/agents/*.agent.md"
        purpose_fr: "Les agents du pipeline et leurs reviewers : role, phase, contribution aux pratiques."
        purpose_en: "Pipeline agents and their reviewers: role, phase, contribution to practices."
      - id: skills
        type: derived
        label_fr: "Skills"
        label_en: "Skills"
        fr: "fr/reference/skills/index.md"
        en: "en/reference/skills/index.md"
        source: "plugins/skills/*/SKILL.md"
        purpose_fr: "Les skills (pratiques outillees) : ce qu'elles font, quand les utiliser."
        purpose_en: "Skills (tooled practices): what they do, when to use them."
      - id: gates
