        label_en: "Customization"
        fr: "fr/customisation.md"
        en: "en/customisation.md"
        purpose_fr: "Ce que SKRAFT permet de customiser ET le RISQUE de reduire les controles (gates, lens, reviewers)."
        purpose_en: "What SKRAFT lets you customize AND the RISK of reducing controls (gates, lenses, reviewers)."
        requires_risk_section: true
