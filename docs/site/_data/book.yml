        en: "en/deep-dive/outside-in-tdd.md"
        purpose_fr: "Double boucle, boundary-to-boundary, walking skeleton — l'approche detaillee."
        purpose_en: "Double loop, boundary-to-boundary, walking skeleton — the detailed approach."
      - id: walking-skeleton
        type: editorial
        label_fr: "Walking Skeleton"
        label_en: "Walking Skeleton"
        fr: "fr/deep-dive/walking-skeleton.md"
        en: "en/deep-dive/walking-skeleton.md"
        purpose_fr: "Le squelette ambulant : la plus fine tranche end-to-end qui marche."
        purpose_en: "The walking skeleton: the thinnest end-to-end slice that works."
      - id: review-deep
        type: editorial
        label_fr: "La revue avant la revue (deep)"
        label_en: "Review before review (deep)"
        fr: "fr/deep-dive/review-before-review.md"
        en: "en/deep-dive/review-before-review.md"
        purpose_fr: "Approfondissement : revue adverse a 4 lentilles, synthese ponderee, verdicts."
        purpose_en: "Deep dive: 4-lens adversarial review, weighted synthesis, verdicts."

  # ------------------------------------------------------------- CONTRIBUER
