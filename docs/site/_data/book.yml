# book.yml — CONTRAT DE STRUCTURE DU LIVRE SKRAFT (source de verite unique)
#
# Ce manifeste est le contrat lu par les deux workflows gh-aw :
#   - skraft-docs-sync  : regenere les pages `type: derived` depuis `source`.
#   - skraft-docs-gaps  : detecte les ecarts contrat <-> fichiers <-> sources
#                         et GENERE des pages `type: editorial` COMPLETES
#                         (plus de brouillons a completer a la main).
#
# Regles dures (verifiees par skraft-docs-gaps) :
#   1. Toute page listee ici DOIT exister en FR (`fr`) ET en EN (`en`).
#   2. Toute page `type: derived` DOIT citer source + annee (auteur, titre, annee).
#   3. Toute page de la partie `reference` DOIT respecter le gabarit de page
#      `reference_template` (blocs requis) — comprehensible sans maitrise du craft.
#   4. Tout pattern / gate present dans `sources` doit etre couvert par une page
#      derivee. Agents, skills, workers et lentilles sont couverts exactement une
#      fois par le catalogue dashboard et ses anchors stables.
#   5. La page FR et la page EN d'une meme entree PARTAGENT le meme basename
#      (nom de fichier anglais) ; seul le prefixe de dossier `fr/` vs `en/`
#      change. Ex. `fr/for-executives.md` <-> `en/for-executives.md`. AUCUNE
#      exception : le basename anglais s'applique aussi aux pages dont le titre
#      est francais (ex. `fr/reference/glossary.md`, label "Glossaire").
#
# `type` : derived (regenere mecaniquement depuis `source`) | editorial (redige
#          integralement par l'agent skraft-docs-gaps : page COMPLETE et lisible,
#          sans trou ; un chiffre non sourcable depuis le code est formule
#          qualitativement et suffixe `(estime)`, jamais invente ni laisse vide).

meta:
  title_fr: "SKRAFT — le livre"
  title_en: "SKRAFT — the book"
  langs: [fr, en]

  # Design : inspire du learning-path (sebastiendegodez) et du site principal.
  #   - Theme liquid-glass (deja present dans assets/css/site.css : .glass-*).
  #   - Mise en page "doc" : sidebar groupee par partie (comme les blocs
  #     FONDATIONS / COMPOSITION du learning-path) + contenu max ~820px.
  #   - Highlight vert (var(--color-highlight)), liens actifs a bordure gauche.
  design:
    layout: doc                 # sidebar (parties) + contenu
    sidebar_grouped_by: parts   # chaque `part` = une section de sidebar (h3 majuscule)
    theme: liquid-glass
    content_max_width: 820px
    # Artefacts qui materialisent ce design (opt-in : une page l'active via
    # `layout: doc` dans son frontmatter ; la sidebar est lue depuis `parts`).
    artifacts:
      layout: "docs/site/_layouts/doc.html"
      stylesheet: "docs/site/assets/css/doc.css"

  # Admonitions colorees (style learning-path), rendues depuis des fences
  # `:::type ... :::` ou des blockquotes. A utiliser pour signaler risques et notes.
  admonitions: [note, info, tip, caution, warning, danger]

  # GABARIT DE PAGE impose a CHAQUE page de la partie `reference` (et recommande
  # pour les pages how-to/explanation). L'inspiration du learning-path porte sur le
  # DESIGN (voir `design`), pas sur une notion de "module" : ce sont des pages de
  # reference, pas des exercices. L'agent skraft-docs-gaps ECHOUE si une page de
  # reference omet un bloc requis.
  reference_template:
    frontmatter:
      required: [layout, lang, title, description]
      optional: [persona, sidebar_position]
    blocks:
      - id: title
        required: true
        fr: "# Titre"
        en: "# Title"
      - id: intro-callout
        required: true
        fr: "Accroche en une phrase, sans jargon (blockquote)"
        en: "One-sentence hook, no jargon (blockquote)"
      - id: pourquoi
        required: false   # Diataxis : le pourquoi vit dans la page d'explication liee
        fr: "## Pourquoi — le probleme que ca resout"
        en: "## Why — the problem it solves"
      - id: concepts
        required: false   # le contenu factuel peut s'organiser en sections propres (tableaux, synopsis)
        fr: "## Concepts cles — comment ca marche (schema mermaid + tableaux)"
        en: "## Key concepts — how it works (mermaid diagram + tables)"
      - id: why-citation
        required: false   # Diataxis : une page de reference ne porte pas de citation narrative
        fr: "## Pourquoi cette pratique — citation : auteur, *ouvrage*, annee"
        en: "## Why this practice — citation: author, *work*, year"
      - id: pieges
        required: false
        fr: "## Pieges & anti-patterns"
        en: "## Pitfalls & anti-patterns"
      - id: aller-plus-loin
        required: false
        fr: "## Pour aller plus loin (liens internes)"
        en: "## Going further (internal links)"
      - id: sources
        required: false   # requis seulement quand la page cite une source
        fr: "## Sources — references (auteur, ouvrage, annee) depuis citations.yml"
        en: "## Sources — references (author, work, year) from citations.yml"
      - id: glossaire
        required: true
        fr: "Termes a connaitre definis en ligne (lien vers le glossaire)"
        en: "Terms to know defined inline (link to the glossary)"

  # Gabarit allege pour les pages purement editoriales (vision, contribuer).
  editorial_template:
    frontmatter:
      required: [layout, lang, title, description]
    blocks:
      - id: title
        fr: "# Titre"
        en: "# Title"
      - id: intro-callout
        fr: "Accroche en une phrase (blockquote)"
        en: "One-sentence hook (blockquote)"
      - id: body
        fr: "Sections narratives (Pourquoi -> Comment), jargon defini en ligne"
        en: "Narrative sections (Why -> How), jargon defined inline"
      - id: sources
        fr: "## Sources (si des faits sont avances)"
        en: "## Sources (if claims are made)"

# Sources dérivables (plugin SKRAFT uniquement — HVE n'est PAS scanne ici).
sources:
  # Un arbre physique ; le scanner classe par identite et dedoublonne les chemins.
  agents: "plugins/*/com.github.copilot/agents/*.agent.md"
  # Lentilles de revue adverse et conditionnelles.
  lenses: "plugins/*/com.github.copilot/agents/*-lens.agent.md"
  # Le scanner conserve les deux fidelity lenses dans leur famille worker.
  workers: "plugins/*/com.github.copilot/agents/*.agent.md"
  skills: "plugins/*/skills/*/SKILL.md"
  gates: "plugins/*/skills/*-review-criteria/SKILL.md"
  patterns: "plugins/*/skills/architecture-patterns/SKILL.md"
  citations: "docs/site/_data/citations.yml"

