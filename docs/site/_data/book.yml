        purpose_en: "The core argument: assisted adversarial review filters BEFORE the human. Less rework, lower TTM."
      - id: concepts
        type: editorial
        label_fr: "Concepts"
        label_en: "Concepts"
        fr: "fr/concepts.md"
        en: "en/concepts.md"
        purpose_fr: "Les concepts transverses : phase, agent, reviewer, gate, lens, artefact."
        purpose_en: "Cross-cutting concepts: phase, agent, reviewer, gate, lens, artifact."
      - id: clean-architecture
