# book.yml — CONTRAT DE STRUCTURE DU LIVRE SKRAFT (source de verite unique)
#
# Ce manifeste est le contrat lu par les deux workflows gh-aw :
#   - skraft-docs-sync  : regenere les pages `type: derived` depuis `source`.
#   - skraft-docs-gaps  : detecte les ecarts contrat <-> fichiers <-> sources
#                         et GENERE des pages `type: editorial` COMPLETES
#                         (plus de brouillons a completer a la main).
#
# Regles dures (verifiees par skraft-docs-gaps) :
#   1. Toute page listee ici DOIT exister en FR (`fr`) ET en EN (`en`).
#   2. Toute page `type: derived` DOIT citer source + annee (auteur, titre, annee).
#   3. Toute page de la partie `catalogue` DOIT respecter le gabarit de page
#      `catalogue_template` (blocs requis) — comprehensible sans maitrise du craft.
#   4. Tout pattern / gate / lens / agent / skill present dans `sources` mais
#      absent d'une page derivee declenche un ecart (gap).
#   5. La page FR et la page EN d'une meme entree PARTAGENT le meme basename
#      (nom de fichier anglais) ; seul le prefixe de dossier `fr/` vs `en/`
#      change. Ex. `fr/for-executives.md` <-> `en/for-executives.md`.
#
# `type` : derived (regenere mecaniquement depuis `source`) | editorial (redige
#          integralement par l'agent skraft-docs-gaps : page COMPLETE et lisible,
#          sans trou ; un chiffre non sourcable depuis le code est formule
#          qualitativement et suffixe `(estime)`, jamais invente ni laisse vide).

meta:
  title_fr: "SKRAFT — le livre"
  title_en: "SKRAFT — the book"
  langs: [fr, en]

  # Design : inspire du learning-path (sebastiendegodez) et du site principal.
  #   - Theme liquid-glass (deja present dans assets/css/site.css : .glass-*).
  #   - Mise en page "doc" : sidebar groupee par partie (comme les blocs
  #     FONDATIONS / COMPOSITION du learning-path) + contenu max ~820px.
  #   - Highlight vert (var(--color-highlight)), liens actifs a bordure gauche.
  design:
    layout: doc                 # sidebar (parties) + contenu
    sidebar_grouped_by: parts   # chaque `part` = une section de sidebar (h3 majuscule)
    theme: liquid-glass
    content_max_width: 820px
    # Artefacts qui materialisent ce design (opt-in : une page l'active via
    # `layout: doc` dans son frontmatter ; la sidebar est lue depuis `parts`).
    artifacts:
      layout: "docs/site/_layouts/doc.html"
      stylesheet: "docs/site/assets/css/doc.css"

  # Admonitions colorees (style learning-path), rendues depuis des fences
  # `:::type ... :::` ou des blockquotes. A utiliser pour signaler risques et notes.
  admonitions: [note, info, tip, caution, warning, danger]

  # GABARIT DE PAGE impose a CHAQUE page du catalogue (et recommande pour les
  # pages pratique/decideurs). L'inspiration du learning-path porte sur le DESIGN
  # (voir `design`), pas sur une notion de "module" : ce sont des pages de
  # reference, pas des exercices. L'agent skraft-docs-gaps ECHOUE si une page de
  # catalogue omet un bloc requis.
  catalogue_template:
    frontmatter:
      required: [layout, lang, title, description]
      optional: [persona, sidebar_position]
    blocks:
      - id: title
        required: true
        fr: "# Titre"
        en: "# Title"
      - id: intro-callout
        required: true
        fr: "Accroche en une phrase, sans jargon (blockquote)"
        en: "One-sentence hook, no jargon (blockquote)"
      - id: pourquoi
        required: true
        fr: "## Pourquoi — le probleme que ca resout"
        en: "## Why — the problem it solves"
      - id: concepts
        required: true
        fr: "## Concepts cles — comment ca marche (schema mermaid + tableaux)"
        en: "## Key concepts — how it works (mermaid diagram + tables)"
      - id: why-citation
        required: true
        fr: "## Pourquoi cette pratique — citation : auteur, *ouvrage*, annee"
        en: "## Why this practice — citation: author, *work*, year"
      - id: pieges
        required: false
        fr: "## Pieges & anti-patterns"
        en: "## Pitfalls & anti-patterns"
      - id: aller-plus-loin
        required: false
        fr: "## Pour aller plus loin (liens internes)"
        en: "## Going further (internal links)"
      - id: sources
        required: true
        fr: "## Sources — references (auteur, ouvrage, annee) depuis citations.yml"
        en: "## Sources — references (author, work, year) from citations.yml"
      - id: glossaire
        required: true
        fr: "Termes a connaitre definis en ligne (lien vers le glossaire)"
        en: "Terms to know defined inline (link to the glossary)"

  # Gabarit allege pour les pages purement editoriales (vision, contribuer).
  editorial_template:
    frontmatter:
      required: [layout, lang, title, description]
    blocks:
      - id: title
        fr: "# Titre"
        en: "# Title"
      - id: intro-callout
        fr: "Accroche en une phrase (blockquote)"
        en: "One-sentence hook (blockquote)"
      - id: body
        fr: "Sections narratives (Pourquoi -> Comment), jargon defini en ligne"
        en: "Narrative sections (Why -> How), jargon defined inline"
      - id: sources
        fr: "## Sources (si des faits sont avances)"
        en: "## Sources (if claims are made)"

# Sources dérivables (plugin SKRAFT uniquement — HVE n'est PAS scanne ici).
sources:
  agents: "plugins/agents/*.agent.md"
  lenses: "plugins/agents/reviewer-lenses/*.agent.md"
  skills: "plugins/skills/*/SKILL.md"
  gates: "plugins/skills/*-review-criteria/SKILL.md"
  patterns: "plugins/skills/architecture-patterns/SKILL.md"
  citations: "docs/site/_data/citations.yml"

# parts — sidebar handbook groupee par phase (modele learning-path).
# Chaque page porte label_fr/label_en (libelle lisible affiche dans la sidebar,
# voir _layouts/doc.html). type/source/purpose restent pour le contrat docs-gaps.
parts:
  # ---------------------------------------------------------------- DEMARRER
  - id: demarrer
    title_fr: "Démarrer"
    title_en: "Get started"
    intro_fr: "Les portes d'entree : ce que SKRAFT apporte, sa continuite avec HVE, et comment commencer."
    intro_en: "The entry doors: what SKRAFT brings, its continuity with HVE, and how to start."
    pages:
      - id: home
        type: editorial
        label_fr: "Accueil"
        label_en: "Home"
        fr: "fr/index.md"
        en: "en/index.md"
        purpose_fr: "Page d'accueil : pitch, promesse, preuves, appels a l'action."
        purpose_en: "Landing page: pitch, promise, proof, calls to action."
      - id: hve-vs-skraft
        type: editorial
        label_fr: "HVE → SKRAFT"
        label_en: "HVE → SKRAFT"
        fr: "fr/hve-vs-skraft.md"
        en: "en/hve-vs-skraft.md"
        purpose_fr: "Continuite HVE -> SKRAFT. SKRAFT remplace le workflow RPI par un pipeline SDLC complet (5 phases + reviewers + gates + lens)."
        purpose_en: "HVE -> SKRAFT continuity. SKRAFT replaces the RPI workflow with a full SDLC pipeline (5 phases + reviewers + gates + lenses)."
        requires_diagram: true
      - id: for-executives
        type: editorial
        label_fr: "Pour décideurs"
        label_en: "For executives"
        fr: "fr/for-executives.md"
        en: "en/for-executives.md"
        purpose_fr: "Pourquoi la revue assistee AVANT la revue humaine reduit le TTM. Arguments qualitatifs (jamais de metrique inventee)."
        purpose_en: "Why AI-assisted review BEFORE human review reduces TTM. Qualitative arguments (never an invented metric)."
      - id: getting-started
        type: editorial
        label_fr: "Premiers pas"
        label_en: "First steps"
        fr: "fr/getting-started.md"
        en: "en/getting-started.md"
        purpose_fr: "Installer le plugin et lancer le pipeline en quelques minutes."
        purpose_en: "Install the plugin and run the pipeline in minutes."

  # ------------------------------------------------------------- LE PIPELINE
  - id: pipeline
    title_fr: "Le pipeline"
    title_en: "The pipeline"
    intro_fr: "Les 5 phases et comment elles s'articulent en architecture sur le substrat HVE-Core."
    intro_en: "The 5 phases and how they articulate in architecture on the HVE-Core substrate."
    pages:
      - id: phases
        type: derived
        label_fr: "Vue d'ensemble"
        label_en: "Overview"
        fr: "fr/pipeline/index.md"
        en: "en/pipeline/index.md"
        source: "plugins/agents/*.agent.md"
        purpose_fr: "Les 5 phases DISCOVER -> DISCUSS -> DESIGN -> DISTILL -> DELIVER, un agent par phase, un reviewer independant."
        purpose_en: "The 5 phases DISCOVER -> DISCUSS -> DESIGN -> DISTILL -> DELIVER, one agent per phase, one independent reviewer."
      - id: fil-rouge
        type: editorial
        label_fr: "Le fil rouge (exemple)"
        label_en: "Running example"
        fr: "fr/pipeline/fil-rouge.md"
        en: "en/pipeline/fil-rouge.md"
        purpose_fr: "Tutoriel : une commande Starbucks suivie de l'idee au code a travers les 5 phases (exemple illustratif)."
        purpose_en: "Tutorial: a Starbucks order followed from idea to code across the 5 phases (illustrative example)."
      - id: discover
        type: derived
        label_fr: "DISCOVER"
        label_en: "DISCOVER"
        fr: "fr/pipeline/discover.md"
        en: "en/pipeline/discover.md"
        source: "plugins/agents/backlog-discoverer.agent.md"
        purpose_fr: "Phase DISCOVER : triage et priorisation du backlog."
        purpose_en: "DISCOVER phase: backlog triage and prioritization."
      - id: discuss
        type: derived
        label_fr: "DISCUSS"
        label_en: "DISCUSS"
        fr: "fr/pipeline/discuss.md"
        en: "en/pipeline/discuss.md"
        source: "plugins/agents/backlog-planner.agent.md"
        purpose_fr: "Phase DISCUSS : raffinage des stories (INVEST, DoR)."
        purpose_en: "DISCUSS phase: story refinement (INVEST, DoR)."
      - id: design
        type: derived
        label_fr: "DESIGN"
        label_en: "DESIGN"
        fr: "fr/pipeline/design.md"
        en: "en/pipeline/design.md"
        source: "plugins/agents/solution-architect.agent.md"
        purpose_fr: "Phase DESIGN : Event Modeling, DDD, ADRs, contrats d'interface."
        purpose_en: "DESIGN phase: Event Modeling, DDD, ADRs, interface contracts."
      - id: distill
        type: derived
        label_fr: "DISTILL"
        label_en: "DISTILL"
        fr: "fr/pipeline/distill.md"
        en: "en/pipeline/distill.md"
        source: "plugins/agents/acceptance-designer.agent.md"
        purpose_fr: "Phase DISTILL : scenarios BDD executables et plan de tests."
        purpose_en: "DISTILL phase: executable BDD scenarios and test plan."
      - id: deliver
        type: derived
        label_fr: "DELIVER"
        label_en: "DELIVER"
        fr: "fr/pipeline/deliver.md"
        en: "en/pipeline/deliver.md"
        source: "plugins/agents/software-engineer.agent.md"
        purpose_fr: "Phase DELIVER : Outside-In TDD, Clean Architecture, mutation testing."
        purpose_en: "DELIVER phase: Outside-In TDD, Clean Architecture, mutation testing."
      - id: architecture
        type: editorial
        label_fr: "Architecture"
        label_en: "Architecture"
        fr: "fr/architecture.md"
        en: "en/architecture.md"
        purpose_fr: "Vue d'architecture : comment les phases, agents et reviewers s'assemblent."
        purpose_en: "Architecture view: how phases, agents and reviewers assemble."
      - id: hve-core
        type: derived
        label_fr: "Le substrat HVE-Core"
        label_en: "The HVE-Core substrate"
        fr: "fr/hve-core.md"
        en: "en/hve-core.md"
        source: "plugins/instructions/skraft-state.instructions.md"
        purpose_fr: "Le substrat HVE-Core : state.json, protocole 6-etapes par tour, articulation des phases."
        purpose_en: "The HVE-Core substrate: state.json, 6-step per-turn protocol, phase articulation."
      - id: traces
        type: derived
        label_fr: "Traces & auditabilité"
        label_en: "Traces & auditability"
        fr: "fr/traces.md"
        en: "en/traces.md"
        source: "plugins/instructions/skraft-artifacts.instructions.md"
        purpose_fr: "Les traces laissees par le pipeline : artefacts dates, state.json, PR, verdicts. Auditabilite."
        purpose_en: "The traces left by the pipeline: dated artifacts, state.json, PRs, verdicts. Auditability."

  # ------------------------------------------------------------ LES PRINCIPES
  - id: principes
    title_fr: "Les principes"
    title_en: "Principles"
    intro_fr: "Pourquoi le pipeline est construit ainsi : la revue avant la revue, et les fondations craft."
    intro_en: "Why the pipeline is built this way: review before review, and the craft foundations."
